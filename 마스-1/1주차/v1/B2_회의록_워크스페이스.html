<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2 회의록 워크스페이스</title>
<style>
/* Layout: 왼쪽 사이드바(이동·프로젝트·역할) + 오른쪽 작업 영역. 회의록 원문은 회사 Word 양식 모양에 행 번호를 붙여 보여 준다 */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --sunken: #F7F9FB; --line: #E1E6ED; --line-2: #EDF0F4;
  --ink: #14233A; --ink-2: #4A5B70; --ink-3: #7E8DA1;
  --navy: #0B2E5C; --on-navy: #FFFFFF; --blue: #1F6FD1; --blue-weak: #E8F0FC; --hl: #FFF4C2;
  --ok: #1D7A4E; --ok-bg: #E4F3EB; --warn: #975700; --warn-bg: #FFF1D9; --bad: #C0342A; --bad-bg: #FDEAE8;
  --rev: #5A44B2; --rev-bg: #EEEBFB; --idle: #5E6E82; --idle-bg: #EEF1F5;
  --shadow: 0 1px 2px rgba(11, 46, 92, .05), 0 10px 28px rgba(11, 46, 92, .07);
  --font: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --mono: 'IBM Plex Mono', 'D2Coding', Consolas, ui-monospace, monospace;
  --side: 236px; --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D141E; --surface: #141D2A; --sunken: #111926; --line: #243246; --line-2: #1C2839;
  --ink: #E3E9F1; --ink-2: #A6B3C4; --ink-3: #7C8A9D;
  --navy: #AFC8F0; --on-navy: #0D141E; --blue: #6EA6F6; --blue-weak: #17283F; --hl: #3A3313;
  --ok: #7DD9A6; --ok-bg: #12301F; --warn: #F2BE63; --warn-bg: #33270F; --bad: #FF8F85; --bad-bg: #3A1A19;
  --rev: #B9A8FF; --rev-bg: #251F45; --idle: #A6B3C4; --idle-bg: #1C2735;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D141E; --surface: #141D2A; --sunken: #111926; --line: #243246; --line-2: #1C2839;
  --ink: #E3E9F1; --ink-2: #A6B3C4; --ink-3: #7C8A9D;
  --navy: #AFC8F0; --on-navy: #0D141E; --blue: #6EA6F6; --blue-weak: #17283F; --hl: #3A3313;
  --ok: #7DD9A6; --ok-bg: #12301F; --warn: #F2BE63; --warn-bg: #33270F; --bad: #FF8F85; --bad-bg: #3A1A19;
  --rev: #B9A8FF; --rev-bg: #251F45; --idle: #A6B3C4; --idle-bg: #1C2735;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .3); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 14px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
/* 사이드바 */
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--surface); border-right: var(--divider-width, 1px) solid var(--line); display: flex; flex-direction: column; gap: 18px; padding: 18px 14px max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--navy); color: var(--on-navy); display: grid; place-items: center; font: 700 14px/1 var(--mono); letter-spacing: .02em; flex: none; }
.brand b { display: block; font-size: 15px; color: var(--navy); }
.brand small { display: block; font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 9px; color: var(--ink-2); font-weight: 500; text-align: left; }
.nav button:hover { background: var(--sunken); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--blue-weak); color: var(--blue); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .cnt { margin-left: auto; font: 500 11px/1 var(--mono); padding: 3px 7px; border-radius: 999px; background: var(--rev-bg); color: var(--rev); }
.sect { display: grid; gap: 4px; }
.sect > span { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; padding: 0 10px 2px; }
.pj { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 7px 10px; border-radius: 9px; text-align: left; color: var(--ink-2); width: 100%; }
.pj:hover { background: var(--sunken); }
.pj[aria-pressed="true"] { background: var(--sunken); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.pj i { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--c); }
.pj b { font: 500 12px/1.2 var(--mono); }
.pj em { font-style: normal; font-size: 12px; color: var(--ink-3); display: block; }
.who { margin-top: auto; border-top: var(--divider-width, 1px) solid var(--line); padding-top: 14px; display: grid; gap: 6px; }
.who label { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .06em; padding: 0 4px; }
.who select { width: 100%; border: var(--divider-width, 1px) solid var(--line); background: var(--sunken); border-radius: 9px; padding: 8px 10px; }

/* 상단 */
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: var(--divider-width, 1px) solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top .in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.top h1 { font-size: 18px; font-weight: 700; }
.top .sub { font-size: 12.5px; color: var(--ink-3); }
.top .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { position: relative; }
.search input { width: 260px; max-width: 70vw; border: var(--divider-width, 1px) solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px 8px 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-3); }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(440px, 88vw); max-height: 60vh; overflow: auto; background: var(--surface); border: var(--divider-width, 1px) solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); z-index: 40; padding: 6px; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; }
.results button:hover, .results button:focus-visible { background: var(--sunken); }
.results small { display: block; color: var(--ink-3); font-size: 11.5px; }
.btn { border: var(--divider-width, 1px) solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-weight: 500; color: var(--ink); }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: none; color: var(--blue); }
.btn:disabled { opacity: .45; cursor: default; }

.page { padding-block: 22px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); max-width: 1320px; width: 100%; }
.card { background: var(--surface); border: var(--divider-width, 1px) solid var(--line); border-radius: var(--r); min-width: 0; }
.card > header { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 10px; flex-wrap: wrap; }
.card > header h2 { font-size: 14.5px; font-weight: 600; }
.card > header .note { font-size: 12px; color: var(--ink-3); }
.card > header .act { margin-left: auto; }
.empty { padding: 18px 16px; color: var(--ink-3); font-size: 13px; }

/* 칩·상태 */
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--idle-bg); color: var(--idle); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-진행중 { background: var(--blue-weak); color: var(--blue); }
.s-검토요청 { background: var(--rev-bg); color: var(--rev); }
.s-보완요청 { background: var(--warn-bg); color: var(--warn); }
.s-기한지남 { background: var(--bad-bg); color: var(--bad); }
.s-완료 { background: var(--ok-bg); color: var(--ok); }
.s-예정 { background: var(--idle-bg); color: var(--idle); }
.tag { display: inline-block; font: 500 11px/1.4 var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--sunken); border: var(--divider-width, 1px) solid var(--line); color: var(--ink-2); white-space: nowrap; }
.k-new { background: var(--blue-weak); color: var(--blue); border-color: transparent; }
.k-chg { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.k-ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.k-bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.k-hold { background: var(--idle-bg); color: var(--idle); border-color: transparent; }

/* 홈 */
.hello { display: flex; flex-wrap: wrap; align-items: end; gap: 6px 16px; margin-bottom: 18px; }
.hello h2 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.hello h2 em { font-style: normal; color: var(--blue); }
.hello p { margin: 4px 0 0; color: var(--ink-2); }
.hello .scope { margin-left: auto; font-size: 12.5px; color: var(--ink-3); text-align: right; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { text-align: left; border: var(--divider-width, 1px) solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; position: relative; overflow: hidden; }
.kpi:hover { border-color: var(--blue); }
.kpi span { font-size: 12.5px; color: var(--ink-2); }
.kpi b { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi b small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.kpi i { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--k, transparent); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.rows { display: grid; }
.trow { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 16px 11px 0; border-top: var(--divider-width, 1px) solid var(--line-2); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.trow:hover { background: var(--sunken); }
.trow .bar { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--b, transparent); }
.trow .t { font-weight: 500; }
.trow .m { font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.trow .r { display: grid; justify-items: end; gap: 4px; }
.due { font: 500 12px/1 var(--mono); color: var(--ink-2); }
.due.over { color: var(--bad); } .due.soon { color: var(--warn); }
.risk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 16px; border-top: var(--divider-width, 1px) solid var(--line-2); }
.risk p { margin: 0; }
.risk .m { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.agenda { list-style: none; margin: 0; padding: 4px 16px 14px; display: grid; gap: 0; }
.agenda li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: var(--divider-width, 1px) solid var(--line-2); }
.agenda li:first-child { border-top: 0; }
.agenda .d { font: 500 12px/1.5 var(--mono); color: var(--ink-3); }
.agenda .x { border-left: 2px solid var(--c, var(--line)); padding-left: 10px; }
.agenda .x small { display: block; color: var(--ink-3); font-size: 12px; }
.pcards { display: grid; gap: 0; }
.pcard { padding: 12px 16px; border-top: var(--divider-width, 1px) solid var(--line-2); display: grid; gap: 6px; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.pcard:hover { background: var(--sunken); }
.pcard .h { display: flex; align-items: baseline; gap: 8px; }
.pcard .h b { font: 600 12px/1 var(--mono); color: var(--c); }
.pcard .h span { font-weight: 600; }
.meter { height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.pcard small { color: var(--ink-3); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* 업무 */
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: var(--divider-width, 1px) solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 10px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.seg .n { font: 500 11px/1 var(--mono); margin-left: 4px; opacity: .8; }
.sel { border: var(--divider-width, 1px) solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; min-width: 0; max-width: 100%; }
.thead, .tline { display: grid; grid-template-columns: 4px minmax(0, 2.2fr) minmax(0, 1fr) 110px 96px; gap: 12px; align-items: center; }
.thead { padding: 9px 16px 9px 0; font-size: 12px; color: var(--ink-3); font-weight: 600; border-bottom: var(--divider-width, 1px) solid var(--line); }
.tline { padding: 10px 16px 10px 0; border: 0; border-top: var(--divider-width, 1px) solid var(--line-2); background: none; width: 100%; text-align: left; }
.tline:first-of-type { border-top: 0; }
.tline:hover { background: var(--sunken); }
.tline .bar { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--b, transparent); }
.tline .m { font-size: 12px; color: var(--ink-3); }
.owner { font-size: 13px; } .owner small { display: block; color: var(--ink-3); font-size: 11.5px; }

/* 회의록 */
.mgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.mlist { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
.mlist .grp { padding: 10px 14px 4px; font: 600 11px/1.4 var(--mono); color: var(--c); letter-spacing: .04em; }
.mitem { display: grid; gap: 2px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 14px; border-left: 3px solid transparent; }
.mitem:hover { background: var(--sunken); }
.mitem[aria-current="true"] { background: var(--blue-weak); border-left-color: var(--blue); }
.mitem b { font-weight: 500; font-size: 13px; }
.mitem small { color: var(--ink-3); font-size: 11.5px; }
.mhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: var(--divider-width, 1px) solid var(--line); }
.mhead .file { font: 12px/1.4 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.mhead .stats { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.paper { padding: 22px 22px 28px; }
.doc { max-width: 760px; margin: 0 auto; }
.doc-title { display: grid; gap: 2px; border-left: 6px solid var(--blue); padding-left: 12px; margin: 0 0 14px 34px; }
.doc-title b { font-size: 26px; color: var(--navy); line-height: 1.15; }
.doc-title span { font-size: 9.5px; letter-spacing: .3em; color: var(--blue); font-weight: 700; border-bottom: 1px solid var(--navy); padding-bottom: 8px; }
.ln { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; align-items: start; border-radius: 6px; }
.ln > .no { font: 11px/1.9 var(--mono); color: var(--ink-3); text-align: right; padding-right: 2px; user-select: none; }
.ln > .tx { padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.ln.ref > .tx { cursor: pointer; }
.ln.ref:hover > .tx { background: var(--sunken); box-shadow: inset 2px 0 0 var(--blue); }
.ln.focus > .tx { background: var(--hl); box-shadow: inset 2px 0 0 var(--warn); }
.ln.h > .tx { font-weight: 700; color: var(--navy); border-left: 4px solid var(--blue); border-bottom: var(--divider-width, 1px) solid var(--line); border-radius: 0; padding: 2px 8px 3px; margin-top: 12px; }
.ln.h > .no { padding-top: 12px; }
.ln.row > .tx { display: grid; grid-template-columns: 92px minmax(0, 1fr); padding: 0; border-radius: 0; border-bottom: var(--divider-width, 1px) solid var(--line); font-size: 13px; }
.ln.row.r4 > .tx { grid-template-columns: 92px minmax(0, 1fr) 72px minmax(0, 1fr); }
.ln.row.first > .tx { border-top: 2px solid var(--navy); }
.ln.row.last > .tx { border-bottom: 1px solid var(--navy); margin-bottom: 4px; }
.ln.row .lb { background: var(--blue-weak); color: var(--navy); font-weight: 600; text-align: center; padding: 6px 4px; }
.ln.row .vl { padding: 6px 8px; }
.ln .ann { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 6px; vertical-align: 1px; }
.ln.act > .tx { font-size: 13.5px; }
.ln.note > .tx { color: var(--ink-2); }

/* 이력 */
.hgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.ritem { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; border-top: var(--divider-width, 1px) solid var(--line-2); background: none; padding: 9px 14px; }
.ritem:hover { background: var(--sunken); }
.ritem[aria-current="true"] { background: var(--blue-weak); }
.ritem .id { font: 500 11.5px/1 var(--mono); color: var(--ink-3); }
.ritem small { font: 500 11px/1 var(--mono); color: var(--ink-3); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 8px; align-items: center; margin: 0 16px 14px; padding: 12px; border-radius: 10px; background: var(--sunken); }
.vs div { min-width: 0; }
.vs small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; }
.vs .arr { text-align: center; color: var(--ink-3); }
.tl { list-style: none; margin: 0; padding: 4px 16px 16px 30px; position: relative; display: grid; gap: 14px; }
.tl::before { content: ""; position: absolute; left: 21px; top: 10px; bottom: 18px; width: 2px; background: var(--line); }
.tl li { position: relative; display: grid; gap: 3px; }
.tl li::before { content: ""; position: absolute; left: -14px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--blue); }
.tl .w { font: 500 12px/1.4 var(--mono); color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tl .v { font-weight: 500; }
.tl .q { font-size: 12.5px; color: var(--ink-2); }

/* 검토 */
.rv { padding: 14px 16px; border-top: var(--divider-width, 1px) solid var(--line-2); display: grid; gap: 8px; }
.rv:first-of-type { border-top: 0; }
.rv .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rv .h b { font-weight: 600; }
.rv blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--rev); background: var(--sunken); border-radius: 0 8px 8px 0; font-size: 13px; }
.rv .ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rv input { flex: 1; min-width: 180px; border: var(--divider-width, 1px) solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; }

/* 서랍·모달 */

 const reviewCount=D.tasks.filter(t=>filterTask(t,'review')).length;root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="mark">B2</span><div><b>B2 워크스페이스</b><small>회의록에서 업무 완료까지</small></div></div><nav class="nav">${navButton('home','홈','⌂')}${navButton('work','업무','☑')}${navButton('minutes','회의록','▤')}${navButton('review',`완료 검토${reviewCount?' '+reviewCount:''}`,'✓')}</nav><details id="project-tree" ${treeOpen?'open':''}><summary>프로젝트</summary><label class="year-label" for="project-year">착수연도</label><select id="project-year"><option value="">전체 연도</option>${[...new Set(D.projects.map(p=>p.year))].sort().reverse().map(y=>`<option ${String(y)===year?'selected':''}>${y}</option>`).join('')}</select><button class="pj" data-act="project" data-id="" aria-pressed="${!pid}">전체 프로젝트</button><div id="project-links">${projectLinks(projects)}</div></details><select class="mobile-project" id="mobile-project" aria-label="프로젝트 선택"><option value="">전체 프로젝트</option>${D.projects.map(p=>`<option value="${p.id}" ${pid===p.id?'selected':''}>${esc(p.id+' · '+p.name)}</option>`).join('')}</select><div class="who"><div class="account-line"><b>${esc(D.user.name)}</b><button class="text-btn" data-act="logout">로그아웃</button></div><small>${esc(D.user.department)}${pid?' · '+(isPM(pid)?'프로젝트 PM':'프로젝트 참여자'):''}</small><button class="text-btn" data-act="theme">테마: ${esc(document.documentElement.dataset.theme==='dark'?'어둡게':document.documentElement.dataset.theme==='light'?'밝게':'기기 설정')}</button><small>가상자료 · 이 PC에 저장</small></div></aside><div class="main"><header class="top"><div class="in"><div><h1>${({home:'홈',work:'업무',minutes:'회의록',review:'완료 검토',compose:'회의록 작성'})[screen]}</h1><div class="sub">${esc(pid?pid+' · '+proj(pid).name:'참여 중인 프로젝트 전체')}</div></div><div class="tools"><div class="search"><input id="global-search" type="search" value="${esc(globalQuery)}" placeholder="업무·회의록 검색" aria-label="전체 검색"><div id="global-results" class="global-results" hidden></ function allEvents(){const meetings=scoped(D.meetings).filter(m=>m.date).map(m=>({id:m.id,date:m.date,title:m.title,type:'meeting',label:'회의 · '+m.project_id}));const tasks=scopeTasks().filter(t=>t.due&&t.status!=='완료'&&(isPM(t.project_id)||mine(t)||t.created_by===D.user.id)).map(t=>({id:t.id,date:t.due,title:t.title,type:'task',label:'완료 목표 · '+pname(t.kind==='확인사항'?t.reviewer_id:t.owner_id)}));return [...meetings,...tasks].sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title))}

function agenda(){const d=new Date(D.today+'T12:00:00'),off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);const start=iso(d);d.setDate(d.getDate()+6);const end=iso(d);const es=allEvents().filter(x=>dateSelected?x.date===dateSelected:x.date>=start&&x.date<=end);return `<section><div class="section-head"><h3>${dateSelected?dateSelected.slice(5).replace('-','월 ')+'일 일정':'이번 주 일정'}</h3><small>${dateSelected?'':start.slice(5)+'–'+end.slice(5)}</small></div><ol class="agenda-flat">${es.map(e=>`<li><time>${e.date.slice(5).replace('-','.')}</time><div><button data-act="${e.type}" data-id="${e.id}">${esc(e.title)}</button><small>${esc(e.label)}</small></div></li>`).join('')||'<li><div class="muted">등록된 일정이 없습니다.</div></li>'}</ol></section>`}
function work(){const review=screen==='review';const items=scopeTasks().filter(t=>filterTask(t,review?'review':workFilter)).filter(t=>(t.title+' '+pname(t.owner_id)+' '+t.description).includes(search)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `<div class="plain-head"><div><h2>${review?'처리 결과 확인':'프로젝트 업무'}</h2><p>${review?'담당자가 제출한 결과를 검토하고 완료 또는 보완을 결정합니다.':'진행 상태와 담당자를 확인하고, 업무를 열어 처리 내용을 기록합니다.'}</p></div>${D.projects.some(p=>p.pm===D.user.id)?'<button class="btn" data-act="new-task">업무 직접 등록</button>':''}</div><div class="filters"><input id="work-search" type="search" value="${esc(search)}" placeholder="업무 내용·담당자 검색" aria-label="업무 검색">${!review?`<select id="work-filter" aria-label="업무 상태">${[['open','미완료'],['all','전체'],['mine','내 업무'],['missing','추가 확인'],['overdue','기한 지남'],['미착수','미착수'],['진행중','진행중'],['pending','검토 대기'],['보완요청','보완 요청'],['완료','완료']].map(([v,l])=>`<option value="${v}" ${workFilter===v?'selected':''}>${l}</option>`).join('')}</select>`:''}<small>${items.length}건</small></div>${taskTable(items)}`}
function minutes(){const ps=pid?proj(pid):null;const records=scoped(D.meetings).filter(m=>qmatch(m.title+' '+m.source,search)&&(!dateFrom||m.date>=dateFrom)&&(!dateTo||m.date<=dateTo)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id));const pages=Math.max(1,Math.ceil(records.length/PAGE_SIZE));meetingPage=Math.min(meetingPage,pages);return `<div class="meeting-grid"><section class="meeting-list"><div class="project-heading"><h2>${esc(ps?ps.name:'참여 프로젝트 회의록')}</h2><p>${esc(ps?ps.id+' · ':'전체 프로젝트 · ')}${records.length}건</p></div><div class="meeting-filters"><input id="meeting-search" type="search" placeholder="회의 제목·본문 검색" aria-label="회의록 검색" value="${esc(search)}"><div class="dates"><label>시작일<input id="date-from" type="date" value="${dateFrom}"></label><label>종료일<input id="date-to" type="date" value="${dateTo}"></label></div><small>최신 회의부터 표시</small></div><div class="meeting-items">${records.slice((meetingPage-1)*PAGE_SIZE,meetingPage*PAGE_SIZE).map(m=>`<button class="meeting-item" data-act="meeting" data-id="${m.id}" aria-current="${mid===m.id}"><b>${esc(m.title)}</b><small>${m.date||'회의일 미정'} · ${m.project_id}${m.pending?' · 검토 전 '+m.pending+'건':''}</small></button>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}</div><div class="pagination"><button class="ghost" data-act="page" data-step="-1" ${meetingPage===1?'disabled':''}>이전</button><span>${meetingPage} / ${pages}</span><button class="ghost" data-act="page" data-step="1" ${meetingPage===pages?'disabled':''}>다음</button></div></section><section class="document-area" id="document-area">${M?documentView():'<div class="empty">왼쪽에서 회의록을 선택해 주세요.</div>'}</section></div>`}
async function loadMeeting(id){mid=id;M=await api('/meetings/'+id);if(screen==='minutes')render();if(['running','queued'].includes(M.analysis_state))pollMeeting()}
function documentView(){return `<div class="doc-toolbar"><strong>${esc(M.title)}</strong><button class="btn" data-act="document-mode">${analysisOpen?'원본 보기':'분석 결과 보기'}</button><a class="btn" href="/api/meetings/${M.id}/original/docx" download>원본 내려받기</a>${!analysisOpen?`<button class="btn" data-act="fullscreen">전체 화면</button>`:''}</div>${analysisOpen?analysis():M.has_pdf?`<iframe class="pdf-frame" title="${esc(M.title)} 원본 미리보기" src="/api/meetings/${M.id}/original/pdf#view=FitH&zoom=page-width"></iframe>`:`<div class="empty">원본 미리보기를 준비 중이거나 변환하지 못했습니다.<br>위의 ‘원본 내려받기’로 Word 파일을 확인할 수 있습니다.<br><button class="text-btn" data-act="reload-meeting">미리보기 다시 확인</button></div>`}`}
function analysis(){const editable=isPM(M.project_id),p=proj(M.project_id);return `<div class="analysis-note"><b>${esc(M.analysis_origin)}</b> · ${['running','queued'].includes(M.analysis_state)?'분석 중':M.analysis_state==='failed'?'분석 실패':'사람 확인 후 반영'}<br>${M.analysis_origin==='예시 검토 초안'?'업무 흐름 체험용으로 준비한 초안입니다. 실제 모델 결과는 아래 분석 실행으로 확인할 수 있습니다.':'AI 제안은 확정된 업무가 아닙니다. 원문과 담당자·기한을 확인해 주세요.'}${M.summary?'<p>'+esc(M.summary)+'</p>':''}${M.error?'<p class="inline-error">'+esc(M.error)+'</p>':''}${(M.warnings||[]).map(w=>'<p class="note-warning">'+esc(w)+'</p>').join('')}<div class="button-row"><button class="text-btn" data-act="analyze" ${['running','queued'].includes(M.analysis_state)||M.candidates.some(c=>c.state==='applied')?'disabled':''}>${['running','queued'].includes(M.analysis_state)?'AI가 분석하고 있습니다…':'실제 AI로 분석하기'}</button>${editable?'<button class="text-btn" data-act="add-candidate">항목 직접 추가</button>':''}</div></div><div id="candidates">${M.candidates.map(c=>candidate(c,editable,p)).join('')||'<div class="empty">분석을 실행하거나 원문을 확인하며 항목을 직접 추가하세요.</div>'}</div><details class="evidence"><summary>원문 전체 확인</summary><div class="source-text">${M.lines.map(l=>esc(l.id+'  '+l.text)).join('\n')}</div></details>${editable?`<div class="analysis-actions"><button class="btn" data-act="save-review">검토 초안 저장</button><button class="btn primary" data-act="apply-review">선택 항목 반영</button></div>`:'<p class="small-note">이 프로젝트의 PM이 검토한 항목을 업무 목록에 반영합니다.</p>'}`}
function candidate(c,editable,p){if(c.state==='applied')return `<section class="candidate"><div class="candidate-top"><strong>${esc(c.title)}</strong><span class="state done">반영됨</span></div><button class="text-btn" data-act="task" data-id="${c.task_id}">연결 업무 보기 →</button></section>`;const enabled=editable&&!['running','queued'].includes(M.analysis_state);return `<fieldset class="candidate" data-cid="${c.id}" ${!enabled?'disabled':''}><div class="candidate-top"><input type="checkbox" name="selected" aria-label="${esc(c.title||'새 항목')} 선택"><input name="title" type="text" value="${esc(c.title)}" aria-label="항목 내용" placeholder="실행하거나 확인할 내용"></div><div class="candidate-fields"><label class="field">구분<select name="kind"><option ${c.kind==='업무'?'selected':''}>업무</option><option ${c.kind==='확인사항'?'selected':''}>확인사항</option></select></label><label class="field">완료 목표일 · 미정이면 비워두기<input type="date" name="due" value="${c.due||''}"></label><label class="field">업무 담당자${whoInput('owner',c.owner_id,p.id)}</label><label class="field">확인자${whoInput('reviewer',c.reviewer_id,p.id,true)}</label></div><details class="evidence"><summary>원문 근거 ${c.evidence.length}개 · 확인/변경</summary>${M.lines.filter(l=>c.evidence.includes(l.id)).map(l=>`<blockquote>${esc(l.text)}</blockquote>`).join('')}<label class="field">근거 문장 선택 · 여러 개는 Ctrl을 누르고 선택<select name="evidence" multiple>${M.lines.map(l=>`<option value="${l.id}" ${c.evidence.includes(l.id)?'selected':''}>${esc(l.id+' '+l.text)}</option>`).join('')}</select></label></details></fieldset>`}
function collectCandidates(){const p=proj(M.project_id),items=M.candidates.filter(c=>c.state==='applied'),selected=[];document.querySelectorAll('fieldset.candidate').forEach(f=>{const val=n=>f.querySelector('[name="'+n+'"]').value;const id=f.dataset.cid;items.push({id,title:val('title'),kind:val('kind'),owner_id:val('kind')==='확인사항'?null:personId(val('owner'),p),reviewer_id:personId(val('reviewer'),p),due:val('due')||null,evidence:[...f.querySelector('[name=evidence]').selectedOptions].map(o=>o.value)});if(f.querySelector('[name=selected]').checked)selected.push(id)});return {version:M.version,candidates:items,selected}}
function openDialog(title,body,subtitle=''){if(dialog.open&&formDirty&&!confirm('저장하지 않은 내용을 버리고 이동할까요?'))return;formDirty=false;dialog.classList.remove('task-dialog');dialog.innerHTML=`<header class="dialog-head"><div><h2>${esc(title)}</h2>${subtitle?'<small>'+esc(subtitle)+'</small>':''}</div><button class="ghost" data-act="close" aria-label="닫기">✕</button></header><div class="dialog-body">${body}</div>`;if(!dialog.open)dialog.showModal();dialog.querySelector('input,textarea,select,button')?.focus()}
async function closeDialog(){if(formDirty&&!await confirmAction('저장하지 않은 내용을 버리고 닫을까요?'))return false;dialog.close();formDirty=false;selectedTask=null;return true}
function openTask(id){
 const t=D.tasks.find(t=>t.id===id);if(!t){toast('업무를 찾을 수 없습니다. 새로고침해 주세요.');return}
 selectedTask=id;
 const own=t.owner_id===D.user.id,pm=isPM(t.project_id),review=t.reviewer_id===D.user.id||pm;
 const canWork=own&&t.kind==='업무'&&['미착수','진행중','보완요청'].includes(t.status),canReview=review&&!own&&t.status==='검토대기',canResolve=review&&t.kind==='확인사항'&&t.status!=='완료';
 const ms=[...D.meetings,...(D.archived_meetings||[])].find(m=>m.id===t.meeting_id),p=proj(t.project_id);
 const allowed=(p.reviewer_ids||[...new Set([p.pm,...D.tasks.filter(x=>x.project_id===p.id&&x.kind==='업무').map(x=>x.reviewer_id)])]).filter(x=>x!==D.user.id);
 const picker=whoInput('task_reviewer',t.reviewer_id,p.id,true).replace('class="person-picker"',`class="person-picker" data-allowed="${esc(allowed.join(',')||'_none')}" data-exclude="${esc(D.user.id)}"`);
 const awaitingRequest=review&&!own&&t.kind==='업무'&&['미착수','진행중','보완요청'].includes(t.status);
 const controls=canWork?`${t.status==='미착수'?'<button class="btn" data-act="task-action" data-action="start">처리 시작</button>':''}<button class="btn" data-act="task-action" data-action="draft">처리 내용 저장</button><button class="btn primary" data-act="task-action" data-action="submit">검토 요청</button>`:canReview?'<button class="btn" data-act="task-action" data-action="return">보완 요청</button><button class="btn primary" data-act="task-action" data-action="approve">완료 확인</button>':canResolve?'<button class="btn primary" data-act="task-action" data-action="resolve">확인 내용 저장 · 완료</button>':awaitingRequest?'<button class="btn" disabled aria-describedby="task-processing-hint">보완 요청</button><button class="btn primary" disabled aria-describedby="task-processing-hint">완료 확인</button>':'';
 const next=canWork?'아래에 처리 결과를 기록한 뒤 검토를 요청하세요.':canReview?'담당자의 처리 결과와 자료를 확인하고, 완료 또는 보완 요청을 선택하세요.':canResolve?'미정 사항을 확인하고 확인된 내용을 기록하세요.':t.status==='검토대기'?'검토자의 확인을 기다리고 있습니다. 수정하려면 요청을 회수하세요.':t.status==='완료'?'검토가 끝난 업무입니다. 처리 결과와 이력을 확인할 수 있습니다.':!t.owner_id&&t.kind==='업무'?'업무 담당자가 미정입니다. 프로젝트 PM이 담당자를 지정해야 합니다.':'담당자의 처리 현황을 확인할 수 있습니다.';
 const processingHint=awaitingRequest?(t.owner_id?`${pname(t.owner_id)}님의 검토 요청을 기다리고 있습니다.`:'업무 담당자를 지정한 뒤 검토 요청을 받을 수 있습니다.'):canWork?'처리 결과를 저장하거나 지정한 검토자에게 검토를 요청하세요.':t.status==='검토대기'&&own?`${pname(t.reviewer_id)}님의 검토를 기다리고 있습니다.`:next;
 openDialog(t.title,`
 <section class="task-brief" aria-label="해야 할 일"><div class="task-brief-heading"><h3>${t.kind==='확인사항'?'확인할 일':'해야 할 일'}</h3>${badge(t)}</div><p class="task-action-title">${esc(t.title)}</p>${t.description?`<div class="task-request"><b>요청 내용</b><p>${esc(t.description)}</p></div>`:''}<div class="task-completion"><b>완료 판단 기준</b><p>${esc(t.acceptance_criteria||'별도 기준이 등록되지 않았습니다. 요청 내용만으로 불명확하면 검토자에게 확인해 주세요.')}</p></div><div class="detail-meta"><div><span>${t.kind==='확인사항'?'확인 담당자':'업무 담당자'}</span>${esc(pname(t.kind==='확인사항'?t.reviewer_id:t.owner_id))}</div><div><span>완료 목표일</span><b class="${overdue(t)?'overdue':''}">${t.due||'미정'}</b></div><div><span>검토자</span>${esc(pname(t.reviewer_id))}</div></div>${pm&&t.status!=='완료'?'<button class="text-btn" data-act="edit-task">담당자·기한·내용 수정</button>':''}</section>
 <p class="task-next">${esc(next)}</p>
 ${!canWork?`<h3>처리 결과</h3><div class="detail-text">${esc(t.result||'아직 작성된 처리 결과가 없습니다.')}</div>`:''}
 <div class="attachments">${t.attachments.map(a=>`<a href="/api/tasks/${t.id}/attachments/${a.id}" download>${esc(a.name)}</a>`).join('')}</div>
 ${canWork?`<label class="field">처리 결과 · 필수<textarea id="action-note" aria-describedby="action-error" placeholder="무엇을 처리했고 결과가 어땠는지 짧게 작성해 주세요.">${esc(t.result)}</textarea></label><p class="small-note">검토 요청 시 한두 문장으로 남겨 주세요. 자료 첨부는 선택입니다.</p><div id="action-error" class="inline-error" role="alert"></div><label class="field">자료 첨부 · 선택<input id="task-attachment" type="file" accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.txt"></label><div class="field task-reviewer">검토받을 사람${picker}<div id="reviewer-error" class="inline-error" role="alert"></div><small>변경한 검토자는 검토 요청을 보낼 때 저장됩니다.</small></div>`:canReview?'<label class="field">검토 의견 · 완료 확인은 선택, 보완 요청은 필수<textarea id="action-note" aria-describedby="action-error" placeholder="보완이 필요하면 수정할 내용을 적어 주세요."></textarea></label><div id="action-error" class="inline-error" role="alert"></div>':canResolve?'<label class="field">확인된 내용<textarea id="action-note" aria-describedby="action-error" placeholder="미정이었던 사항에 대해 확인한 내용을 적어 주세요."></textarea></label><div id="action-error" class="inline-error" role="alert"></div>':''}

 root.innerHTML=`<main class="login-screen"><section class="login-box"><span class="mark">B2</span><h1>회의록 워크스페이스</h1><p>사용자를 선택해 업무 공간에 들어갑니다.<br>프로젝트에서 맡은 역할에 따라 처리할 일이 달라집니다.</p><form id="fast-login-form"><div class="login-filter"><input id="account-search" type="search" placeholder="이름·부서 검색" aria-label="체험 사용자 검색"><select id="account-level" aria-label="체험 사용자 구분"><option value="">전체 사용자</option><option value="leader">팀장급</option><option value="member">실무자</option></select></div><label class="field">사용자 선택<select name="username" id="account-select" required><option value="">사용자를 선택해 주세요</option>${accountOptions()}</select></label>${demoEnabled?'':`<label class="field">비밀번호<input name="password" type="password" required autocomplete="current-password"></label>`}<div id="login-error" class="inline-error" role="alert"></div><button class="btn primary" type="submit">업무 공간 들어가기</button></form><div class="demo-info">${demoEnabled?'빠른 체험 모드 · 비밀번호 입력 없음<br>':''}가상 팀장급 ${accounts.filter(x=>x.level==='leader').length}명 · 실무자 ${accounts.filter(x=>x.level!=='leader').length}명<br>처음에는 김서윤(PM), 박지훈(설계 담당자)으로 비교해 보세요.</div></section></main>`;

 const foot=document.querySelector('.side .who');if(foot){foot.insertAdjacentHTML('beforeend','<button class="text-btn" data-act="trial-review">가상 역할별 점검 결과</button><button class="text-btn" data-act="feedback">사용 의견 남기기</button>')}

home=function(){let html=baseHome();const pending=scoped(D.meetings).filter(m=>isPM(m.project_id)&&m.pending>0);const strips=`<div class="work-reminders">${pending.length?`<button class="text-btn" data-act="pending-meetings">검토할 회의록 ${pending.length}건 →</button>`:''}${D.imports?.length?`<button class="text-btn" data-act="upload">등록 중인 회의록 ${D.imports.length}건 이어서 작성 →</button>`:''}<button class="text-btn" data-act="field-report">현장 이슈 등록</button></div>`;return html.replace('<div class="home-grid">',strips+'<div class="home-grid">')};
// Include reported field issues in the employee's own list without granting edit rights.
const originalFilterTask=filterTask;
filterTask=function(t,filter){if(filter==='mine')return (mine(t)||t.created_by===D.user.id)&&t.status!=='완료';if(filter==='pending')return t.status==='검토대기';if(filter==='review'&&t.owner_id===D.user.id)return false;return originalFilterTask(t,filter)};

 const review=screen==='review',items=scopeTasks().filter(t=>filterTask(t,review?'review':workFilter)).filter(t=>qmatch(t.title+' '+pname(t.owner_id)+' '+t.description,search)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
 const size=20,pages=Math.max(1,Math.ceil(items.length/size));workPage=Math.max(1,Math.min(workPage,pages));
 return `<div class="plain-head"><div><h2>${review?'처리 결과 확인':'프로젝트 업무'}</h2><p>${review?'담당자가 제출한 결과를 검토하고 완료 또는 보완을 결정합니다.':'업무를 열어 처리 결과와 원문 근거를 확인합니다.'}</p></div><div class="button-row"><button class="btn" data-act="field-report">현장 이슈 등록</button>${D.projects.some(p=>p.pm===D.user.id)?'<button class="btn" data-act="new-task">업무 직접 등록</button>':''}</div></div><div class="filters"><input id="work-search" type="search" value="${esc(search)}" placeholder="업무 내용·담당자 검색" aria-label="업무 검색">${!review?`<select id="work-filter" aria-label="업무 상태">${[['open','미완료'],['all','전체'],['mine','내 업무·내가 등록'],['missing','추가 확인'],['overdue','기한 지남'],['미착수','미착수'],['진행중','진행중'],['pending','검토 대기'],['보완요청','보완 요청'],['완료','완료']].map(([v,l])=>`<option value="${v}" ${workFilter===v?'selected':''}>${l}</option>`).join('')}</select>`:''}<small>${items.length}건</small></div>${taskTable(items.slice((workPage-1)*size,workPage*size))}<div class="pagination"><span>${items.length?((workPage-1)*size+1)+'–'+Math.min(items.length,workPage*size):'0'} / ${items.length}건</span><div><button class="ghost" data-act="work-page" data-step="-1" ${workPage===1?'disabled':''}>이전</button><span>${workPage} / ${pages}</span><button class="ghost" data-act="work-page" data-step="1" ${workPage===pages?'disabled':''}>다음</button></div></div>`;

openTask=function(id){baseOpenTask(id);const t=D.tasks.find(x=>x.id===id);if(!t||!dialog.open)return;if(t.status==='검토대기'&&t.owner_id===D.user.id){dialog.querySelector('.dialog-actions').insertAdjacentHTML('beforeend','<button class="btn" data-act="withdraw">검토 요청 회수</button>')}if(t.created_by){dialog.querySelector('.detail-meta').insertAdjacentHTML('beforeend',`<div><span>현장 이슈 등록자</span>${esc(pname(t.created_by))}</div>`)}};
function intakeSteps(step){return `<ol class="intake-steps" aria-label="회의록 등록 단계">${['내용 넣기','정보 확인','AI 검토'].map((name,i)=>`<li ${step===i+1?'aria-current="step"':''}><span>${i+1}</span>${name}</li>`).join('')}</ol>`}
uploadDialog=function(){intakeContext=pid;intakeDraft=null;intakeMode='file';intakeText='';intakeSource()};
function intakeSource(){
 const resumes=D.imports||[];openDialog('회의록 등록',`${intakeSteps(1)}<div class="filter-tabs"><button type="button" data-act="intake-mode" data-mode="file" class="${intakeMode==='file'?'active':''}">Word 파일 올리기</button><button type="button" data-act="intake-mode" data-mode="text" class="${intakeMode==='text'?'active':''}">내용 붙여넣기</button></div><form id="intake-source-form" class="edit-form">${intakeMode==='file'?`<label class="field">작성한 회의록 원본<input name="file" type="file" accept=".docx" required></label><p class="small-note">먼저 문서를 불러옵니다. 다음 단계에서 프로젝트와 회의 정보를 확인합니다.</p>`:`<label class="field">회의록 내용<textarea name="text" id="intake-text" rows="12" required placeholder="회의명, 프로젝트명, 일시, 논의 내용 등을 그대로 붙여넣어 주세요.">${esc(intakeText)}</textarea></label>`}<div id="intake-error" class="inline-error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" data-act="close">취소</button><button class="btn primary" type="submit">내용 불러오기 · 다음</button></div></form>${resumes.length?`<details class="resume-imports"><summary>불러온 회의록 이어서 등록 (${resumes.length})</summary>${resumes.map(r=>`<button class="text-btn" data-act="resume-import" data-id="${r.id}">${esc(r.title)} · ${esc(r.created_at.slice(5,16).replace('T',' '))}</button>`).join('')}</details>`:''}`);
}
function intakeInfo(){const r=intakeDraft;const chosen=r.chosen_project??intakeContext;formDirty=false;openDialog('회의 정보 확인',`${intakeSteps(2)}<form id="intake-info-form" class="edit-form"><p class="intake-file">${esc(r.filename)}<small>문서에 적힌 프로젝트: ${esc(r.declared_project||'찾지 못함')}</small></p><label class="field">등록할 프로젝트<select name="project_id" id="intake-project" required><option value="">프로젝트를 선택해 주세요</option>${D.projects.map(p=>`<option value="${p.id}" ${chosen===p.id?'selected':''}>${esc(p.id+' · '+p.name)}</option>`).join('')}</select></label>${r.suggested_projects.length?`<div class="suggestions"><span>문서와 일치하는 후보</span>${r.suggested_projects.map(id=>`<button type="button" class="text-btn" data-act="suggest-project" data-id="${id}">${esc(id+' · '+proj(id)?.name)}</button>`).join('')}</div>`:'<p class="small-note">프로젝트는 자동 확정하지 않습니다. 등록할 프로젝트를 선택해 주세요.</p>'}<div id="intake-mismatch" hidden><p class="note-warning">문서의 프로젝트 표기와 선택한 프로젝트가 다릅니다. 올바른 프로젝트를 다시 선택하거나 아래 내용을 확인해 주세요.</p><label class="check-line"><input type="checkbox" name="confirm_project_mismatch">다른 표기이지만 선택한 프로젝트에 속한 회의록임을 확인했습니다.</label></div><label class="field">회의 제목<input name="title" maxlength="240" value="${esc(r.title)}" placeholder="확인할 수 없다면 비워둘 수 있습니다."></label><label class="field">회의 날짜 · 모르면 비워두세요<input name="meeting_date" type="date" value="${r.meeting_date||''}"></label>${(r.warnings||[]).map(x=>'<p class="note-warning">'+esc(x)+'</p>').join('')}<details><summary>불러온 원문 확인</summary><pre class="source-text">${esc(r.source)}</pre></details><div id="intake-error" class="inline-error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" data-act="intake-back">이전</button><button class="btn primary" type="submit">등록하고 AI 검토</button></div></form>`);intakeMismatch();}
function intakeMismatch(){const selected=$('#intake-project')?.value||'';const mismatch=!!selected&&!!intakeDraft.declared_project&&!intakeDraft.suggested_projects.includes(selected);$('#intake-mismatch').hidden=!mismatch;const check=dialog.querySelector('[name=confirm_project_mismatch]');check.required=mismatch;if(!mismatch)check.checked=false;}
function inlineError(error){const box=$('#intake-error')||$('#login-error')||dialog.querySelector('.inline-error');if(box){box.innerHTML=esc(error.message)+(error.details?.meeting_id?`<br><button type="button" class="text-btn" data-act="open-duplicate" data-id="${esc(error.details.meeting_id)}">이미 등록된 회의록 열기 →</button>`:'');box.scrollIntoView?.({block:'nearest'})}else toast(error.message)}
const oldDocumentView=documentView;
documentView=function(){
 let html=M.source_type!=='text'?oldDocumentView():`<div class="doc-toolbar"><strong>${esc(M.title)}</strong><button class="btn" data-act="document-mode">${analysisOpen?'원문 보기':'분석 결과 보기'}</button><a class="btn" href="/api/meetings/${M.id}/original/txt" download>원문 내려받기</a></div>${analysisOpen?analysis():`<article class="pasted-original"><small>붙여넣은 원문 · ${esc(M.date||'회의일 미정')}</small><pre>${esc(M.source)}</pre></article>`}`;
 if(M.author===D.user.id||isPM(M.project_id))html=html.replace('</strong>','</strong><button class="btn" data-act="meeting-info">회의 정보 수정</button>');
 return html;
};
const oldAnalysis=analysis;
analysis=function(){let html=oldAnalysis().replace('이 프로젝트의 PM이 검토한 항목을 업무 목록에 반영합니다.',`${esc(pname(proj(M.project_id).pm))} PM이 검토 후 업무 목록에 반영합니다.`);if(M.analysis_state==='queued')html=html.replace(' · 분석 중',' · 분석 대기').replace('AI가 분석하고 있습니다…','AI 분석 순서를 기다리고 있습니다…');if(['running','queued'].includes(M.analysis_state)){html=html.replace(/data-act="(add-candidate|save-review|apply-review)"/g,'disabled data-act="$1"').replace('<b>아직 분석하지 않음</b>','<b>로컬 AI 분석</b>').replace('분석을 실행하거나 원문을 확인하며 항목을 직접 추가하세요.','원문은 저장되었습니다. 분석이 끝나면 제안한 업무와 확인사항을 보여드립니다.')}return intakeSteps(3)+html};
function fieldReport(){openDialog('현장 이슈 등록',`<form id="field-report-form" class="edit-form"><p class="small-note">현장에서 발견한 문제를 기록합니다. 프로젝트 PM이 담당자와 기한을 정합니다.</p><label class="field">프로젝트<select name="project_id" required><option value="">프로젝트 선택</option>${D.projects.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.id+' · '+p.name)}</option>`).join('')}</select></label><label class="field">문제 / 요청 내용<input name="title" required maxlength="1000"></label><label class="field">발견한 상황과 필요한 확인<textarea name="description" rows="6" required></textarea></label><div class="inline-error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn primary">PM에게 이슈 등록</button></div></form>`)}
async function trialReview(){const review=await api('/trial-review');openDialog('가상 역할별 사용성 점검',`<p class="small-note">${esc(review.method||review.status)}<br>발언 인용이나 만족도 조사가 아닌, 가상 역할의 업무 과제를 통한 점검입니다.</p><p><b>팀장급 ${review.scope?.leaders||6}명 · 실무자 ${review.scope?.members||12}명 · ${review.scope?.projects||12}개 프로젝트</b></p>${(review.findings||[]).map(f=>`<section class="review-finding"><b>${esc(f.title)}</b><p>${esc(f.observed)}</p><small>${esc(f.action)} · ${esc(f.status)}</small></section>`).join('')}${review.limits?.length?`<details class="persona-review"><summary>아직 검증하지 못한 범위</summary>${review.limits.map(x=>`<p>${esc(x)}</p>`).join('')}</details>`:''}<h3>역할별 과제와 결과</h3>${(review.people||[]).map(p=>`<details class="persona-review"><summary>${esc(p.department+' · '+p.name+' '+p.position)} <span>${esc(p.result)}</span></summary><p><b>역할에서 예상한 어려움</b><br>${esc(p.concern)}</p><p><b>점검 과제</b><br>${esc(p.task)}</p>${p.evidence?'<p><b>확인 결과</b><br>'+esc(p.evidence)+'</p>':''}</details>`).join('')}`)}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;const handled=['intake-mode','intake-back','suggest-project','resume-import','open-duplicate','field-report','withdraw','work-page','trial-review','feedback','pending-meetings','meeting-info'];if(!handled.includes(act))return;
 e.stopImmediatePropagation();try{
  if(act==='intake-mode'){intakeText=$('#intake-text')?.value||intakeText;intakeMode=b.dataset.mode;formDirty=false;intakeSource()}
  if(act==='intake-back'){formDirty=false;intakeSource()}
  if(act==='suggest-project'){$('#intake-project').value=b.dataset.id;intakeMismatch();formDirty=true}
  if(act==='resume-import'){intakeDraft=await api('/meeting-imports/'+b.dataset.id);intakeInfo()}
  if(act==='open-duplicate'){formDirty=false;dialog.close();mid=b.dataset.id;screen='minutes';analysisOpen=false;pid=D.meetings.find(m=>m.id===mid)?.project_id||pid;M=null;await loadMeeting(mid)}
  if(act==='field-report')fieldReport();
  if(act==='withdraw'){const t=D.tasks.find(t=>t.id===selectedTask);if(!await confirmAction('검토 요청을 회수하고 처리 내용을 수정할까요? 확인자에게는 회수 이력이 남습니다.'))return;await api('/tasks/'+t.id+'/actions','POST',{version:t.version,action:'withdraw',note:''});formDirty=false;await refresh();openTask(t.id);toast('검토 요청을 회수했습니다. 수정 후 다시 제출할 수 있습니다.')}
  if(act==='work-page'){workPage+=Number(b.dataset.step);render()}
  if(act==='trial-review')await trialReview();
  if(act==='meeting-info')openDialog('회의 정보 수정',`<form id="meeting-info-form" class="edit-form"><p class="small-note">목록과 일정에 표시할 정보를 수정합니다. 올린 원문은 그대로 보관하며 수정 이력을 남깁니다.</p><label class="field">회의 제목<input name="title" required maxlength="240" value="${esc(M.title)}"></label><label class="field">회의 날짜 · 미정이면 비워두기<input name="meeting_date" type="date" value="${M.date||''}"></label><div class="inline-error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn primary">수정사항 저장</button></div></form>`);
  if(act==='feedback')openDialog('사용 의견 남기기',`<form id="feedback-form" class="edit-form"><p class="small-note">이 의견은 현재 로그인한 사용자 이름으로 이 PC에 저장됩니다. 가상 역할 점검과 구분해 보관합니다.</p><label class="field">어떤 일을 하다가 무엇이 불편했나요?<textarea name="content" rows="7" minlength="5" required></textarea></label><div class="inline-error" role="alert"></div><div class="dialog-actions"><button class="btn primary" type="submit">의견 저장</button></div></form>`);
  if(act==='pending-meetings'){const pending=scoped(D.meetings).filter(m=>isPM(m.project_id)&&m.pending>0).sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(pending[0]){screen='minutes';mid=pending[0].id;M=null;analysisOpen=true;await loadMeeting(mid)}}
 }catch(error){inlineError(error)}
},true);
document.addEventListener('change',e=>{
 const el=e.target;if(el.id==='intake-project'){intakeMismatch();formDirty=true}
 if(el.id==='account-level'){loginLevel=el.value;$('#account-select').innerHTML='<option value="">사용자를 선택해 주세요</option>'+accountOptions()}

document.addEventListener('input',e=>{const el=e.target;if(el.id==='account-search'){loginQuery=el.value;$('#account-select').innerHTML='<option value="">사용자를 선택해 주세요</option>'+accountOptions()}if(el.id==='project-find'){e.stopImmediatePropagation();projectQuery=el.value;filterProjects()}if(el.id==='work-search')workPage=1},true);
document.addEventListener('submit',async e=>{
 const f=e.target;if(!['fast-login-form','intake-source-form','intake-info-form','field-report-form','feedback-form','meeting-info-form'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();const button=f.querySelector('[type=submit]');button.disabled=true;const text=button.textContent;try{
  const fd=new FormData(f);

work=function(){const reviewing=screen==='review',tabs=reviewing?[['pending','검토 대기'],['returned','보완 요청'],['completed','완료 확인']]:[['open','미완료'],['pending','검토 대기'],['missing','추가 확인'],['overdue','기한 지남'],['완료','완료'],['all','전체']];

function calendarEvents(){return [...scoped(D.meetings).filter(m=>m.date).map(m=>({id:m.id,start:m.date,end:m.date,title:m.title,type:'meeting',label:'회의 · '+m.project_id})),...scopeTasks().filter(t=>(t.due||t.start)&&t.status!=='완료'&&(isPM(t.project_id)||mine(t)||t.created_by===D.user.id)).map(t=>({id:t.id,start:t.start||t.due,end:t.due||t.start,title:t.title,type:'task',period:!!(t.start&&t.due),label:(t.start&&t.due?t.start+' ~ '+t.due:t.due?'완료 목표 '+t.due:'시작 예정 '+t.start)+' · '+pname(t.kind==='확인사항'?t.reviewer_id:t.owner_id)}))].sort((a,b)=>a.start.localeCompare(b.start)||b.end.localeCompare(a.end)||a.id.localeCompare(b.id))}
calendar=function(){const [y,m]=calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),count=new Date(y,m,0).getDate(),offset=(first.getDay()+6)%7,events=calendarEvents();let weeks='';
 for(let w=0;w<Math.ceil((offset+count)/7);w++){const dates=Array.from({length:7},(_,j)=>{const n=w*7+j-offset+1;return n>0&&n<=count?calendarMonth+'-'+String(n).padStart(2,'0'):''}),valid=dates.filter(Boolean),a=valid[0],b=valid.at(-1);const lanes=[[],[],[]],hidden=new Map();let bars='';
  for(const e of events.filter(e=>e.start<=b&&e.end>=a)){const from=Math.max(0,dates.findIndex(d=>d&&d>=e.start)),last=dates.reduce((n,d,i)=>d&&d<=e.end?i:n,from),lane=lanes.findIndex(xs=>!xs.some(([s,t])=>from<=t&&last>=s));if(lane<0){for(let j=from;j<=last;j++)if(dates[j])hidden.set(dates[j],(hidden.get(dates[j])||0)+1);continue}lanes[lane].push([from,last]);bars+=`<button class="cal-bar ${e.type} ${e.period?'period':''}" style="grid-column:${from+1}/${last+2};grid-row:${lane+1}" data-act="${e.type}" data-id="${e.id}" title="${esc(e.title+' · '+e.label)}" aria-label="${esc(e.title+' · '+e.label)}">${esc(e.title)}</button>`}
  weeks+=`<div class="cal-week-row"><div class="cal-dates">${dates.map(d=>d?`<button class="cal-day ${d===D.today?'today':''} ${d===dateSelected?'selected':''}" data-act="date" data-date="${d}" aria-label="${d}" aria-pressed="${d===dateSelected}">${Number(d.slice(-2))}</button>`:'<span></span>').join('')}</div><div class="cal-lanes" style="grid-template-rows:repeat(${Math.max(1,...lanes.map((xs,i)=>xs.length?i+1:0))},20px)">${bars}</div><div class="cal-overflow">${dates.map(d=>hidden.has(d)?`<button data-act="date" data-date="${d}" aria-label="${d} 일정 전체 보기">+${hidden.get(d)}</button>`:'<span></span>').join('')}</div></div>`;
 }
 return `<section class="calendar period-calendar" aria-label="월간 일정"><div class="cal-top"><button class="ghost" data-act="month" data-step="-1" aria-label="이전 달">‹</button><strong>${y}년 ${m}월</strong><button class="ghost" data-act="month" data-step="1" aria-label="다음 달">›</button></div><div class="cal-dates">${['월','화','수','목','금','토','일'].map(d=>`<span class="cal-week">${d}</span>`).join('')}</div>${weeks}<div class="cal-legend"><span>━ 업무 기간</span><span>● 회의·목표일</span><button class="text-btn" data-act="week">이번 주</button></div></section>`};

function originalPages(kind,id,count){return `<div class="original-pages" aria-label="원본 페이지 미리보기">${Array.from({length:Math.min(count,50)},(_,i)=>`<figure><img loading="lazy" src="/api/${kind}/${id}/preview/${i+1}" alt="원본 ${i+1}페이지"><figcaption>${i+1} / ${count}</figcaption></figure>`).join('')}${count>50?'<p>전체 페이지는 원본 내려받기로 확인해 주세요.</p>':''}</div>`}
function comparisonSource(){const c=compose,d=c.import,original=d?.source||c.body,edited=!!d&&c.body!==d.source;return `<section class="comparison-original"><div class="comparison-heading"><h3>${c.sourceMode==='edit'?'본문 수정':c.sourceMode==='pdf'?'원본 문서':'원문 대조'}</h3><div class="button-row"><button type="button" class="text-btn" data-act="review-source" data-mode="text">문장</button>${d?.source_type==='docx'?'<button type="button" class="text-btn" data-act="review-source" data-mode="pdf">원본 Word 보기</button>':''}<button type="button" class="text-btn" data-act="review-source" data-mode="edit">본문 수정</button></div></div>${c.sourceMode==='edit'?`<label class="field">원본은 보관하고 수정한 본문으로 분석합니다.<textarea id="compose-body" name="body" rows="25" placeholder="회의 내용을 작성하거나 붙여넣어 주세요.">${esc(c.body||'')}</textarea></label>`:`<textarea name="body" hidden>${esc(c.body||'')}</textarea>${c.sourceMode==='pdf'?(d?.preview_pages?originalPages('meeting-imports',d.id,d.preview_pages):d?.has_pdf?`<iframe title="등록 전 원본 미리보기" src="/api/meeting-imports/${d.id}/original/pdf#view=FitH&zoom=page-width"></iframe>`:`<p class="review-empty">원본 미리보기를 준비 중입니다. 문장 보기로 대조할 수 있습니다.</p><button type="button" class="btn" data-act="review-preview">미리보기 다시 확인</button>${d?`<a class="text-btn" href="/api/meeting-imports/${d.id}/original/docx" download>원본 Word 내려받기</a>`:''}`):`${edited?'<p class="note-warning">아래는 수정한 현재 본문입니다. 최초 원본은 ‘원본 Word 보기’에서 확인할 수 있습니다.</p>':''}<div class="source-lines">${sourceLines(c.body||original).map(l=>`<p id="review-${l.id}" data-ref="${l.id}"><small>${l.id}</small><span>${esc(l.text)}</span></p>`).join('')||'<p class="review-empty">Word 파일을 올리거나 ‘본문 수정’에서 내용을 붙여넣으세요.</p>'}</div>`}`}</section>`}
composeView=function(){if(!compose||compose.mid)return priorComposeView();const c=prepareCompose(),busy=['running','queued'].includes(c.import?.analysis_state);return `<div class="compose-shell comparison-shell"><div class="compose-heading"><div><h2>회의록 등록</h2><p>원본과 정리 내용을 대조하고, 수정한 뒤 등록합니다.</p></div><button class="text-btn" data-act="compose-cancel">회의록 목록으로</button></div><form id="compose-form"><fieldset class="compose-editable" ${busy?'disabled':''}><div id="review-drop" class="review-drop" tabindex="0" role="button" aria-label="Word 파일을 끌어 놓거나 선택"><strong>${esc(c.filename||'Word 회의록을 여기에 끌어 놓으세요')}</strong><span>또는 <button type="button" class="text-btn" data-act="review-file">파일 선택</button> · .docx, 최대 4MB</span><input type="file" id="review-file" accept=".docx" hidden></div><div class="compose-meta"><label class="field">프로젝트<select id="compose-project" name="project_id"><option value="">선택해 주세요 · 임시 저장은 선택 없이 가능</option>${D.projects.map(p=>`<option value="${p.id}" ${c.project_id===p.id?'selected':''}>${esc(p.id+' · '+p.name)}</option>`).join('')}</select></label><label class="field">회의 날짜 · 미정 가능<input name="meeting_date" type="date" value="${c.date||''}"></label></div><label class="field">회의 제목<input name="title" maxlength="240" value="${esc(c.title||'')}" placeholder="회의 제목"></label><div id="compose-project-hint">${composeHint()}</div><div class="comparison-grid">${comparisonSource()}<section class="comparison-review"><div class="comparison-heading"><div><h3>핵심 내용</h3><small>${esc(c.import?.analysis_origin||'등록 전 검토 초안')}</small></div><button type="button" class="btn primary" data-act="review-analyze">AI로 정리</button></div><p class="small-note">담당자·기한은 미정으로 둘 수 있습니다. 실제 업무 반영은 PM이 확인합니다.</p>${c.import?.analysis_hash&&c.import.edited_body!==c.body?'<p class="note-warning">분석 후 본문이 변경되었습니다. 근거와 정리 내용을 다시 확인해 주세요.</p>':''}${pointEditor('summary','핵심 요약')}${pointEditor('decisions','결정사항')}<section class="review-section"><div class="section-head"><h3>후속 업무·추가 확인</h3><button type="button" class="text-btn" data-act="review-add" data-kind="candidates">+ 추가</button></div>${c.bundle.candidates.map(reviewCandidate).join('')||'<p class="review-empty">후속 조치가 없다면 비워둘 수 있습니다.</p>'}</section></section></div><label class="check-line review-confirm"><input id="review-confirmed" type="checkbox" ${c.confirmed?'checked':''}>원본과 정리 내용을 대조하고, 업무·담당자·기한 제안을 확인했습니다.</label></fieldset>${busy?'<div class="analysis-progress" role="status">AI가 원문을 분석하고 있습니다. 완료되면 수정할 수 있습니다. 잠시 다른 화면을 보아도 임시 저장본에서 이어갈 수 있습니다.</div>':''}<div class="inline-error" id="compose-error" role="alert">${esc(c.import?.analysis_error||'')}</div><div class="compose-actions"><span id="compose-saved">${esc(c.savedMessage||'임시 저장은 작성자에게만 보입니다.')}</span><button class="btn" type="submit" value="draft" ${busy?'disabled':''}>임시 저장</button><button class="btn primary" type="submit" value="submit" ${busy?'disabled':''}>등록하고 PM 검토 요청</button></div></form></div>`};
const priorReadCompose=readCompose;
readCompose=function(){if(!compose||compose.mid){priorReadCompose();return}const f=$('#compose-form');if(!f)return;prepareCompose();const old=compose.body;compose.title=f.querySelector('input[name=title]').value;compose.date=f.querySelector('[name=meeting_date]').value;compose.body=f.querySelector('textarea[name=body]').value;compose.project_id=f.querySelector('[name=project_id]').value;compose.mismatch=!!$('#compose-mismatch')?.checked;for(const key of ['summary','decisions']){f.querySelectorAll(`[data-key="${key}"]`).forEach(e=>{compose.bundle[key][+e.dataset.index].text=e.querySelector('textarea').value})}f.querySelectorAll('.review-candidate').forEach(e=>{const c=compose.bundle.candidates[+e.dataset.index],v=n=>e.querySelector(`[name="${n}"]`)?.value||null;c.title=v('title')||'';c.kind=v('kind');c.start=v('start');c.due=v('due');c.owner_id=c.kind==='업무'?v('owner'):null;c.reviewer_id=v('reviewer');c.evidence=[...e.querySelectorAll('[name=evidence-ref]:checked')].map(x=>x.value)});compose.confirmed=!!$('#review-confirmed')?.checked;if(old!==compose.body){compose.bundle.summary.forEach(x=>x.evidence=[]);compose.bundle.decisions.forEach(x=>x.evidence=[]);compose.bundle.candidates.forEach(x=>x.evidence=[]);compose.confirmed=false}};
uploadDialog=function(){compose={title:'',date:'',body:'',project_id:pid||'',bundle:blankBundle(),sourceMode:'text'};editorDirty=false;formDirty=false;meetingDirty=false;screen='compose';dialog.close();render()};
intakeInfo=function(){const r=intakeDraft;compose={import:r,title:r.title||'',date:r.meeting_date||'',body:r.edited_body||r.source,project_id:r.chosen_project||'',filename:r.filename,bundle:copyBundle(r.review_bundle),confirmed:!!r.review_confirmed,sourceMode:'text'};editorDirty=false;formDirty=false;dialog.close();screen='compose';render()};
async function stageCompose(){readCompose();const c=compose;if(c.body.trim().length<10)throw Error('회의 내용을 10자 이상 작성해 주세요.');if(!c.import){const f=new FormData();f.append('text',c.body);c.import=await api('/meeting-imports','POST',f);c.filename=c.import.filename}const saved=await api('/meeting-imports/'+c.import.id,'PATCH',{version:c.import.draft_version||1,title:c.title,meeting_date:c.date||null,body:c.body,project_id:c.project_id||null,review_bundle:c.bundle,review_confirmed:c.confirmed});c.import.draft_version=saved.version;editorDirty=false;c.savedMessage='임시 저장됨 · 작성자만 열 수 있습니다.';return c}
saveCompose=async function(submit){if(compose.mid)return priorSaveCompose(submit);readCompose();if(submit&&(!compose.project_id||!compose.title.trim()||!compose.confirmed))throw Error('프로젝트와 제목을 입력하고 원본 대조 확인에 표시해 주세요.');const c=await stageCompose();if(!submit){await refresh(false);render();toast('임시 저장했습니다.');return}const r=await api('/meeting-imports/'+c.import.id+'/finalize','POST',{version:c.import.draft_version,confirm_project_mismatch:!!c.mismatch});editorDirty=false;await refresh(false);pid=c.project_id;remember();mid=r.id;M=null;screen='minutes';meetingStatus='전체';documentTab='current';await loadMeeting(mid);toast('원본과 검토 내용을 등록하고 PM에게 검토를 요청했습니다.')};
async function acceptReviewFile(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.docx'))throw Error('Word(.docx) 파일을 선택해 주세요.');readCompose();if(compose.body&&editorDirty&&!await confirmAction('작성 중인 내용을 새 Word 파일로 바꿀까요? 저장한 임시 자료는 남습니다.'))return;const fd=new FormData();fd.append('file',file);const r=await api('/meeting-imports','POST',fd);compose={import:r,title:r.title||'',date:r.meeting_date||'',body:r.source,project_id:compose.project_id||'',filename:r.filename,bundle:blankBundle(),sourceMode:'text'};editorDirty=true;await refresh(false);render();toast('원본을 불러왔습니다. AI로 정리하거나 직접 검토 내용을 작성하세요.');pollPreview(r.id)}
function pollPreview(id){clearTimeout(previewPoll);previewPoll=setTimeout(async()=>{if(screen!=='compose'||compose?.import?.id!==id)return;try{const d=await api('/meeting-imports/'+id);compose.import.has_pdf=d.has_pdf;compose.import.preview_pages=d.preview_pages;if(d.has_pdf&&compose.sourceMode==='pdf'){readCompose();render()}else if(!d.preview_finished)pollPreview(id)}catch{}},2000)}
function pollImport(){clearTimeout(importPoll);const id=compose?.import?.id;if(!id)return;importPoll=setTimeout(async()=>{if(screen!=='compose'||compose?.import?.id!==id)return;try{const d=await api('/meeting-imports/'+id);compose.import=d;if(['running','queued'].includes(d.analysis_state)){pollImport();return}compose.bundle=copyBundle(d.review_bundle);compose.confirmed=false;editorDirty=false;render();toast(d.analysis_state==='ready'?'정리 초안이 준비되었습니다. 원문과 대조해 수정하세요.':'분석 상태를 확인해 주세요.')}catch(e){toast(e.message)}},2000)}

const priorReadableView=documentView,priorDocumentButtons=documentButtons;
const canTrashMeeting=m=>!m.deleted_at&&(isPM(m.project_id)||(m.author===D.user.id&&docStatus(m)==='작성 중'&&!(m.document_events||[]).some(x=>x.action==='회의록 검토 요청')&&!D.tasks.some(t=>t.meeting_id===m.id)));
documentButtons=function(){if(M.deleted_at)return isPM(M.project_id)?`<button class="btn" data-act="trash-restore" data-kind="meeting" data-id="${M.id}" data-version="${M.version}">복구</button>`:'';return priorDocumentButtons()+(canTrashMeeting(M)?'<button class="btn meeting-delete" data-act="trash-meeting">삭제</button>':'')};
function excerptSections(m){const out={summary:[],decisions:[],checks:[]};let key='';for(const l of sourceLines(m.source)){const t=l.text.replace(/^\s*[\d.\-]+\s*/,'');if(/^(핵심|논의|주요 논의|주요 내용)/.test(t)&&t.length<30){key='summary';continue}if(/^결정/.test(t)&&t.length<30){key='decisions';continue}if(/^(추가 확인|미정|보류)/.test(t)&&t.length<30){key='checks';continue}if(/^(후속|참석|첨부)/.test(t)&&t.length<30){key='';continue}if(key)out[key].push({text:l.text,evidence:[l.id]})}if(!out.summary.length)out.summary=sourceLines(m.source).filter(l=>!/^회의|^프로젝트|^일시|^작성|^참석/.test(l.text)).slice(0,5).map(l=>({text:l.text,evidence:[l.id]}));return out}
function readableContent(){const valid=M.overview&&M.overview.revision===M.revision,legacy=excerptSections(M),o=valid?M.overview:legacy;const rows=M.candidates.filter(c=>c.kind==='업무'),checks=M.candidates.filter(c=>c.kind==='확인사항');const points=(items,empty)=>items?.length?`<ul class="readable-points">${items.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>`:`<p class="muted readable-empty">${empty}</p>`;
 return `<article class="readable-minutes"><h2 class="minutes-paper-title">${esc(M.title)}</h2><div class="paper-meta">${esc(M.project_id)} · ${esc(M.date||'회의일 미정')} · 작성 ${esc(pname(M.author))}</div><p class="small-note">${valid?'등록 시 대조·저장한 정리 내용 · '+esc(pname(M.overview.reviewed_by)):'원문 항목 발췌 · 저장된 요약이 없거나 본문이 변경되어 현재 본문을 항목별로 표시합니다.'}</p><section><h3>핵심 내용</h3>${points(o.summary,'등록된 핵심 내용이 없습니다.')}</section><section><h3>결정사항</h3>${points(o.decisions,'명시된 결정사항이 없습니다.')}</section><section><h3>후속 업무 <small>${rows.length}건</small></h3><div class="table-wrap"><table class="flat-table"><thead><tr><th>할 일</th><th>담당자</th><th>기한</th><th>상태</th></tr></thead><tbody>${rows.map(c=>{const t=D.tasks.find(x=>x.id===c.task_id);return `<tr><td>${t?`<button class="work-title" data-act="task" data-id="${t.id}">${esc(t.title)}</button>`:esc(c.title)}</td><td>${esc(pname(t?.owner_id||c.owner_id))}</td><td>${esc((t||c).due||'미정')}</td><td>${t?badge(t):'<span class="state hold">PM 반영 전</span>'}</td></tr>`}).join('')||'<tr><td colspan="4">등록된 후속 업무가 없습니다.</td></tr>'}</tbody></table></div></section><section><h3>추가 확인</h3>${checks.length?`<ul class="readable-points">${checks.map(c=>{const t=D.tasks.find(x=>x.id===c.task_id);return `<li>${t?`<button class="text-btn" data-act="task" data-id="${t.id}">${esc(t.title)}</button>`:esc(c.title)}<small>확인 담당자 ${esc(pname((t||c).reviewer_id))} · ${(t||c).due||'기한 미정'} · ${t?esc(t.status):'PM 반영 전'}</small></li>`}).join('')}</ul>`:points(legacy.checks,'등록된 추가 확인 사항이 없습니다.')}</section><details class="full-body"><summary>현재 본문 전체 보기</summary><pre>${esc(M.source)}</pre></details></article>`}
let originalScale=100;
documentView=function(){
 let html=priorReadableView();
 if(documentTab==='original'){
  if(M.preview_pages)html=html.replace(/<iframe[\s\S]*?<\/iframe>/,originalPages('meetings',M.id,M.preview_pages));
  if(M.preview_pages)html=html.replace('<div class="doc-toolbar">',`<div class="doc-toolbar"><div class="original-zoom"><button class="btn" data-act="original-zoom" data-step="-25" aria-label="원본 축소">−</button><output id="original-scale">${originalScale}%</output><button class="btn" data-act="original-zoom" data-step="25" aria-label="원본 확대">＋</button><button class="text-btn" data-act="original-fit">너비 맞춤</button></div>`).replace('class="original-pages"','class="original-pages" style="--original-scale:'+originalScale+'%"');
 }
 if(documentTab==='current'){
  html=html.replace(/<article class="meeting-paper">[\s\S]*?<\/article>/,readableContent());
  const start=html.indexOf('<section class="meeting-work">');
  if(start>=0)html=html.slice(0,start)+(M.deleted_at?'':`<details class="meeting-proposals" ${meetingDirty?'open':''}><summary>회의에서 나온 업무 (${M.candidates.filter(c=>c.state==='draft').length}건)</summary>${html.slice(start)}</details>`);
  html+=`<details class="meeting-revisions" id="meeting-revisions"><summary>수정 이력</summary>${documentHistory()}</details>`;
 }
 if(M.deleted_at)html='<div class="document-warning">휴지통에 있는 회의록입니다. 연결 업무의 원본과 이력을 열람할 수 있습니다.</div>'+html;
 return html;
};

openDrafts=function(){openDialog('임시 저장한 회의록',`<div class="draft-list">${(D.imports||[]).map(d=>`<div class="draft-item"><button class="meeting-item" data-act="resume-import" data-id="${d.id}"><b>${esc(d.title)}</b><small>${esc(d.created_at.slice(0,16).replace('T',' '))}</small></button><button class="text-btn" data-act="trash-draft" data-id="${d.id}" data-version="${d.version}">삭제</button></div>`).join('')||'<p class="empty">임시 저장한 회의록이 없습니다.</p>'}</div><button class="text-btn" data-act="trash-open">휴지통 보기</button>`)};
async function openTrash(){const data=await api('/trash');openDialog('회의록 휴지통',`<p class="small-note">원본과 연결 업무는 보존됩니다. 복구하면 기존 목록에서 다시 볼 수 있습니다.</p>${data.map(x=>`<div class="trash-item"><div><b>${esc(x.title)}</b><small>${esc(x.project_id||'프로젝트 미선택')} · ${x.kind==='import'?'개인 임시 저장':'회의록'} · ${esc(x.deleted_at.slice(0,16).replace('T',' '))}</small></div><button class="btn" data-act="trash-restore" data-kind="${x.kind}" data-id="${x.id}" data-version="${x.version}">복구</button></div>`).join('')||'<p class="empty">휴지통이 비어 있습니다.</p>'}`)}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(!['work-tab','review-file','review-source','review-preview','review-analyze','review-add','review-remove','review-evidence','trash-open','trash-meeting','trash-draft','trash-restore'].includes(a))return;e.preventDefault();e.stopImmediatePropagation();try{
 if(a==='work-tab'){if(screen==='review')reviewFilter=b.dataset.filter;else workFilter=b.dataset.filter;workPage=1;render()}
 if(a==='review-file')$('#review-file').click();
 if(a==='review-source'){readCompose();compose.sourceMode=b.dataset.mode;render();if(compose.sourceMode==='pdf'&&compose.import&&!compose.import.has_pdf)pollPreview(compose.import.id)}
 if(a==='review-preview'){readCompose();compose.import=await api('/meeting-imports/'+compose.import.id);render()}
 if(a==='review-analyze'){readCompose();if(compose.bundle.candidates.length||compose.bundle.summary.length||compose.bundle.decisions.length)if(!await confirmAction('현재 정리 초안을 새 AI 결과로 바꿀까요? 원본과 본문은 보관됩니다.'))return;b.disabled=true;const c=await stageCompose();await api('/meeting-imports/'+c.import.id+'/analyze','POST',{version:c.import.draft_version});c.import=await api('/meeting-imports/'+c.import.id);c.confirmed=false;render();pollImport()}
 if(a==='review-add'||a==='review-remove'){readCompose();const key=b.dataset.kind;if(a==='review-add')compose.bundle[key].push(key==='candidates'?{id:crypto.randomUUID(),title:'',kind:'업무',owner_id:null,reviewer_id:proj(compose.project_id)?.pm||null,start:null,due:null,evidence:[]}:{text:'',evidence:[]});else compose.bundle[key].splice(+b.dataset.index,1);compose.confirmed=false;editorDirty=true;render()}
 if(a==='review-evidence'){readCompose();compose.sourceMode='text';render();const l=document.getElementById('review-'+b.dataset.ref);l?.scrollIntoView({block:'center',behavior:'smooth'});l?.classList.add('evidence-highlight')}
 if(a==='trash-open'){if(formDirty&&!await confirmAction('저장하지 않은 내용을 두고 휴지통을 열까요?'))return;formDirty=false;await openTrash()}
 if(a==='trash-meeting'){const n=D.tasks.filter(t=>t.meeting_id===M.id).length;if(!await confirmAction(`‘${M.title}’을 휴지통으로 옮길까요? 연결 업무 ${n}건은 그대로 남으며, 회의록은 복구할 수 있습니다.`))return;await api('/meetings/'+M.id+'/trash','POST',{version:M.version});meetingDirty=false;mid='';M=null;await refresh();toast('휴지통으로 옮겼습니다.')}
 if(a==='trash-draft'){const d=D.imports.find(x=>x.id===b.dataset.id);if(!await confirmAction(`‘${d?.title||'임시 저장본'}’을 휴지통으로 옮길까요?`))return;await api('/meeting-imports/'+b.dataset.id+'/trash','POST',{version:+b.dataset.version});formDirty=false;await refresh();openDrafts()}
 if(a==='trash-restore'){await api((b.dataset.kind==='import'?'/meeting-imports/':'/meetings/')+b.dataset.id+'/restore','POST',{version:+b.dataset.version});formDirty=false;dialog.close();if(M?.id===b.dataset.id)M=await api('/meetings/'+M.id);await refresh();toast('복구했습니다.')}
 }catch(error){const box=$('#compose-error');if(screen==='compose'&&box)box.textContent=error.message;else toast(error.message)}finally{if(b.isConnected)b.disabled=false}},true);
document.addEventListener('change',async e=>{try{if(e.target.id==='review-file')await acceptReviewFile(e.target.files[0]);if(e.target.id==='only-my-work'){onlyMyWork=e.target.checked;workPage=1;render()}if(e.target.id==='detail-work-filter'){detailWorkFilter=e.target.value;workPage=1;render()}if(e.target.id==='compose-project'&&!compose?.mid){readCompose();const p=proj(compose.project_id);compose.bundle.candidates.forEach(c=>{if(!p?.members.includes(c.owner_id))c.owner_id=null;if(!p?.members.includes(c.reviewer_id))c.reviewer_id=p?.pm||null});compose.confirmed=false;render()}if(e.target.matches('.review-candidate [name=kind]')){readCompose();render()}}catch(error){toast(error.message)}},true);
document.addEventListener('input',e=>{if(e.target.closest('#compose-form')&&!compose?.mid&&e.target.id!=='review-confirmed'&&!e.target.matches('.person-search')){compose.confirmed=false;const check=$('#review-confirmed');if(check)check.checked=false}},true);
document.addEventListener('keydown',e=>{if(e.target.id==='review-drop'&&['Enter',' '].includes(e.key)){e.preventDefault();$('#review-file').click()}});
document.addEventListener('dragover',e=>{if(e.target.closest('#review-drop')){e.preventDefault();e.dataTransfer.dropEffect='copy';$('#review-drop').classList.add('drag-active')}});
document.addEventListener('dragleave',e=>{if(e.target.id==='review-drop')e.target.classList.remove('drag-active')});
document.addEventListener('drop',async e=>{if(!e.target.closest('#review-drop'))return;e.preventDefault();$('#review-drop').classList.remove('drag-active');try{if(e.dataTransfer.files.length!==1)throw Error('회의록 파일을 한 개씩 올려 주세요.');if(['running','queued'].includes(compose?.import?.analysis_state))throw Error('분석이 끝난 뒤 파일을 변경해 주세요.');await acceptReviewFile(e.dataTransfer.files[0])}catch(error){toast(error.message)}});

// The discussed UI refinements; no changes to unrelated screens.
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(!['work-conditions','work-conditions-reset','document-history','original-zoom','original-fit','notice-delete','notices-delete-read','notices-undo','notices-dismiss'].includes(a))return;
 e.preventDefault();e.stopImmediatePropagation();
 try{
  if(a==='work-conditions'){workConditionsOpen=!workConditionsOpen;render()}
  if(a==='work-conditions-reset'){onlyMyWork=false;detailWorkFilter='';workPage=1;render()}
  if(a==='document-history'){
   if(documentTab!=='current'){documentTab='current';render()}
   const history=$('#meeting-revisions');history.open=true;
   const approved=history.querySelector(`[data-revision="${M.approved_revision}"]`);if(approved){history.querySelectorAll('.revision-list details').forEach(x=>x.open=x===approved)}
   history.scrollIntoView?.({block:'start',behavior:'smooth'});history.querySelector('summary').focus();
  }
  if(a==='original-zoom'||a==='original-fit'){
   originalScale=a==='original-fit'?100:Math.max(50,Math.min(200,originalScale+Number(b.dataset.step)));
   $('#document-area .original-pages')?.style.setProperty('--original-scale',originalScale+'%');const output=$('#original-scale');if(output)output.textContent=originalScale+'%';
  }
  if(a==='notice-delete'||a==='notices-delete-read'){
   b.disabled=true;const user=D.user.id;
   const r=await api('/notifications/delete','POST',a==='notice-delete'?{ids:[b.dataset.id]}:{read_only:true});
   if(D.user.id!==user)return;
   if(r.ids.length){clearTimeout(noticeUndoTimer);noticeUndo={user,ids:r.ids};noticeUndoTimer=setTimeout(()=>{noticeUndo=null;paintNotices()},10000)}
   await fetchNotices();
  }
  if(a==='notices-dismiss'){clearTimeout(noticeUndoTimer);noticeUndo=null;paintNotices()}
  if(a==='notices-undo'&&noticeUndo?.user===D.user.id){b.disabled=true;const undo=noticeUndo;for(let i=0;i<undo.ids.length;i+=100)await api('/notifications/restore','POST',{ids:undo.ids.slice(i,i+100)});clearTimeout(noticeUndoTimer);noticeUndo=null;await fetchNotices()}
 }catch(error){toast(error.message)}finally{if(b.isConnected)b.disabled=false}
},true);
// Backdrop clicks close only when both press and release are outside the box.
let dialogBackdrop=false,closingDialog=false;
const outsideDialog=e=>{const r=dialog.getBoundingClientRect();return e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)};
dialog.addEventListener('pointerdown',e=>{dialogBackdrop=outsideDialog(e)});
dialog.addEventListener('click',async e=>{const close=dialogBackdrop&&outsideDialog(e);dialogBackdrop=false;if(!close||closingDialog)return;closingDialog=true;try{await closeDialog()}finally{closingDialog=false}});

document.addEventListener('fullscreenchange',()=>{const b=$('#document-area [data-act=fullscreen]');if(b)b.textContent=document.fullscreenElement?'크게 보기 닫기':'크게 보기'});

boot();
})();
</script></body></html>
