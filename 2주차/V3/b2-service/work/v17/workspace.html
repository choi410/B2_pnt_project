/* design-v18.css — theme.css 뒤에 합쳐 적용.
   범위: 홈 대시보드(dashboard.jsx), 업무 탭 제안 목록(work_proposals.jsx .work-proposals), 등록 단계·후속 업무 선택·등록 결과(composer_v18.jsx).
   CandidateEditor·.candidate-actions·.back-link·.button-group·.home-list-tools는 theme.css 기존 스타일을 유지하고 주변만 조정한다.
   원칙: PNT 남색/파랑 + 절제된 녹색 포인트. 목록 중심, 명확한 구획, 큰 숫자 카드·중첩 카드 금지,
   글자 최소 12px(보조 11px), 키보드 포커스 표시, 좁은 화면 대응. display:none으로 기능을 숨기지 않음. */

:root{
 --v18-ink:#1f3047;          /* 본문 */
 --v18-ink-2:#4a5d73;        /* 보조 본문 */
 --v18-ink-3:#6c7e91;        /* 설명 */
 --v18-line:#d9e1ea;
 --v18-line-strong:#c6d2df;
 --v18-panel:#ffffff;
 --v18-panel-2:#f7f9fb;
 --v18-blue:#174a8b;
 --v18-blue-soft:#e9f0fa;
 --v18-navy:#132f52;
 --v18-green:#5f7a14;        /* 포인트 녹색은 글자용으로 채도를 낮춤 */
 --v18-green-soft:#eef3dd;
 --v18-amber:#8a6514;
 --v18-amber-soft:#fbf2da;
 --v18-red:#a8433a;
 --v18-red-soft:#fbeae7;
 --v18-focus:#2d6fc2;
 --v18-radius:8px;
}

/* ───────── 공통: 포커스 ───────── */
.dash-brief-item:focus-visible,.dash-project-row:focus-visible,.dash-item:focus-visible,.dash-shortcuts button:focus-visible,
.proposal-meeting-row:focus-visible,.registration-result .button-group .btn:focus-visible{
 outline:2px solid var(--v18-focus);outline-offset:2px;border-radius:var(--v18-radius)}

/* ───────── 공통 유틸 ───────── */
.clamp-1,.clamp-2{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.clamp-1{-webkit-line-clamp:1}
.clamp-2{-webkit-line-clamp:2}
.dash-unset{color:#8b9bad;font-weight:400}
.is-late{color:var(--v18-red)}
.is-missing{color:var(--v18-amber)}
.dash-count{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--v18-ink-3);vertical-align:2px}
.dash-help{margin:-8px 0 12px;font-size:12px;line-height:1.7;color:var(--v18-ink-3)}
.dash-clear{margin:0;padding:14px 16px;border:1px dashed var(--v18-line);border-radius:var(--v18-radius);font-size:12.5px;color:var(--v18-ink-3);background:var(--v18-panel-2)}
.dash-back{font-size:12px;letter-spacing:0;text-transform:none}
.page-head .eyebrow .dash-back{margin:-4px 0 0 -2px}

/* ───────── 전체 현황 요약 (작은 지표 한 줄) ───────── */
.dash-brief{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:-10px 0 22px}
.dash-brief-item{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1px solid var(--v18-line);border-radius:999px;background:var(--v18-panel);font-size:12.5px;color:var(--v18-ink-2);text-align:left}
.dash-brief-item b{font-size:14px;font-weight:700;color:var(--v18-ink);font-variant-numeric:tabular-nums}
button.dash-brief-item{cursor:pointer;transition:border-color .15s,background .15s}
button.dash-brief-item:hover{border-color:var(--v18-line-strong);background:var(--v18-panel-2)}
button.dash-brief-item svg{color:#9aaabb}
.dash-brief-item.is-late{border-color:#ecc9c4;background:var(--v18-red-soft)}
.dash-brief-item.is-late b{color:var(--v18-red)}
.dash-brief-item.is-missing{border-color:#ecd9a8;background:var(--v18-amber-soft)}
.dash-brief-item.is-missing b{color:var(--v18-amber)}

/* ───────── 프로젝트 비교 목록 ───────── */
.dash-table{background:var(--v18-panel);border:1px solid var(--v18-line);border-radius:var(--v18-radius);overflow:hidden}
.dash-table-head,.dash-project-row{display:grid;grid-template-columns:minmax(190px,1.3fr) minmax(170px,1.7fr) 128px 92px 84px 118px minmax(130px,1fr) 16px;gap:14px;align-items:center;padding:0 20px}
.dash-table-head{min-height:40px;background:var(--v18-panel-2);border-bottom:1px solid var(--v18-line);font-size:11.5px;font-weight:600;color:var(--v18-ink-3);letter-spacing:.2px}
.dash-table-head .column-sort{padding:0;font-size:inherit;color:inherit}
.dash-project-row{width:100%;min-height:68px;padding-top:12px;padding-bottom:12px;text-align:left;border-top:1px solid #eef2f6;background:transparent;cursor:pointer;transition:background .12s}
.dash-project-row:first-of-type{border-top:0}
.dash-project-row:hover{background:#f9fbfd}
.dash-project-row>svg{color:#a3b1c1}
.dash-cell-name{display:flex;flex-direction:column;gap:3px;min-width:0}
.dash-cell-name b{font-size:14px;font-weight:700;color:var(--v18-ink);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-cell-name small{font-size:11.5px;color:var(--v18-ink-3);display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.dash-cell-name small .person span{font-size:11.5px}
.dash-cell-purpose{font-size:12.5px;line-height:1.55;color:var(--v18-ink-2);min-width:0}
.dash-cell-stage{min-width:0}
.dash-stage{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 9px;border-radius:4px;background:var(--v18-blue-soft);color:var(--v18-blue);font-size:12px;font-weight:600}
.dash-cell-num{display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.dash-cell-num b{font-size:15px;font-weight:700;color:var(--v18-ink);line-height:1.3}
.dash-cell-num.is-late b{color:var(--v18-red)}
.dash-sub{font-size:11px;font-weight:600}
.dash-cell-date{display:flex;flex-direction:column;gap:2px;min-width:0;font-variant-numeric:tabular-nums}
.dash-cell-date b{font-size:13.5px;font-weight:700;color:var(--v18-ink);line-height:1.3}
.dash-cell-date small{font-size:11.5px;color:var(--v18-ink-3);line-height:1.4}
.dash-cell-date .dash-unset{font-size:12px;line-height:1.4}

/* ───────── 프로젝트 하나: 단계·다음 목표 ───────── */
.dash-direction{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.8fr);gap:24px;align-items:start;margin:-14px 0 26px;padding:14px 0 18px;border-bottom:1px solid var(--v18-line)}
.dash-stages{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:12.5px;color:var(--v18-ink-3)}
.dash-stages svg{color:#aab6c4;flex:none}
.dash-stages span{padding:4px 10px;border:1px solid var(--v18-line);border-radius:999px;background:var(--v18-panel);white-space:nowrap}
.dash-stages span.current{border-color:var(--v18-blue);background:var(--v18-blue);color:#fff;font-weight:600}
.dash-stages span.current::after{content:' · 현재';font-weight:400;opacity:.85}
.dash-next-goal{margin:0;font-size:13px;line-height:1.7;color:var(--v18-ink)}
.dash-next-goal small{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--v18-ink-3);margin-bottom:3px}

/* ───────── 프로젝트 하나: 본문 2열 ───────── */
.dash-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
.dash-main,.dash-side{display:flex;flex-direction:column;gap:30px;min-width:0}
.dash-block .section-title h2{font-size:16px;font-weight:700;color:var(--v18-ink);margin:0}
.dash-block>.text-link{margin-top:10px}
.dash-side .period-calendar{margin:0}

/* 막힌 일 목록 */
.dash-list{display:flex;flex-direction:column;background:var(--v18-panel);border:1px solid var(--v18-line);border-radius:var(--v18-radius);overflow:hidden}
.dash-item{display:grid;grid-template-columns:84px minmax(0,1fr) auto 16px;gap:14px;align-items:center;width:100%;padding:12px 16px;text-align:left;border-top:1px solid #eef2f6;background:transparent;cursor:pointer;transition:background .12s}
.dash-item:first-child{border-top:0}
.dash-item:hover{background:#f9fbfd}
.dash-item>svg{color:#a3b1c1}
.dash-item-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.dash-item-main b{font-size:13.5px;font-weight:600;color:var(--v18-ink);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-item-main small{font-size:11.5px;color:var(--v18-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-reason{display:inline-flex;justify-content:center;align-items:center;min-height:24px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:700;white-space:nowrap;background:#edf0f4;color:var(--v18-ink-2)}
.dash-reason.r-기한지남{background:var(--v18-red-soft);color:var(--v18-red)}
.dash-reason.r-담당미정,.dash-reason.r-기한미정{background:var(--v18-amber-soft);color:var(--v18-amber)}
.dash-reason.r-검토대기{background:var(--v18-blue-soft);color:var(--v18-blue)}
.dash-reason.r-보완요청{background:#faece6;color:#b15545}
.dash-reason.r-추가확인{background:#f4edf8;color:#865c9a}

/* 바로가기 */
.dash-shortcuts{display:flex;flex-direction:column;border:1px solid var(--v18-line);border-radius:var(--v18-radius);background:var(--v18-panel);overflow:hidden}
.dash-shortcuts button{display:grid;grid-template-columns:18px minmax(0,1fr) 16px;gap:12px;align-items:center;padding:12px 14px;text-align:left;border-top:1px solid #eef2f6;background:transparent;cursor:pointer}
.dash-shortcuts button:first-child{border-top:0}
.dash-shortcuts button:hover{background:#f9fbfd}
.dash-shortcuts svg{color:var(--v18-blue)}
.dash-shortcuts button>svg:last-child{color:#a3b1c1}
.dash-shortcuts b{display:block;font-size:13px;font-weight:600;color:var(--v18-ink);line-height:1.4}
.dash-shortcuts small{display:block;font-size:11.5px;color:var(--v18-ink-3);line-height:1.5;margin-top:1px}

/* ───────── 업무 탭: 제안 목록 (.work-proposals) ─────────
   실제 마크업(work_proposals.jsx): section.work-proposals
     목록: .home-list-tools(기존) → .proposal-meetings > button.proposal-meeting-row [svg, span(b, small, span.proposal-preview), span.proposal-row-count(strong), svg]
     상세: button.back-link(기존) → .section-title(div(h2,p), Button) → section.proposal-linked(h3, TaskRows) → .section-title(h3, span)
           → div(p.proposal-requested + CandidateEditor(기존)) … → .candidate-actions(기존) */
.work-proposals{display:flex;flex-direction:column;gap:18px}
.work-proposals .home-list-tools{margin:0}
.work-proposals .home-list-tools>.muted{margin:0;line-height:1.7}
.proposal-meetings{display:flex;flex-direction:column;background:var(--v18-panel);border:1px solid var(--v18-line);border-radius:var(--v18-radius);overflow:hidden}
.proposal-meeting-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto 16px;gap:14px;align-items:center;width:100%;padding:14px 18px;text-align:left;border-top:1px solid #eef2f6;background:transparent;cursor:pointer;transition:background .12s}
.proposal-meeting-row:first-child{border-top:0}
.proposal-meeting-row:hover{background:#f9fbfd}
.proposal-meeting-row>svg:first-child{color:var(--v18-ink-3)}
.proposal-meeting-row>svg:last-child{color:#a3b1c1}
.proposal-meeting-row>span:nth-child(2){display:flex;flex-direction:column;gap:2px;min-width:0}
.proposal-meeting-row b{font-size:14px;font-weight:700;color:var(--v18-ink);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proposal-meeting-row small{font-size:11.5px;color:var(--v18-ink-3)}
.proposal-preview{display:block;margin-top:3px;font-size:12.5px;color:var(--v18-ink-2);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proposal-row-count{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px;font-weight:600;color:var(--v18-blue);white-space:nowrap;font-variant-numeric:tabular-nums}
.proposal-row-count strong{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--v18-amber-soft);color:var(--v18-amber)}
.work-proposals .section-title{margin-bottom:12px}
.work-proposals .section-title h2{margin:0;font-size:17px;font-weight:700;color:var(--v18-ink)}
.work-proposals .section-title h3{margin:0;font-size:14px;font-weight:700;color:var(--v18-ink)}
.work-proposals .section-title p{margin:3px 0 0;font-size:12.5px;color:var(--v18-ink-3)}
.work-proposals .section-title>span{font-size:12px;color:var(--v18-ink-3)}
.proposal-linked{padding:14px 16px 16px;border:1px solid var(--v18-line);border-radius:var(--v18-radius);background:var(--v18-panel-2)}
.proposal-linked h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--v18-ink-2)}
.proposal-linked .task-table{background:var(--v18-panel)}
.proposal-requested{display:inline-flex;align-items:center;gap:4px;margin:0 0 6px;padding:3px 9px;border-radius:4px;background:var(--v18-amber-soft);color:var(--v18-amber);font-size:11.5px;font-weight:700}
.proposal-requested .person span{font-size:11.5px;font-weight:600}
.work-proposals .candidate-actions{margin-top:6px}
.work-proposals .candidate-actions>span{margin-right:auto;font-size:12.5px;color:var(--v18-ink-2)}

/* ───────── 등록 단계 표시 (.registration-steps) ─────────
   실제 마크업(composer_v18.jsx): ol.registration-steps > li.active|done|'' > span(번호) + 텍스트 (+ small '선택') */
.registration-steps{display:flex;list-style:none;margin:0 0 22px;padding:0;border:1px solid var(--v18-line);border-radius:var(--v18-radius);background:var(--v18-panel);overflow-x:auto;scrollbar-width:thin}
.registration-steps li{display:flex;align-items:center;gap:10px;flex:1 1 0;min-width:140px;padding:11px 16px;border-left:1px solid var(--v18-line);font-size:12.5px;font-weight:600;color:var(--v18-ink-3);white-space:nowrap;position:relative}
.registration-steps li:first-child{border-left:0}
.registration-steps li>span{display:inline-flex;justify-content:center;align-items:center;width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--v18-line-strong);font-size:11.5px;font-weight:700;color:var(--v18-ink-3);background:#fff;font-variant-numeric:tabular-nums}
.registration-steps li small{font-size:11px;font-weight:500;color:var(--v18-ink-3)}
.registration-steps li.active{background:var(--v18-blue-soft);color:var(--v18-blue)}
.registration-steps li.active>span{border-color:var(--v18-blue);background:var(--v18-blue);color:#fff}
.registration-steps li.active small{color:var(--v18-blue)}
.registration-steps li.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--v18-blue)}
.registration-steps li.done{color:var(--v18-ink)}
.registration-steps li.done>span{border-color:var(--v18-green);background:var(--v18-green-soft);color:var(--v18-green)}

/* ───────── 후속 업무 선택 (.assignment-step) ─────────
   실제 마크업: section.assignment-step > .section-title(div(h2,p), Button) → CandidateEditor(기존 스타일 유지) × N → p.warning → .candidate-actions(기존) */
.assignment-step{display:flex;flex-direction:column}
.assignment-step>.section-title{align-items:flex-start;margin-bottom:16px}
.assignment-step>.section-title h2{margin:0;font-size:17px;font-weight:700;color:var(--v18-ink)}
.assignment-step>.section-title p{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--v18-ink-3)}
.assignment-step .candidate-editor{margin-bottom:10px}
.assignment-step .candidate-editor:has(input[type=checkbox]:checked){border-color:#b9cbe6;box-shadow:inset 3px 0 0 var(--v18-blue)}
.assignment-step>.warning{margin:6px 0}
.assignment-step .candidate-actions{margin-top:10px;position:sticky;bottom:0;z-index:2;border:1px solid var(--v18-line);background:var(--v18-panel-2);box-shadow:0 -6px 18px #15305014}
.assignment-step .candidate-actions>span{margin-right:auto;font-size:12.5px;font-weight:600;color:var(--v18-ink-2)}

/* ───────── 등록 결과 (.registration-result) ─────────
   실제 마크업: section.registration-result > svg(Check) + h2(회의 제목) + dl(dt/dd × 3: 회의록 · 후속 업무 · 요구·변경사항) + p.field-note + .button-group(기존)
   한 개의 단정한 요약 표: dl을 2열(항목 | 결과) 표로 그린다. 큰 카드·큰 숫자 없음. */
.registration-result{max-width:760px;padding:22px 26px 22px;border:1px solid var(--v18-line);border-top:3px solid var(--v18-green);border-radius:var(--v18-radius);background:var(--v18-panel);display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-areas:"icon title" "table table" "note note" "actions actions";column-gap:12px;row-gap:14px;align-items:start}
.registration-result>svg{grid-area:icon;width:26px;height:26px;color:var(--v18-green);margin-top:1px}
.registration-result>h2{grid-area:title;margin:0;font-size:17px;font-weight:700;line-height:1.45;color:var(--v18-ink)}
.registration-result>dl{grid-area:table;display:grid;grid-template-columns:132px minmax(0,1fr);margin:4px 0 0;border:1px solid var(--v18-line);border-radius:6px;overflow:hidden;background:var(--v18-panel)}
.registration-result>dl>dt,.registration-result>dl>dd{margin:0;padding:11px 14px;border-top:1px solid #eef2f6;font-size:13px;line-height:1.6}
.registration-result>dl>dt:first-of-type,.registration-result>dl>dd:first-of-type{border-top:0}
.registration-result>dl>dt{background:var(--v18-panel-2);font-weight:700;color:var(--v18-ink-3);font-size:12px;letter-spacing:.2px}
.registration-result>dl>dd{color:var(--v18-ink)}
.registration-result>.field-note{grid-area:note;margin:0;font-size:11.5px;color:var(--v18-ink-3)}
.registration-result>.button-group{grid-area:actions;display:flex;justify-content:flex-start;gap:8px;margin-top:2px}

/* ───────── 반응형 ───────── */
@media(max-width:1200px){
 .dash-table-head,.dash-project-row{grid-template-columns:minmax(170px,1.3fr) minmax(140px,1.4fr) 110px 84px 76px 104px minmax(110px,1fr) 16px;gap:12px}
}
@media(max-width:1100px){
 .dash-layout{grid-template-columns:minmax(0,1fr) 290px;gap:28px}
 .dash-table-head,.dash-project-row{grid-template-columns:minmax(170px,1.4fr) 110px 84px 76px 104px minmax(110px,1fr) 16px}
 .dash-table-head>:nth-child(2),.dash-cell-purpose{display:none} /* 목적 열은 좁은 화면에서 생략(프로젝트를 열면 전체가 보임) */
}
@media(max-width:1000px){
 .dash-layout{grid-template-columns:1fr}
 .dash-direction{grid-template-columns:1fr;gap:12px}
}
@media(max-width:850px){
 .dash-table{border:0;background:transparent;overflow:visible}
 .dash-table-head{display:none} /* 카드형에서는 각 셀이 자체 라벨을 가짐 */
 .dash-project-row{grid-template-columns:1fr 1fr;grid-template-areas:"name name" "stage next" "remaining late" "meeting meeting";gap:8px 14px;margin-bottom:10px;padding:14px 16px;border:1px solid var(--v18-line);border-radius:var(--v18-radius);background:var(--v18-panel)}
 .dash-project-row>svg{display:none}
 .dash-cell-name{grid-area:name}
 .dash-cell-stage{grid-area:stage}
 .dash-cell-date:nth-of-type(6){grid-area:next}
 .dash-cell-date:nth-of-type(7){grid-area:meeting}
 .dash-cell-num:nth-of-type(4){grid-area:remaining}
 .dash-cell-num:nth-of-type(5){grid-area:late}
 .dash-cell-num::before,.dash-cell-date::before,.dash-cell-stage::before{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--v18-ink-3)}
 .dash-cell-stage::before{content:'현재 단계';display:block;margin-bottom:3px}
 .dash-cell-num:nth-of-type(4)::before{content:'남은 업무'}
 .dash-cell-num:nth-of-type(5)::before{content:'기한 지남'}
 .dash-cell-date:nth-of-type(6)::before{content:'다음 기한'}
 .dash-cell-date:nth-of-type(7)::before{content:'최근 회의록'}
 .dash-cell-num,.dash-cell-date{flex-direction:column}
 .dash-item{grid-template-columns:minmax(0,1fr) 16px;grid-template-areas:"reason arrow" "main arrow" "status arrow";gap:6px 10px}
 .dash-reason{grid-area:reason;justify-self:start}
 .dash-item-main{grid-area:main}
 .dash-item .status{grid-area:status;justify-self:start}
 .dash-item>svg{grid-area:arrow}
 .registration-result{grid-template-columns:24px minmax(0,1fr);padding:18px}
 .registration-result>dl{grid-template-columns:1fr}
 .registration-result>dl>dt{padding-bottom:4px;border-top:1px solid #eef2f6}
 .registration-result>dl>dd{padding-top:0;border-top:0}
 .registration-result>dl>dt:first-of-type{border-top:0}
 .registration-result>.button-group{flex-wrap:wrap}
 .proposal-meeting-row{grid-template-columns:20px minmax(0,1fr) 16px;grid-template-areas:"icon main arrow" "icon count arrow";gap:6px 12px}
 .proposal-meeting-row>svg:first-child{grid-area:icon;align-self:start}
 .proposal-meeting-row>span:nth-child(2){grid-area:main}
 .proposal-row-count{grid-area:count;flex-direction:row;align-items:center;gap:8px}
 .proposal-meeting-row>svg:last-child{grid-area:arrow}
 .assignment-step>.section-title{flex-direction:column;align-items:stretch}
}
@media(max-width:540px){
 .dash-brief{gap:6px}
 .dash-brief-item{min-height:32px;padding:0 10px;font-size:12px}
 .dash-project-row{grid-template-columns:1fr;grid-template-areas:"name" "stage" "remaining" "late" "next" "meeting"}
 .registration-steps li{min-width:124px;padding:10px 12px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
 .dash-brief-item,.dash-project-row,.dash-item,.dash-shortcuts button,.proposal-meeting-row{transition:none}
}

/* design-v181.css — theme.css, design-v18.css 뒤에 합쳐 적용.
   범위: 홈 v1.8.1(dashboard.jsx, .home-v181 .hf-*) 과 변경 이력 v1.8.1(.change-flow-page 계약 클래스)만.
   기존 theme.css / design-v18.css는 수정하지 않는다. 애니메이션·외부 라이브러리 없음.
   색: PNT 남색/파랑 유지, 완료=절제된 녹색, 진행=파랑, 미착수=회색. 모든 상태는 색과 글자를 함께 표시한다. */

:root{
 --f-ink:#1f3047;--f-ink-2:#4a5d73;--f-ink-3:#6c7e91;
 --f-line:#d9e1ea;--f-line-strong:#c6d2df;--f-panel:#fff;--f-panel-2:#f7f9fb;
 --f-blue:#174a8b;--f-blue-soft:#e9f0fa;--f-navy:#132f52;
 --f-done:#4f7a2a;--f-done-bar:#7da64f;--f-done-soft:#eef5e6;
 --f-active-bar:#5b8ed8;--f-todo-bar:#d5dde7;
 --f-amber:#8a6514;--f-amber-soft:#fbf2da;--f-red:#a8433a;--f-red-soft:#fbeae7;--f-purple:#865c9a;--f-purple-soft:#f4edf8;
 --f-focus:#2d6fc2;--f-radius:8px;
}

/* ═════════ 홈 v1.8.1 ═════════ */
.home-v181 .hf-unset{color:#8b9bad;font-weight:400}
.home-v181 .hf-note{margin:6px 0 0;font-size:12px;color:var(--f-ink-3)}
.home-v181 .hf-count{margin-left:6px;font-size:12px;font-weight:600;color:var(--f-ink-3);vertical-align:2px}
.home-v181 .hf-back{font-size:12px;letter-spacing:0;text-transform:none;margin:-4px 0 0 -2px}
.home-v181 .hf-section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
.home-v181 .hf-section-head h2{margin:0;font-size:15px;font-weight:700;color:var(--f-ink)}
.home-v181 .page-head{margin-bottom:22px}
.home-v181 .hf-project-row:focus-visible,.home-v181 .hf-attend-item:focus-visible,.home-v181 .hf-overview summary:focus-visible{outline:2px solid var(--f-focus);outline-offset:2px;border-radius:var(--f-radius)}

/* 완료 막대 */
.hf-bar-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.hf-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--f-todo-bar)}
.hf-bar.is-empty{background:repeating-linear-gradient(135deg,#e9eef4 0 6px,#f4f7fa 6px 12px)}
.hf-bar .seg{display:block;flex:0 0 auto;min-width:3px;height:100%}
.seg.done{background:var(--f-done-bar)}
.seg.active{background:var(--f-active-bar)}
.seg.todo{background:var(--f-todo-bar)}
.hf-bar-text{font-size:12.5px;color:var(--f-ink-2);font-variant-numeric:tabular-nums;line-height:1.5}
.hf-bar-text b{color:var(--f-ink);font-weight:700}
.hf-bar-text .hf-late{font-style:normal;color:var(--f-red);font-weight:600}
.hf-bar-wrap.compact .hf-bar{height:9px}
.hf-bar-wrap.compact .hf-bar-text{font-size:11.5px;color:var(--f-ink-3)}
.hf-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:10px 0 0;font-size:11.5px;color:var(--f-ink-3)}
.hf-legend>span{display:inline-flex;align-items:center;gap:6px}
.hf-legend .seg{width:12px;height:8px;border-radius:2px;flex:none}
.hf-legend small{font-size:11px;color:#8b9bad}
.hf-legend-note{margin-left:auto}

/* 전체 프로젝트 목록 — 표 대신 한 줄 요약 */
.hf-project-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hf-project-row{display:grid;grid-template-columns:minmax(180px,1.1fr) 150px minmax(220px,1.5fr) minmax(170px,1fr) 16px;gap:18px;align-items:center;width:100%;padding:14px 18px;text-align:left;border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel);cursor:pointer;transition:border-color .12s,background .12s}
.hf-project-row:hover{border-color:var(--f-line-strong);background:#fbfcfe}
.hf-project-row>svg{color:#a3b1c1}
.hf-cell-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.hf-cell-name b{font-size:14.5px;font-weight:700;color:var(--f-ink);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hf-cell-name small{font-size:11.5px;color:var(--f-ink-3);display:flex;gap:4px;align-items:center;white-space:nowrap}
.hf-cell-name small .person span{font-size:11.5px}
.hf-cell-stage{display:flex;flex-direction:column;gap:1px;min-width:0}
.hf-cell-stage small{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--f-ink-3)}
.hf-cell-stage b{font-size:13px;font-weight:600;color:var(--f-blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hf-cell-bar{min-width:0}
.hf-cell-flags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;min-width:0}
.hf-flag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-style:normal;font-size:11.5px;font-weight:600;white-space:nowrap;background:#edf0f4;color:var(--f-ink-2);font-variant-numeric:tabular-nums}
.hf-flag.is-late{background:var(--f-red-soft);color:var(--f-red)}
.hf-flag.is-check{background:var(--f-amber-soft);color:var(--f-amber)}
.hf-flag.hf-unset{background:transparent;color:#8b9bad;font-weight:400}

/* 프로젝트 하나: 목적 + 단계 노드 */
.hf-direction{margin:-6px 0 26px;padding:0 0 20px;border-bottom:1px solid var(--f-line)}
.hf-purpose{margin:0 0 16px;font-size:14px;line-height:1.75;color:var(--f-ink);max-width:880px}
.hf-stages{display:flex;flex-wrap:wrap;align-items:flex-start;list-style:none;margin:0;padding:0;counter-reset:stage}
.hf-stages li{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:112px;flex:1 1 0;padding:0 14px 0 0;font-size:12.5px;color:var(--f-ink-3)}
.hf-stages li i{display:block;width:12px;height:12px;border-radius:50%;border:2px solid var(--f-line-strong);background:#fff;position:relative;z-index:1}
.hf-stages li::before{content:'';position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--f-line)} /* 노드 사이 연결선 — 완료 여부를 뜻하지 않음 */
.hf-stages li:last-child::before{display:none}
.hf-stages li span{font-weight:500;line-height:1.4;word-break:keep-all}
.hf-stages li small{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--f-blue)}
.hf-stages li.current{color:var(--f-ink)}
.hf-stages li.current i{border-color:var(--f-blue);background:var(--f-blue);box-shadow:0 0 0 3px var(--f-blue-soft)}
.hf-stages li.current span{font-weight:700;color:var(--f-blue)}
.hf-stages-empty{margin:0;font-size:12.5px}

/* 업무 완료율 블록 */
.hf-completion{margin-bottom:28px;padding:16px 18px 14px;border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel)}
.hf-completion .hf-bar{height:14px;border-radius:7px}
.hf-completion .hf-bar-text{font-size:13px}

/* 확인할 일 + 작은 달력 */
.hf-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start;margin-bottom:26px}
.hf-attend-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel);overflow:hidden}
.hf-attend-list li+li{border-top:1px solid #eef2f6}
.hf-attend-item{display:grid;grid-template-columns:82px minmax(0,1fr) 16px;gap:14px;align-items:center;width:100%;padding:12px 16px;text-align:left;background:transparent;cursor:pointer}
.hf-attend-item:hover{background:#f9fbfd}
.hf-attend-item>svg{color:#a3b1c1}
.hf-attend-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.hf-attend-main b{font-size:13.5px;font-weight:600;color:var(--f-ink);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hf-attend-main small{font-size:11.5px;color:var(--f-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hf-reason{display:inline-flex;justify-content:center;align-items:center;min-height:24px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:700;white-space:nowrap;background:#edf0f4;color:var(--f-ink-2)}
.hf-reason.r-기한지남{background:var(--f-red-soft);color:var(--f-red)}
.hf-reason.r-담당미정,.hf-reason.r-기한미정{background:var(--f-amber-soft);color:var(--f-amber)}
.hf-reason.r-검토대기{background:var(--f-blue-soft);color:var(--f-blue)}
.hf-reason.r-보완요청{background:#faece6;color:#b15545}
.hf-reason.r-추가확인{background:var(--f-purple-soft);color:var(--f-purple)}
.hf-clear{margin:0;padding:14px 16px;border:1px dashed var(--f-line);border-radius:var(--f-radius);font-size:12.5px;line-height:1.7;color:var(--f-ink-3);background:var(--f-panel-2)}
/* 기존 달력을 작게: 글자·셀 간격만 축소, 동작은 그대로 */
.hf-calendar .period-calendar{margin:0;padding:14px 14px 12px;border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel)}
.hf-calendar .period-calendar .section-title{margin-bottom:8px}
.hf-calendar .period-calendar .section-title h2{font-size:14px}
.hf-calendar .period-weekdays span{font-size:10.5px}
.hf-calendar .period-date{font-size:11.5px}
.hf-calendar .period-bar{font-size:10px}
.hf-calendar .agenda-heading{margin-top:10px}
.hf-calendar .agenda button{padding:7px 0}
.hf-calendar .agenda b{font-size:12px}

/* 접힌 개요(수정 포함) */
.hf-overview{border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel)}
.hf-overview summary{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--f-ink-2)}
.hf-overview summary::-webkit-details-marker{display:none}
.hf-overview summary svg{color:var(--f-ink-3);transition:transform .12s}
.hf-overview[open] summary svg{transform:rotate(180deg)}
.hf-overview summary small{margin-left:auto;font-size:11px;font-weight:400;color:var(--f-ink-3)}
.hf-overview-body{padding:0 16px 6px;border-top:1px solid #eef2f6}
.hf-overview-body .project-context{border:0;margin:0;padding:14px 0 8px}

/* ═════════ 변경 이력 v1.8.1 (.change-flow-page) ═════════
   실제 마크업(change_history.jsx):
   .change-flow-page > .flow-toolbar(.tabs + label.search + text-link) / .flow-workspace( nav.flow-topics(span.flow-topics-label + button.flow-topic-item[b, small, span, small>em]) + section.flow-detail )
   .flow-detail-head(div(small,h2) + span) → .flow-baseline(small, strong, span, p.timeline-warning?) → p.flow-pending-note → ol.change-timeline
   li.timeline-event.confirmed|unverified|excluded > div.timeline-date(time, small) + article.timeline-content(
     .timeline-meta(span.business-state.state-요청|확정|보류|철회, b.timeline-current, small) · p.timeline-value · p.timeline-before(span) · button.timeline-source · small.field-note
     · details.timeline-evidence(summary, blockquote*, p, p.timeline-warning, .btn 직접 자식, p.field-note) · .timeline-actions(text-link*) )
   details.flow-analysis-tools(summary, p.field-note, p.timeline-warning*, .btn, p[role=status])
   색 원칙: 요청·보류·철회는 자동 기록이며 확인 대상이 아니므로 중립색. '확정(합의)'인데 아직 확인 전인 기록만 노란 강조. 확인된 기록은 녹색, 제외는 회색 점선. */
.change-flow-page{display:flex;flex-direction:column;gap:16px}
.flow-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.flow-toolbar .tabs{margin:0;border-bottom:0;gap:16px}
.flow-toolbar .tabs button{padding:8px 1px}
.flow-toolbar .search{flex:1 1 240px;max-width:380px;margin-left:auto}
.flow-toolbar>.text-link{white-space:nowrap}

.flow-workspace{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:24px;align-items:start}

/* 좌측 항목 목록 */
.flow-topics{display:flex;flex-direction:column;border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel);max-height:calc(100vh - 220px);overflow-y:auto;scrollbar-width:thin}
.flow-topics-label{display:block;padding:9px 14px;font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--f-ink-3);background:var(--f-panel-2);border-bottom:1px solid var(--f-line);position:sticky;top:0;z-index:1}
.flow-topic-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:11px 14px 11px 16px;text-align:left;background:transparent;border-top:1px solid #eef2f6;cursor:pointer;position:relative;min-width:0}
.flow-topics-label+.flow-topic-item{border-top:0}
.flow-topic-item:hover{background:#f9fbfd}
.flow-topic-item.selected{background:var(--f-blue-soft)}
.flow-topic-item.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--f-blue)}
.flow-topic-item>b{font-size:13.5px;font-weight:700;color:var(--f-ink);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-topic-item>small{font-size:11.5px;color:var(--f-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-topic-item>span{font-size:12.5px;color:var(--f-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px} /* 현재 기준 값 */
.flow-topic-item>small:last-child{margin-top:2px;font-variant-numeric:tabular-nums}
.flow-topic-item>small em{font-style:normal;display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:700;background:var(--f-amber-soft);color:var(--f-amber)}
.flow-topic-item:focus-visible{outline:2px solid var(--f-focus);outline-offset:-2px}

/* 우측 상세 */
.flow-detail{min-width:0;display:flex;flex-direction:column;gap:14px}
.flow-detail-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.flow-detail-head small{display:block;font-size:11.5px;color:var(--f-ink-3);margin-bottom:2px}
.flow-detail-head h2{margin:0;font-size:18px;font-weight:700;color:var(--f-ink);line-height:1.4}
.flow-detail-head>span{font-size:12px;color:var(--f-ink-3);white-space:nowrap}

/* 현재 확인된 기준 */
.flow-baseline{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:13px 18px 12px;border:1px solid #cfe0cc;border-left:4px solid var(--f-done);border-radius:var(--f-radius);background:var(--f-done-soft)}
.flow-baseline>small{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--f-done)}
.flow-baseline>strong{font-size:15.5px;font-weight:700;color:var(--f-ink);line-height:1.5;overflow-wrap:anywhere}
.flow-baseline>span{font-size:11.5px;color:var(--f-ink-3)}
.flow-baseline>.timeline-warning{margin-top:8px}
.flow-baseline.is-empty{background:var(--f-panel-2);border-color:var(--f-line);border-left-color:var(--f-line-strong)}
.flow-baseline.is-empty>small{color:var(--f-ink-3)}
/* 기준이 아직 없을 때(strong 뒤 span 문구가 안내문) — 색을 중립으로 */
.flow-pending-note{margin:0;padding:10px 14px;border:1px solid #e8dcb5;border-left:4px solid var(--f-amber);border-radius:var(--f-radius);background:var(--f-amber-soft);font-size:12.5px;line-height:1.65;color:#5a4a1a}

/* 타임라인 */
.change-timeline{list-style:none;margin:2px 0 0;padding:0;position:relative}
.change-timeline::before{content:'';position:absolute;top:12px;bottom:12px;left:87px;width:2px;background:var(--f-line)} /* 세로선 */
.timeline-event{display:grid;grid-template-columns:72px 30px minmax(0,1fr);gap:0 8px;padding:0 0 18px;position:relative}
.timeline-event:last-child{padding-bottom:2px}
.timeline-date{grid-column:1;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-top:9px;text-align:right;font-variant-numeric:tabular-nums}
.timeline-date time{font-size:12px;font-weight:700;color:var(--f-ink-2);white-space:nowrap}
.timeline-date small{font-size:10.5px;color:#8b9bad;white-space:nowrap}
.timeline-event::before{content:'';grid-column:2;grid-row:1;justify-self:center;margin-top:12px;width:12px;height:12px;border-radius:50%;border:2px solid var(--f-line-strong);background:#fff;position:relative;z-index:1} /* 노드 */
.timeline-event.confirmed::before{border-color:var(--f-done);background:var(--f-done)}
.timeline-event.excluded::before{border-color:#c4ccd6;background:#eef1f5}
.timeline-content{grid-column:3;min-width:0;padding:10px 14px 11px;border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel)}
.timeline-event.confirmed .timeline-content{border-left:3px solid var(--f-done)}
.timeline-event.excluded .timeline-content{border-style:dashed;background:var(--f-panel-2)}
.timeline-event.excluded .timeline-value{color:var(--f-ink-3);text-decoration:line-through;text-decoration-color:#b8c2cf}
/* 미확인 중 '합의(확정)'만 노란 강조: 기준 반영을 기다리는 유일한 항목. 요청·보류·철회 미확인은 중립. */
.timeline-event.unverified:has(.business-state.state-확정)::before{border-color:var(--f-amber);border-style:dashed}
.timeline-event.unverified:has(.business-state.state-확정) .timeline-content{border-left:3px solid var(--f-amber);background:#fffdf7}
.timeline-event.unverified:has(.business-state.state-확정) .timeline-meta>small{color:var(--f-amber);font-weight:700}

.timeline-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px;font-size:11.5px;color:var(--f-ink-3)}
.business-state{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700;line-height:1.6;background:#edf0f4;color:var(--f-ink-2)}
.business-state.state-요청{background:var(--f-blue-soft);color:var(--f-blue)}
.business-state.state-확정{background:var(--f-done-soft);color:var(--f-done)}
.business-state.state-보류{background:#f1f3f6;color:var(--f-ink-2)}
.business-state.state-철회{background:#f1f3f6;color:var(--f-ink-3)}
.timeline-current{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:700;background:var(--f-done);color:#fff}
.timeline-current svg{width:12px;height:12px}
.timeline-value{margin:0;font-size:15px;font-weight:600;line-height:1.55;color:var(--f-ink);overflow-wrap:anywhere}
.timeline-before{margin:4px 0 0;font-size:12px;color:var(--f-ink-2)}
.timeline-before>span{display:inline-block;margin-right:6px;font-size:11px;font-weight:700;color:var(--f-ink-3)}
.timeline-source{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:0;font-size:12px;font-weight:600;color:var(--f-blue);background:transparent;cursor:pointer;text-align:left}
.timeline-source:hover{text-decoration:underline}
.timeline-source+.field-note{display:inline-block;margin:0 0 0 10px}
.timeline-actions{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:6px}
.timeline-actions .text-link{font-size:12px;padding:2px 0}
.timeline-warning{margin:8px 0 0;padding:8px 10px;border-radius:6px;background:var(--f-red-soft);color:var(--f-red);font-size:12px;line-height:1.6}
.timeline-evidence{margin-top:8px;border-top:1px dashed var(--f-line);padding-top:6px}
.timeline-evidence>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--f-ink-2);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.timeline-evidence>summary::-webkit-details-marker{display:none}
.timeline-evidence>summary::before{content:'▸';font-size:11px;color:var(--f-ink-3)}
.timeline-evidence[open]>summary::before{content:'▾'}
.timeline-evidence>blockquote{margin:8px 0 0;padding:8px 12px;border-left:3px solid #c9d8ee;background:var(--f-panel-2);font-size:12.5px;line-height:1.7;color:var(--f-ink-2);border-radius:0 6px 6px 0}
.timeline-evidence>p{margin:8px 0 0;font-size:12.5px;color:var(--f-ink-3)}
.timeline-evidence>.btn{margin-top:10px} /* "이 합의 내용 확인·반영" — details 직접 자식 */
.timeline-evidence>.field-note{margin-top:8px}
.timeline-event:focus-within .timeline-content{border-color:var(--f-focus)}
.flow-detail .empty{padding:36px 20px}

/* 분석 관리(PM) — 화면 아래 접힌 도구 */
.flow-analysis-tools{margin-top:8px;padding:0 16px;border:1px solid var(--f-line);border-radius:var(--f-radius);background:var(--f-panel-2)}
.flow-analysis-tools>summary{cursor:pointer;padding:11px 0;font-size:12.5px;font-weight:600;color:var(--f-ink-2);list-style:none;display:flex;align-items:center;gap:8px}
.flow-analysis-tools>summary::-webkit-details-marker{display:none}
.flow-analysis-tools>summary::before{content:'▸';font-size:11px;color:var(--f-ink-3)}
.flow-analysis-tools[open]>summary::before{content:'▾'}
.flow-analysis-tools>.field-note{margin:0 0 8px}
.flow-analysis-tools>.timeline-warning{margin:0 0 8px}
.flow-analysis-tools>.btn{margin:4px 0 12px}
.flow-analysis-tools>p[role=status]{margin:0 0 12px;font-size:12px;color:var(--f-ink-3)}
.change-scan-note{font-size:12px;color:var(--f-ink-3);margin:0}
.change-disabled-reason{font-size:11.5px;color:var(--f-amber);margin:4px 0 0}

/* ═════════ 반응형 ═════════ */
@media(max-width:1100px){
 .hf-project-row{grid-template-columns:minmax(170px,1.2fr) 130px minmax(200px,1.4fr) 16px}
 .hf-cell-flags{grid-column:1 / -1;justify-content:flex-start;margin-top:-4px}
 .hf-layout{grid-template-columns:minmax(0,1fr) 280px;gap:24px}
 .flow-workspace{grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:18px}
}
@media(max-width:900px){
 .hf-layout{grid-template-columns:1fr}
 .hf-project-row{grid-template-columns:minmax(0,1fr) 16px;gap:8px 12px}
 .hf-cell-name,.hf-cell-stage,.hf-cell-bar,.hf-cell-flags{grid-column:1}
 .hf-project-row>svg{grid-column:2;grid-row:1}
 .hf-cell-stage{flex-direction:row;align-items:center;gap:8px}
 .hf-cell-stage small::after{content:':'}
 .hf-legend-note{margin-left:0;flex-basis:100%}
 /* 변경 이력: 위 주제 목록, 아래 타임라인 */
 .flow-workspace{grid-template-columns:1fr}
 .flow-topics{max-height:260px}
 .flow-detail-head{flex-direction:column;align-items:flex-start;gap:4px}
 .change-timeline::before{left:14px}
 .timeline-event{grid-template-columns:30px minmax(0,1fr);gap:4px 10px}
 .timeline-date{grid-column:2;grid-row:1;flex-direction:row;align-items:baseline;gap:8px;padding-top:0;text-align:left}
 .timeline-event::before{grid-column:1;grid-row:1 / span 2;margin-top:4px}
 .timeline-content{grid-column:2;grid-row:2}
 .flow-toolbar .search{margin-left:0;max-width:none}
}
@media(max-width:540px){
 .hf-attend-item{grid-template-columns:minmax(0,1fr) 16px;gap:4px 10px}
 .hf-reason{grid-column:1;justify-self:start}
 .hf-attend-main{grid-column:1}
 .hf-attend-item>svg{grid-column:2;grid-row:1 / span 2}
 .hf-stages li{min-width:92px;font-size:12px}
 .timeline-value{font-size:14px}
}
@media(prefers-reduced-motion:reduce){
 .hf-project-row,.hf-overview summary svg{transition:none}
}

/* design-v182.css — theme.css, design-v18.css, design-v181.css 뒤에 합쳐 적용.
   범위: 홈 v1.8.2(story_view.jsx: .story-view .sv-*) + 변경 이력 v1.8.2 추가 요소(.flow-categories, .flow-topic-section, .flow-summary, .flow-strip, .flow-context-note, .flow-related-tasks).
   다른 탭·전역 규칙은 건드리지 않는다.
   디자인 기준
   - 간격 8px 배수(8/16/24/32). 인접한 것은 가깝게, 다른 묶음은 24px 이상.
   - 글자: 제목 22/16/14, 본문 14~15, 보조 12~13, 배지 11.5 이상. 본문 대비 #1f3047 / 보조 #4a5d73 / 설명 #6c7e91.
   - 영역을 상자로 감싸지 않고 구분선(1px #e3e8ef)과 여백으로 나눈다. 포인트색은 상태(결정·현재 기준·확인 전·기한 지남)에만. */

:root{
 --s-ink:#1f3047;--s-ink-2:#4a5d73;--s-ink-3:#6c7e91;--s-faint:#8f9db0;
 --s-line:#e3e8ef;--s-line-2:#cfd8e3;--s-bg:#fff;--s-bg-2:#f6f8fb;--s-hover:#f4f7fb;
 --s-navy:#132f52;--s-blue:#174a8b;--s-blue-soft:#e9f0fa;
 --s-green:#3f6f22;--s-green-bar:#7ba84e;--s-green-soft:#eaf3e2;
 --s-teal:#1d6b73;--s-teal-soft:#e2f1f2;
 --s-active-bar:#5b8ed8;--s-todo-bar:#dbe2ea;
 --s-amber:#8a6514;--s-amber-soft:#fbf2da;--s-red:#a8433a;--s-red-soft:#fbeae7;--s-gray-soft:#eef1f5;
 --s-focus:#2d6fc2;
}

/* ═════════ 공용 ═════════ */
.story-view{color:var(--s-ink);font-size:14px;line-height:1.6}
.story-view button{font:inherit;color:inherit}
.story-view button:focus-visible{outline:2px solid var(--s-focus);outline-offset:2px;border-radius:4px}
.story-view .sv-unset{color:var(--s-faint);font-weight:400}
.story-view .sv-count{margin-left:6px;font-size:13px;font-weight:500;color:var(--s-ink-3)}
.story-view .sv-none{margin:0;padding:16px 0;font-size:14px;color:var(--s-ink-3);border-top:1px solid var(--s-line);border-bottom:1px solid var(--s-line)}
.story-view .sv-note{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:var(--s-ink-3)}
.sv-link{display:inline-flex;align-items:center;gap:2px;padding:4px 0;background:transparent;font-size:13px;font-weight:600;color:var(--s-blue);cursor:pointer}
.sv-link:hover{text-decoration:underline}
.sv-back{display:inline-flex;align-items:center;gap:4px;padding:0;margin-bottom:12px;background:transparent;font-size:13px;color:var(--s-ink-3);cursor:pointer}
.sv-back:hover{color:var(--s-blue)}
.sv-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px}
.sv-section-head h2{margin:0;font-size:16px;font-weight:700;color:var(--s-ink);display:inline-flex;align-items:center;gap:6px}

/* 상태 칩: 결정 계열(녹색) / 요청(파랑) / 보류·철회(회색). 라벨은 전달된 state 그대로. */
.sv-state{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;background:var(--s-gray-soft);color:var(--s-ink-2)}
.sv-state.st-decision{background:var(--s-green-soft);color:var(--s-green)}
.sv-state.st-request{background:var(--s-blue-soft);color:var(--s-blue)}
.sv-state.st-hold{background:var(--s-gray-soft);color:var(--s-ink-2)}
.sv-state.st-withdrawn{background:var(--s-gray-soft);color:var(--s-ink-3)}
.sv-flag{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:4px;font-style:normal;font-size:12px;font-weight:600;white-space:nowrap;background:var(--s-gray-soft);color:var(--s-ink-2)}
.sv-flag.current{background:var(--s-green);color:#fff}
.sv-flag.pending{background:var(--s-amber-soft);color:var(--s-amber)}
.sv-flag.late{background:var(--s-red-soft);color:var(--s-red)}
.sv-flag.muted{background:transparent;color:var(--s-faint);padding-left:0;padding-right:0;font-weight:500}
.sv-late{color:var(--s-red)}

/* 완료 막대 */
.sv-bar-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.sv-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--s-todo-bar)}
.sv-bar.is-empty{background:repeating-linear-gradient(135deg,#e6ebf1 0 6px,#f3f6f9 6px 12px)}
.sv-bar .seg{display:block;flex:0 0 auto;min-width:2px;height:100%}
.sv-bar .seg.done{background:var(--s-green-bar)}.sv-bar .seg.active{background:var(--s-active-bar)}.sv-bar .seg.todo{background:var(--s-todo-bar)}
.sv-bar-text{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:13px;color:var(--s-ink-2);font-variant-numeric:tabular-nums}
.sv-bar-text b{font-size:18px;font-weight:700;color:var(--s-ink);line-height:1.2}
.sv-bar-text .sv-of{margin-left:-6px;color:var(--s-ink-2)}
.sv-bar-detail{color:var(--s-ink-3)}
.sv-bar-wrap.compact .sv-bar{height:6px}
.sv-bar-wrap.compact .sv-bar-text{font-size:12.5px;color:var(--s-ink-3);gap:4px}
.sv-bar-wrap.compact .sv-bar-text b{font-size:13px;color:var(--s-ink-2)}

/* ═════════ 프로젝트 머리말 (상자 없이 구분선으로) ═════════ */
.sv-head{padding:0 0 24px;margin-bottom:32px;border-bottom:1px solid var(--s-line)}
.sv-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.sv-title-row h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px;color:var(--s-ink);line-height:1.3}
.sv-title-actions{flex:none}
.sv-props{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0 0 4px}
.sv-props>div{display:flex;align-items:baseline;gap:8px;min-width:0}
.sv-props dt{font-size:13px;color:var(--s-ink-3)}
.sv-props dd{margin:0;font-size:14px;font-weight:600;color:var(--s-ink);overflow-wrap:anywhere}
.sv-props dd small{font-size:13px;font-weight:400;color:var(--s-ink-3)}
.sv-purpose{margin:12px 0 0;font-size:14px;line-height:1.7;color:var(--s-ink-2);max-width:820px}
.sv-head-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:16px 48px;margin-top:24px;padding-top:20px;border-top:1px solid var(--s-line)}
.sv-head-grid h2{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--s-ink-3)}
.sv-head-grid h2 b{font-weight:700;color:var(--s-blue)}
.sv-stages{display:flex;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:thin}
.sv-stages li{position:relative;flex:1 1 0;min-width:88px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-right:12px;font-size:13px;color:var(--s-ink-3)}
.sv-stages li i{display:block;width:10px;height:10px;border-radius:50%;border:2px solid var(--s-line-2);background:#fff;position:relative;z-index:1}
.sv-stages li::before{content:'';position:absolute;top:4px;left:10px;right:0;height:2px;background:var(--s-line)} /* 연결선 — 완료 여부를 뜻하지 않음 */
.sv-stages li:last-child::before{display:none}
.sv-stages li span{line-height:1.4;word-break:keep-all}
.sv-stages li.current{color:var(--s-ink)}
.sv-stages li.current i{border-color:var(--s-blue);background:var(--s-blue);box-shadow:0 0 0 3px var(--s-blue-soft)}
.sv-stages li.current span{font-weight:700;color:var(--s-blue)}
.sv-stages-empty{margin:0;font-size:13px;color:var(--s-ink-3)}
.sv-next-goal{margin:12px 0 0;font-size:13.5px;line-height:1.6;color:var(--s-ink-2)}
.sv-next-goal>span{display:inline-block;margin-right:8px;font-size:12.5px;color:var(--s-ink-3)}
.sv-progress-block .sv-note{margin-top:10px}

/* ═════════ 본문 2열 ═════════ */
.sv-body{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:0 48px;align-items:start}
.sv-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 16px;font-size:12.5px}
.sv-legend small{flex-basis:100%;margin-top:2px;font-size:12.5px;color:var(--s-ink-3)}

/* 활동 흐름: 날짜 | 세로선+노드 | 내용. 과거→최신, 최신 강조 */
.sv-timeline{list-style:none;margin:0;padding:0;position:relative}
.sv-timeline::before{content:'';position:absolute;top:10px;bottom:10px;left:104px;width:2px;background:var(--s-line)}
.sv-meeting,.sv-older{display:grid;grid-template-columns:84px 26px minmax(0,1fr);gap:0 8px;position:relative}
.sv-meeting{padding-bottom:28px}
.sv-meeting:last-child{padding-bottom:8px}
.sv-when{grid-column:1;display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:2px;text-align:right}
.sv-when time{font-size:13px;font-weight:600;color:var(--s-ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sv-when small{font-size:12px;font-weight:600;color:var(--s-blue)}
.sv-meeting::before{content:'';grid-column:2;grid-row:1;justify-self:center;margin-top:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--s-line-2);background:#fff;position:relative;z-index:1}
.sv-meeting.is-latest::before{border-color:var(--s-blue);background:var(--s-blue);box-shadow:0 0 0 3px var(--s-blue-soft)}
.sv-entry{grid-column:3;min-width:0}
.sv-entry-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.sv-meeting-title{display:inline-flex;align-items:center;gap:6px;padding:0;background:transparent;text-align:left;font-size:15px;font-weight:700;color:var(--s-ink);cursor:pointer;min-width:0}
.sv-meeting-title svg{color:var(--s-ink-3);flex:none}
.sv-meeting-title:hover span{text-decoration:underline}
.sv-entry-meta{font-size:13px;color:var(--s-ink-3)}
.sv-analysis{font-style:normal;color:var(--s-amber);font-weight:600}

/* 요구·변경 항목: 상자 없이 가는 구분선 */
.sv-events{list-style:none;margin:0;padding:0;border-top:1px solid var(--s-line)}
.sv-event{border-bottom:1px solid var(--s-line)}
.sv-event>button{display:grid;grid-template-columns:auto minmax(0,1fr) 14px;gap:0 12px;align-items:start;width:100%;padding:10px 4px 10px 0;text-align:left;background:transparent;cursor:pointer}
.sv-event>button:hover{background:var(--s-hover)}
.sv-event>button>.sv-state{margin-top:2px}
.sv-event>button>svg{color:var(--s-faint);margin-top:6px}
.sv-event-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.sv-event-title{font-size:13px;color:var(--s-ink-3)}
.sv-event-title small{font-size:13px;color:var(--s-faint)}
.sv-event-value{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:15px;line-height:1.5;color:var(--s-ink)}
.sv-event-value s{color:var(--s-faint);text-decoration-color:#b8c2cf;font-size:13.5px}
.sv-event-value .sv-arrow{color:var(--s-faint);font-size:13px}
.sv-event-value strong{font-weight:600;overflow-wrap:anywhere}
.sv-event.is-current .sv-event-value strong{font-weight:700;color:var(--s-green)}
.sv-event.is-stale .sv-event-value strong{color:var(--s-ink-2)}
.sv-event-flags{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.sv-event.needs-check>button{box-shadow:inset 3px 0 0 var(--s-amber)}
.sv-event.needs-check>button{padding-left:10px}
.sv-more{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 0;font-size:13px;font-weight:600;color:var(--s-ink-3);background:transparent;cursor:pointer}
.sv-more:hover{color:var(--s-blue)}

/* 같은 회의에서 등록한 업무 — 분리된 작은 상태 목록 */
.sv-tasks{margin-top:12px}
.sv-tasks-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--s-ink-2);margin-bottom:4px}
.sv-tasks-head small{font-size:12.5px;font-weight:400;color:var(--s-faint)}
.sv-tasks ul{list-style:none;margin:0;padding:0}
.sv-tasks li>button{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;padding:6px 4px 6px 0;text-align:left;background:transparent;cursor:pointer}
.sv-tasks li>button:hover{background:var(--s-hover)}
.sv-task-title{font-size:13.5px;color:var(--s-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-task-meta{font-size:12.5px;color:var(--s-ink-3);white-space:nowrap}
.sv-tasks .status{font-size:12px}

/* 이전 회의 펼치기 */
.sv-older{padding-bottom:20px}
.sv-older>button{grid-column:3;justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:4px 0;background:transparent;font-size:13px;font-weight:600;color:var(--s-ink-3);cursor:pointer}
.sv-older>button:hover{color:var(--s-blue)}
.sv-older::before{content:'';grid-column:2;justify-self:center;margin-top:8px;width:8px;height:8px;border-radius:50%;border:2px dashed var(--s-line-2);background:#fff;position:relative;z-index:1}

/* 오른쪽 보조 패널: 간결, 상자 없음 */
.sv-side{display:flex;flex-direction:column;gap:32px;min-width:0;padding-top:4px}
.sv-side .sv-section-head h2{font-size:15px}
.sv-check-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--s-line)}
.sv-check-list li{border-bottom:1px solid var(--s-line)}
.sv-check-list li>button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 0;text-align:left;background:transparent;cursor:pointer}
.sv-check-list li>button:hover{background:var(--s-hover)}
.sv-check-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.sv-check-main b{font-size:14px;font-weight:600;color:var(--s-ink);line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-check-main small{font-size:12.5px;color:var(--s-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-reason{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--s-gray-soft);color:var(--s-ink-2)}
.sv-reason.r-기한지남{background:var(--s-red-soft);color:var(--s-red)}
.sv-reason.r-담당미정,.sv-reason.r-기한미정{background:var(--s-amber-soft);color:var(--s-amber)}
.sv-reason.r-검토대기{background:var(--s-blue-soft);color:var(--s-blue)}
.sv-reason.r-보완요청{background:#faece6;color:#b15545}
.sv-reason.r-추가확인{background:#f1eaf6;color:#7a5790}
.sv-check-more{margin-top:8px}
.sv-calendar .sv-section-head h2{font-size:14px;color:var(--s-ink-3);font-weight:600}
.sv-calendar .period-calendar{margin:0;padding:0;border:0;background:transparent}
.sv-calendar .period-calendar .section-title{display:flex;margin-bottom:8px}
.sv-calendar .period-calendar .section-title h2{font-size:14px;color:var(--s-ink-2)}
.sv-calendar .period-weekdays span{font-size:12px}
.sv-calendar .period-date{font-size:12px}
.sv-calendar .period-bar{font-size:11px}
.sv-calendar .agenda-heading{margin-top:10px;font-size:13px}
.sv-calendar .agenda b{font-size:13px}

/* ═════════ 전체 프로젝트: 표가 아니라 스캔용 목록 ═════════ */
.sv-portfolio-head,.sv-project{display:grid;grid-template-columns:minmax(200px,1.4fr) 140px minmax(220px,1.3fr) minmax(200px,1.2fr) 16px;gap:0 24px;align-items:center}
.sv-portfolio-head{padding:0 8px 8px;font-size:12.5px;font-weight:600;color:var(--s-ink-3);border-bottom:1px solid var(--s-line)}
.sv-portfolio{list-style:none;margin:0;padding:0}
.sv-portfolio li{border-bottom:1px solid var(--s-line)}
.sv-project{width:100%;padding:14px 8px;text-align:left;background:transparent;cursor:pointer}
.sv-project:hover{background:var(--s-hover)}
.sv-project>svg{color:var(--s-faint)}
.sv-p-name,.sv-p-stage,.sv-p-meeting,.sv-p-bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.sv-p-name b{font-size:15px;font-weight:700;color:var(--s-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-p-name small,.sv-p-meeting small{font-size:12.5px;color:var(--s-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-p-stage b{font-size:13.5px;font-weight:600;color:var(--s-blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-p-meeting b{font-size:13.5px;font-weight:500;color:var(--s-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-p-flags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:2px}

/* ═════════ 변경 이력 v1.8.2 추가 요소 ═════════ */
.flow-categories{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.flow-categories button{padding:5px 12px;border:1px solid var(--s-line-2);border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--s-ink-2);cursor:pointer}
.flow-categories button:hover{background:var(--s-hover)}
.flow-categories button.active,.flow-categories button[aria-pressed=true]{border-color:var(--s-blue);background:var(--s-blue);color:#fff}
.flow-categories button em{font-style:normal;margin-left:5px;font-size:12px;font-weight:500;opacity:.85}

.flow-topic-section{border-top:1px solid var(--s-line)}
.flow-topic-section:first-of-type{border-top:0}
.flow-topic-section>h3{margin:0;padding:10px 14px 6px;font-size:12.5px;font-weight:600;color:var(--s-ink-3);background:var(--s-bg-2);position:sticky;top:34px;z-index:1}
.flow-topic-section .flow-topic-item{border-top:1px solid #f0f3f7}

.flow-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;padding:16px 0;border-top:1px solid var(--s-line);border-bottom:1px solid var(--s-line)}
.flow-summary>*{min-width:0;margin:0;padding:0;border:0;background:transparent}
.flow-summary>*+*{padding-left:32px;border-left:1px solid var(--s-line)}
.flow-summary .flow-baseline{padding:0;border:0;background:transparent}
.flow-summary>*>small:first-child,.flow-summary>*>h3,.flow-summary .flow-baseline>small{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--s-ink-3);letter-spacing:0}
.flow-summary>*>strong,.flow-summary>*>b,.flow-summary .flow-baseline>strong{display:block;font-size:17px;font-weight:700;line-height:1.5;color:var(--s-ink);overflow-wrap:anywhere}
.flow-summary .flow-baseline>strong{color:var(--s-green)}
.flow-summary>*>span,.flow-summary>*>p,.flow-summary .flow-baseline>span{display:block;margin:4px 0 0;font-size:13px;color:var(--s-ink-3)}
.flow-summary .is-latest-discussion>strong{font-weight:600}

.flow-strip{display:flex;list-style:none;margin:0;padding:8px 0 4px;overflow-x:auto;scrollbar-width:thin}
.flow-strip li{flex:0 0 auto;position:relative;min-width:132px;max-width:220px;padding-right:20px}
.flow-strip li::after{content:'';position:absolute;top:7px;left:12px;right:0;height:2px;background:var(--s-line)}
.flow-strip li:last-child::after{display:none}
.flow-strip li>button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:0;text-align:left;background:transparent;cursor:pointer}
.flow-strip li>button time{font-size:12.5px;font-weight:600;color:var(--s-ink-3);font-variant-numeric:tabular-nums}
.flow-strip li>button::before{content:'';display:block;width:10px;height:10px;border-radius:50%;border:2px solid var(--s-line-2);background:#fff;margin:2px 0 2px 1px;position:relative;z-index:1}
.flow-strip li>button b{font-size:13.5px;font-weight:600;color:var(--s-ink);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.flow-strip li>button span{font-size:12.5px;color:var(--s-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.flow-strip li.current>button::before{border-color:var(--s-green);background:var(--s-green);box-shadow:0 0 0 3px var(--s-green-soft)}
.flow-strip li.current>button b{color:var(--s-green);font-weight:700}
.flow-strip li.pending>button::before{border-color:var(--s-amber);border-style:dashed}
.flow-strip li.pending>button span{color:var(--s-amber)}
.flow-strip li.excluded>button{opacity:.55}
.flow-strip li.selected>button::before{box-shadow:0 0 0 3px var(--s-blue-soft);border-color:var(--s-blue)}
.flow-strip li>button:hover b{text-decoration:underline}

.flow-context-note{margin:0;padding:0 0 0 12px;border-left:3px solid var(--s-line-2);font-size:13px;line-height:1.65;color:var(--s-ink-2)}
.flow-related-tasks{padding:12px 0 0;border-top:1px solid var(--s-line)}
.flow-related-tasks>h3,.flow-related-tasks>b{display:block;margin:0 0 4px;font-size:13px;font-weight:600;color:var(--s-ink-2)}
.flow-related-tasks>small,.flow-related-tasks>p{display:block;margin:0 0 6px;font-size:12.5px;color:var(--s-faint)}
.flow-related-tasks ul{list-style:none;margin:0;padding:0}
.flow-related-tasks>button,.flow-related-tasks li>button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:6px 0;text-align:left;background:transparent;cursor:pointer;font-size:13.5px;color:var(--s-ink-2)}
.flow-related-tasks>button:hover,.flow-related-tasks li>button:hover{background:var(--s-hover)}
.flow-related-tasks .status{font-size:12px}

/* 최근 논의(.flow-latest) — .flow-summary 두 번째 칸. small/strong/span */
.flow-latest>small{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--s-ink-3)}
.flow-latest>strong{display:block;font-size:17px;font-weight:600;line-height:1.5;color:var(--s-ink);overflow-wrap:anywhere}
.flow-latest>span{display:block;margin:4px 0 0;font-size:13px;color:var(--s-ink-3)}

/* 회의별 기록·근거 보기 — 접힌 details 안에 기존 세로 타임라인 */
.flow-record-details{margin-top:8px;border-top:1px solid var(--s-line)}
.flow-record-details>summary{display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--s-ink-2)}
.flow-record-details>summary::-webkit-details-marker{display:none}
.flow-record-details>summary::before{content:'\25B8';font-size:12px;color:var(--s-ink-3)}
.flow-record-details[open]>summary::before{content:'\25BE'}
.flow-record-details>summary>span{font-size:13px;font-weight:500;color:var(--s-ink-3)}
.flow-record-details>.change-timeline{margin-top:4px;padding-bottom:8px}

/* 홈 머리말에 주입되는 정보 수정 버튼(.project-context.trigger-only): 제목 옆 버튼만 */
.sv-title-actions .project-context.trigger-only{border:0;margin:0;padding:0;background:transparent}
.sv-title-actions .project-context.trigger-only .section-title{margin:0}

/* 기존 상세 세로 타임라인 컴팩트·본문 글자 키움 */
.flow-detail .change-timeline .timeline-event{padding-bottom:14px}
.flow-detail .change-timeline .timeline-content{padding:8px 12px 10px}
.flow-detail .change-timeline .timeline-value{font-size:14.5px}
.flow-detail .change-timeline .timeline-meta{margin-bottom:4px;font-size:12.5px}
.flow-detail .change-timeline .timeline-before,.flow-detail .change-timeline .timeline-source{font-size:12.5px}

/* ═════════ 반응형 ═════════ */
@media(max-width:1200px){
 .sv-portfolio-head,.sv-project{grid-template-columns:minmax(180px,1.3fr) 120px minmax(200px,1.2fr) minmax(170px,1fr) 16px;gap:0 16px}
 .sv-body{gap:0 32px}
}
@media(max-width:1100px){
 .sv-head-grid{grid-template-columns:1fr;gap:20px}
 .sv-body{grid-template-columns:minmax(0,1fr) 272px}
}
@media(max-width:960px){
 .sv-body{grid-template-columns:1fr;gap:32px 0}
 .sv-side{flex-direction:row;flex-wrap:wrap;gap:24px 32px;padding-top:24px;border-top:1px solid var(--s-line)}
 .sv-side>*{flex:1 1 280px}
 .flow-summary{grid-template-columns:1fr;gap:12px}
 .flow-summary>*+*{padding-left:0;padding-top:12px;border-left:0;border-top:1px solid var(--s-line)}
}
@media(max-width:760px){
 .sv-timeline::before{left:12px}
 .sv-meeting,.sv-older{grid-template-columns:26px minmax(0,1fr);gap:2px 10px}
 .sv-when{grid-column:2;grid-row:1;flex-direction:row;align-items:baseline;gap:8px;padding-top:0;text-align:left}
 .sv-meeting::before{grid-column:1;grid-row:1 / span 2;margin-top:4px}
 .sv-entry{grid-column:2;grid-row:2}
 .sv-older>button{grid-column:2}
 .sv-older::before{grid-column:1}
 .sv-portfolio-head{display:none} /* 좁은 폭: 각 줄이 라벨 없이도 읽히도록 이름·단계·막대 세로 배치 */
 .sv-project{grid-template-columns:minmax(0,1fr) 16px;gap:6px 12px;padding:12px 0}
 .sv-p-name,.sv-p-stage,.sv-p-bar,.sv-p-meeting{grid-column:1}
 .sv-project>svg{grid-column:2;grid-row:1}
 .sv-p-stage{flex-direction:row;align-items:baseline;gap:8px}
 .sv-p-stage::before{content:'단계';font-size:12.5px;color:var(--s-ink-3)}
 .sv-tasks li>button{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"title status" "meta status"}
 .sv-task-title{grid-area:title}.sv-task-meta{grid-area:meta;white-space:normal}.sv-tasks .status{grid-area:status}
}
@media(max-width:540px){
 .sv-title-row{flex-direction:column;align-items:flex-start;gap:8px}
 .sv-props{gap:4px 16px}
 .sv-stages li{min-width:76px;font-size:12.5px}
 .sv-event>button{grid-template-columns:minmax(0,1fr) 14px}
 .sv-event>button>.sv-state{grid-column:1;justify-self:start;margin-bottom:2px}
 .sv-event-body{grid-column:1}
}
@media(prefers-reduced-motion:reduce){.story-view *{transition:none}}

.flow-related-tasks>button+button{border-top:1px solid var(--s-line)}
.flow-related-tasks>button>small{font-size:12.5px;color:var(--s-ink-2)}
.flow-related-tasks>button>span{min-width:0;overflow-wrap:anywhere}
.timeline-event.focused .timeline-content{outline:2px solid var(--s-blue-soft);outline-offset:2px}

/* design-v19.css — 공통 UI 스킨 v1.9.1. theme.css, design-v18*.css 뒤에 합쳐 적용.
   적용 범위: root가 붙이는 .workspace.design-v19 아래 전체(사이드바·헤더·본문 공통 요소)와, 그 밖에 렌더되는 모달·토스트(body:has(.workspace.design-v19)).
   참고 방향(다우오피스형 업무 서비스): 네이비 아이콘 레일 + 흰 콘텐츠, 선명한 메뉴 선택, 가는 테두리, 제목·도구막대·목록의 분명한 위계.
   원칙: 기능·DOM·데이터 무변경. 색만이 아니라 간격·크기·위계를 정돈. 새 카드·배지·영어 장식 없음. PNT 로고 유지(네이비 배경용 흰색 반전). 8px 간격 체계. */

.workspace.design-v19{
 --w-bg:#f3f5f8;--w-side:#f3f5f8;--w-side-line:#e2e7ee;--w-line:#e3e8ef;--w-line-2:#cfd8e3;--w-hover:#f4f7fb;--w-head-bg:#f8fafc;
 --w-ink:#1f3047;--w-ink-2:#4a5d73;--w-ink-3:#6c7e91;--w-faint:#8f9db0;
 --w-navy:#132f52;--w-blue:#174a8b;--w-blue-soft:#e9f0fa;--w-green:#4f7a2a;
 --w-radius:6px;--w-side-w:88px;--w-side-w-compact:64px;--w-top-h:60px;
 background:var(--w-bg);color:var(--w-ink);font-size:14px;line-height:1.6;
}

/* Sidebar restored to the agreed compact navy rail. */
.workspace.design-v19 .rail{width:var(--w-side-w);background:var(--navy);border-right:0;color:#bbcadb;align-items:center}
.workspace.design-v19 .main-shell{margin-left:var(--w-side-w);width:calc(100% - var(--w-side-w));background:var(--w-bg)}
.workspace.design-v19 .rail-brand{height:var(--w-top-h);justify-content:center;padding:0;border-bottom:1px solid #ffffff18;width:100%}
.workspace.design-v19 .rail-brand img{width:54px;filter:brightness(0) invert(1);opacity:1}
.workspace.design-v19 .rail nav{gap:9px;padding:27px 0 0;align-items:center}
.workspace.design-v19 .rail nav button{flex-direction:column;justify-content:center;gap:5px;width:66px;height:68px;padding:0;border-radius:8px;color:#b3c3d5;font-size:11px;font-weight:500;line-height:1.4}
.workspace.design-v19 .rail nav button svg{width:22px;height:22px;flex:none;color:inherit}
.workspace.design-v19 .rail nav button span{display:inline;white-space:nowrap}
.workspace.design-v19 .rail nav button:hover{background:#ffffff12;color:#fff}
.workspace.design-v19 .rail nav button.active{background:#ffffff14;color:#fff;font-weight:700;box-shadow:none}
.workspace.design-v19 .rail nav button.active:before{left:-11px;top:17px;bottom:17px;width:3px;border-radius:0 2px 2px 0;background:#b2cb46}
.workspace.design-v19 .rail nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.workspace.design-v19 .nav-dot{right:12px;top:8px;background:#b2cb46}
.workspace.design-v19 .rail-bottom{padding:12px 0 16px;flex-direction:column;gap:8px;border-top:0}
.workspace.design-v19 .rail-bottom .icon-btn{color:#bbcadb}
.workspace.design-v19 .rail-bottom .icon-btn:hover{background:#ffffff12;color:#fff}
.workspace.design-v19 .version{font-size:10px;letter-spacing:0;color:#a6b9cf}

/* 접힘(아이콘만) */
.workspace.design-v19.compact-nav .rail{width:var(--w-side-w-compact)}
.workspace.design-v19.compact-nav .main-shell{margin-left:var(--w-side-w-compact);width:calc(100% - var(--w-side-w-compact))}
.workspace.design-v19.compact-nav .rail-brand{justify-content:center;padding:0}
.workspace.design-v19.compact-nav .rail-brand img{width:36px}
.workspace.design-v19.compact-nav .rail nav{padding:12px 8px 0}
.workspace.design-v19.compact-nav .rail nav button{width:100%;justify-content:center;padding:0}
.workspace.design-v19.compact-nav .rail nav button span{display:none}
.workspace.design-v19.compact-nav .rail nav button.active:before{left:-8px}
.workspace.design-v19.compact-nav .rail-bottom{flex-direction:column;gap:8px}

/* ═════════ 상단 헤더: 낮고 가늘게 ═════════ */
.workspace.design-v19 .topbar{height:var(--w-top-h);padding:0 28px;gap:16px;border-bottom:1px solid var(--w-line);background:#fff}
.workspace.design-v19 .context,.workspace.design-v19 .top-tools{gap:12px}
.workspace.design-v19 .project-switch{height:36px;padding:0 12px 0 10px;border:1px solid var(--w-line-2);border-radius:var(--w-radius);background:#fff;font-size:14px;font-weight:600;color:var(--w-ink)}
.workspace.design-v19 .project-switch:hover{background:var(--w-hover)}
.workspace.design-v19 .project-switch svg{color:var(--w-ink-3)}
.workspace.design-v19 .global-search{height:36px;padding:0 14px;min-width:260px;border:1px solid var(--w-line-2);border-radius:var(--w-radius);background:#fff;font-size:13.5px;color:var(--w-ink-3)}
.workspace.design-v19 .global-search:hover{border-color:#b7c5d6}
.workspace.design-v19 .notification-btn{width:36px;height:36px;border:1px solid transparent;border-radius:var(--w-radius)}
.workspace.design-v19 .notification-btn:hover{background:var(--w-hover)}
.workspace.design-v19 .notification-btn i{background:var(--w-green)}
.workspace.design-v19 .profile-btn{height:36px;padding-left:14px;border-left:1px solid var(--w-line);font-size:13.5px;color:var(--w-ink)}
.workspace.design-v19 .profile-btn small{color:var(--w-ink-3);font-weight:400}
.workspace.design-v19 .avatar{background:var(--w-blue-soft);color:var(--w-blue);font-size:11px}

/* ═════════ 본문 공통 ═════════ */
.workspace.design-v19 .content{max-width:1440px;padding:28px 36px 64px}
.workspace.design-v19 .page-head{align-items:flex-start;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--w-line)}
.workspace.design-v19 .page-head h1{font-size:22px;font-weight:700;letter-spacing:-.2px;color:var(--w-ink);line-height:1.3}
.workspace.design-v19 .page-head p{margin-top:6px;font-size:13.5px;color:var(--w-ink-3)}
.workspace.design-v19 .eyebrow{font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--w-ink-3);margin-bottom:6px}
.workspace.design-v19 .head-actions{gap:8px;padding-top:2px}
.workspace.design-v19 .section-title{margin-bottom:12px}
.workspace.design-v19 .section-title h2{font-size:16px;font-weight:700;color:var(--w-ink)}
.workspace.design-v19 .section-title h3{font-size:14px;font-weight:700;color:var(--w-ink)}
.workspace.design-v19 .section-title p{font-size:13px;color:var(--w-ink-3)}
.workspace.design-v19 .muted{font-size:13px;color:var(--w-ink-3)}
.workspace.design-v19 .field-note{font-size:12.5px;color:var(--w-ink-3);line-height:1.6;margin-top:6px}
.workspace.design-v19 .notice,.workspace.design-v19 .warning{padding:10px 14px;border-radius:var(--w-radius);font-size:13px;line-height:1.65;margin:12px 0}
.workspace.design-v19 .warning{background:#fbf3e3;color:#6a5218;border:1px solid #efdfb6}
.workspace.design-v19 .notice{background:var(--w-head-bg);color:var(--w-ink-2);border:1px solid var(--w-line)}
.workspace.design-v19 .text-link{font-size:13px;font-weight:600;color:var(--w-blue)}
.workspace.design-v19 .back-link{font-size:13px;color:var(--w-ink-3);margin-bottom:16px}
.workspace.design-v19 .back-link:hover{color:var(--w-blue)}

/* 도구막대: 탭 + 검색 + 액션을 한 줄, 아래 가는 선 */
.workspace.design-v19 .tabs{gap:20px;border-bottom:1px solid var(--w-line)}
.workspace.design-v19 .tabs button{padding:10px 2px 11px;font-size:13.5px;font-weight:500;color:var(--w-ink-3)}
.workspace.design-v19 .tabs button:hover{color:var(--w-ink)}
.workspace.design-v19 .tabs button.active{color:var(--w-navy);border-bottom:2px solid var(--w-navy);font-weight:700}
.workspace.design-v19 .tabs button em{font-style:normal;font-size:12px;font-weight:600;color:var(--w-faint);margin-left:2px}
.workspace.design-v19 .tabs button.active em{color:var(--w-navy)}
.workspace.design-v19 .home-list-tools,.workspace.design-v19 .work-tools{gap:12px}
.workspace.design-v19 .home-list-tools{margin:14px 0 12px}
.workspace.design-v19 .segmented{padding:2px;border-radius:var(--w-radius);background:var(--w-head-bg);border-color:var(--w-line)}
.workspace.design-v19 .segmented button{font-size:13px;padding:6px 12px;border-radius:4px}
.workspace.design-v19 .segmented button.active{color:var(--w-navy);box-shadow:0 1px 2px #13305214}

/* 버튼·입력: 36px 높이, 6px 모서리, 가는 테두리 */
.workspace.design-v19 .btn{min-height:36px;padding:0 14px;border-radius:var(--w-radius);border-color:var(--w-line-2);font-size:13.5px;font-weight:600;color:var(--w-ink)}
.workspace.design-v19 .btn:hover:not(:disabled){background:var(--w-hover);border-color:#b7c5d6}
.workspace.design-v19 .btn.primary{background:var(--w-navy);border-color:var(--w-navy);color:#fff;box-shadow:none}
.workspace.design-v19 .btn.primary:hover:not(:disabled){background:#1b3f6f;border-color:#1b3f6f}
.workspace.design-v19 .btn.small{min-height:30px;padding:0 10px;font-size:12.5px}
.workspace.design-v19 .btn.danger{color:#a8433a;border-color:#e6c4bf}
.workspace.design-v19 .btn:disabled{opacity:.5}
.workspace.design-v19 .icon-btn{width:36px;height:36px;border-radius:var(--w-radius)}
.workspace.design-v19 .icon-btn:hover{background:var(--w-hover)}
.workspace.design-v19 input,.workspace.design-v19 textarea,.workspace.design-v19 select{border:1px solid var(--w-line-2);border-radius:var(--w-radius);padding:8px 12px;font-size:14px;line-height:1.5;color:var(--w-ink);background:#fff}

.design-v20 .reports-page .btn.primary{background:#1d5fd1;border-color:#1d5fd1;color:white}
.design-v20 .reports-page .btn.primary:hover:not(:disabled){background:#174fb0;border-color:#174fb0}
.design-v20 .reports-page .btn.small{min-height:30px;padding:5px 10px}
.design-v20 .reports-page input,.design-v20 .reports-page textarea,.design-v20 .reports-page select{border-radius:4px;border-color:#c7d2da;color:#1b2a36;padding:8px 10px}

.reports-page .ref-panel>header h2{font-size:15px;line-height:1.4;margin:0;font-weight:700}
.reports-page .ref-panel>header>span{font-size:12px;color:#5d7180}
