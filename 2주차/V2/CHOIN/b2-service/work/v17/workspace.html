.sched-status{display:inline-flex;align-items:center;border-radius:4px;font-size:11px;font-weight:600;padding:3px 8px;background:#edf0f4;color:#647386;white-space:nowrap;justify-self:start}
.sched-status.st-1{background:#e6effb;color:#2d5c97}.sched-status.st-2{background:#fbe9e7;color:#b03a2e}.sched-status.st-3{background:#e8f3e3;color:#3d7a2a}
.phase-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#3b4a5c;white-space:nowrap}.phase-chip i{width:9px;height:9px;border-radius:2px;background:var(--phase)}.phase-chip.none{color:#9aa8b8}.phase-chip.none i{background:#d7dee7}
.schedule-table .table-head,.schedule-row{display:grid;grid-template-columns:110px minmax(220px,2fr) 90px 72px 110px 110px 84px 60px 70px;gap:12px;align-items:center;padding:0 16px}
.schedule-table.with-project .table-head,.schedule-table.with-project .schedule-row{grid-template-columns:140px 110px minmax(200px,2fr) 90px 72px 110px 110px 84px 60px 70px}
.schedule-row{min-height:50px;border-top:1px solid #edf1f5;font-size:12px;color:#25364a}
.schedule-row.late{background:#fff8f7}.schedule-row.done .schedule-title b{color:#8a99ad}
.schedule-title{display:flex;align-items:center;gap:8px;min-width:0;text-align:left;padding:8px 0;background:none;border:0}
.schedule-title>span:last-child{min-width:0}.schedule-title b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.schedule-title small{display:block;color:#7c8b9e;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schedule-row small.dday-note,.schedule-row small.overdue-note{display:block;font-size:10px;color:#7c8b9e}.schedule-row small.overdue-note{color:#b03a2e;font-weight:600}
.progress-cell{position:relative;height:8px;background:#e9eef4;border-radius:4px;overflow:visible}.progress-cell i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px;display:block}.progress-cell small{position:absolute;left:0;top:10px;font-size:10px;color:#7c8b9e}
.row-actions{display:flex;justify-content:flex-end;gap:2px}
.schedule-history section{margin-bottom:22px}.schedule-history h3{font-size:12px;color:#5a6c82;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}.schedule-history h3 small{color:#9aa8b8;font-weight:500}
.schedule-change{display:grid;grid-template-columns:230px minmax(0,1fr) 110px;gap:16px;background:white;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:6px;align-items:start}
.change-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:11px;color:#5a6c82}.change-meta time{font-weight:700;color:#25364a}
.source-chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:#edf0f4;color:#5a6c82}.source-chip.src-엑셀{background:#e8f3e3;color:#3d7a2a}.source-chip.src-업무{background:#e6effb;color:#2d5c97}.source-chip.src-직접{background:#fdf1e4;color:#a2611c}
.change-body{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px}.change-body>b{font-size:12.5px}
.change-action{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:4px;background:#edf0f4;color:#4a5d73}.change-action.act-삭제{background:#fbe9e7;color:#b03a2e}.change-action.act-추가,.change-action.act-업무\ 등록{background:#e8f3e3;color:#3d7a2a}.change-action.act-납기\ 변경,.change-action.act-기간\ 변경{background:#fdf1e4;color:#a2611c}
.change-diff{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#3b4a5c;background:#f6f8fb;border-radius:5px;padding:3px 8px}.change-diff small{color:#8a99ad;font-size:10px}.change-diff s{color:#a0adbd}.change-diff em{font-style:normal;font-weight:700;color:#25364a}
.change-note{width:100%;margin:2px 0 0;font-size:11.5px;color:#5a6c82}
.change-actor{justify-self:end;font-size:12px}
.edit-grid.compact{margin:10px 0 6px}.edit-grid label.inline-check{align-self:end;padding-bottom:10px}
.modal .xl-drop{border:1.5px dashed #c5d1de;border-radius:10px;padding:20px 16px;min-height:0;height:auto;text-align:center;color:#7c8b9e;display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px 0;background:#fafbfd}.modal .xl-drop.drag{border-color:var(--blue);background:#f1f6fd}.modal .xl-drop p{margin:0;font-size:12px;color:#25364a}.modal .xl-drop .btn{margin:0}
.modal .xl-modes{display:grid;gap:8px;margin-top:4px}.modal .xl-modes label{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12px;width:auto;margin:0;text-align:left}.modal .xl-modes label.on{border-color:#9bb8de;background:#f4f8fd}.modal .xl-modes label input[type=radio]{display:inline-block;margin:3px 0 0;flex:none;width:14px;height:14px}.modal .xl-modes span{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.modal .xl-modes b{color:#25364a;font-size:12.5px}.modal .xl-modes small{color:#7c8b9e;font-size:11px;line-height:1.5}
.import-result h3{margin:0 0 12px;font-size:14px}.import-stats{display:flex;gap:14px;margin-bottom:14px}.import-stats span{flex:1;background:#f6f8fb;border-radius:8px;padding:10px;text-align:center;font-size:11px;color:#5a6c82;display:flex;flex-direction:column}.import-stats b{font-size:20px;color:#25364a}
.import-result .warning ul{margin:6px 0 0;padding-left:18px;max-height:220px;overflow:auto}.import-result .warning li{margin:2px 0}
@media(max-width:1150px){.schedule-card{grid-template-columns:1fr}.schedule-table .table-head,.schedule-row{grid-template-columns:100px minmax(180px,2fr) 80px 70px 100px 90px 60px 60px}.schedule-table .table-head>span:nth-last-child(2),.schedule-row>span.muted:nth-last-child(2){display:none}.schedule-change{grid-template-columns:1fr;gap:8px}.change-actor{justify-self:start}}
@media(max-width:760px){.phase-step b{font-size:9px}.schedule-table .table-head{display:none}.schedule-row{grid-template-columns:1fr 1fr;padding:10px 14px}.schedule-row .schedule-title{grid-column:1/-1}}
