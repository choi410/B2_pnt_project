.button.primary{background:var(--blue);border-color:var(--blue);color:var(--blueink);font-weight:600}.button:hover:not(:disabled){filter:brightness(1.12)}
.error-box{padding:12px 16px;background:var(--ambersoft);color:var(--amber);font-size:.8667rem;border-radius:5px;margin:14px 0 0}
.muted{color:var(--muted)}
.login{max-width:1000px;margin:13vh auto;display:grid;grid-template-columns:1.2fr 1fr;gap:100px;padding:30px}
.login .brand img{display:block;width:85px;height:auto}.login h1{font-size:2.2rem;line-height:1.4;margin-top:34px}.login p{color:var(--muted);font-size:.9333rem}
.login h2{font-size:1.2rem}.login form{display:grid;gap:14px;margin-top:22px}.login label{display:grid;gap:6px;font-size:.8667rem;color:var(--muted)}.login input{width:100%;color:var(--ink)}
.login .button{padding:11px 13px;margin-top:6px}

 <section aria-labelledby="login-title">
  <h2 id="login-title">업무 공간에 들어가기</h2>
  <p>회사 이메일과 비밀번호로 로그인하세요.</p>
  <form id="form" novalidate>
   <label>이메일<input id="email" type="email" name="email" autocomplete="username" maxlength="254" required autofocus></label>
   <label>비밀번호<input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
   <button class="button primary" id="submit" type="submit">로그인</button>
   <p class="error-box" id="error" role="alert" hidden></p>
  </form>
  <p style="margin-top:22px">계정이 없거나 비밀번호를 잊었다면 관리자에게 요청하세요.</p>
 </section>
</main>
<script>
(function(){
 var form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),button=document.getElementById('submit'),error=document.getElementById('error');
 function show(text){error.textContent=text;error.hidden=!text}
 form.addEventListener('submit',function(event){
  event.preventDefault();show('');
  var address=email.value.trim();
  if(!address||!password.value){show('이메일과 비밀번호를 입력해 주세요.');return}
  button.disabled=true;button.textContent='확인 중…';
  fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-B2-Request':'workspace'},body:JSON.stringify({email:address,password:password.value})})
   .then(function(res){return res.json().catch(function(){return {}}).then(function(data){return {ok:res.ok,data:data}})})
   .then(function(result){
    if(result.ok){location.replace('/');return}
    var detail=result.data&&result.data.detail;
    show(typeof detail==='string'?detail:'로그인하지 못했습니다. 입력값을 확인해 주세요.');
    button.disabled=false;button.textContent='로그인';password.value='';password.focus();
   })
   .catch(function(){show('서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.');button.disabled=false;button.textContent='로그인'});
 });
})();
</script></body></html>
