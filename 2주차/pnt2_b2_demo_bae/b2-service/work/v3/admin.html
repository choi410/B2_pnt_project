 <div id="view" role="tabpanel"></div>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(function(){
'use strict';
var view=document.getElementById('view'),tabs=document.getElementById('tabs'),toastBox=document.getElementById('toast'),toastTimer=0,me=null;
function el(tag,attrs){
 var node=document.createElement(tag),i;
 for(var key in (attrs||{})){var value=attrs[key];
  if(key==='text')node.textContent=value;
  else if(key.slice(0,2)==='on')node.addEventListener(key.slice(2),value);
  else if(value===true)node.setAttribute(key,'');
  else if(value!==false&&value!=null)node.setAttribute(key,value);}
 for(i=2;i<arguments.length;i++){var child=arguments[i];if(child==null)continue;node.appendChild(typeof child==='string'?document.createTextNode(child):child)}
 return node;
}
function toast(text,isError){toastBox.textContent=text;toastBox.className='toast'+(isError?' error':'');toastBox.setAttribute('role',isError?'alert':'status');toastBox.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastBox.hidden=true},isError?8000:3500)}
function api(path,method,body){
 return fetch('/api'+path,{method:method||'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-B2-Request':'workspace'}:{'X-B2-Request':'workspace'},body:body?JSON.stringify(body):undefined})
  .then(function(res){return res.json().catch(function(){return {}}).then(function(data){
   if(res.status===401){location.replace('/login');throw new Error('로그인이 필요합니다.')}
   if(!res.ok){var d=data&&data.detail;throw new Error(typeof d==='string'?d:'입력값을 확인해 주세요.')}
   return data})});
}
function run(promise,done){promise.then(function(result){if(done)done(result)}).catch(function(error){toast(error.message,true)})}
function options(select,map,current){Object.keys(map).forEach(function(key){select.appendChild(el('option',{value:key,selected:key===current,text:map[key]}))});return select}

function usersView(){
 view.textContent='';view.appendChild(el('p',{class:'note',text:'불러오는 중…'}));
 run(api('/admin/users'),function(data){
  view.textContent='';
  view.appendChild(el('h2',{text:'사용자 '+data.items.length+'명'}));
  view.appendChild(el('p',{class:'note',text:'역할은 저장하는 즉시 적용됩니다. 사용 중지한 계정은 바로 로그아웃되고 다시 로그인할 수 없습니다.'}));
  var body=el('tbody');
  data.items.forEach(function(u){
   var name=el('input',{value:u.name,maxlength:80,'aria-label':u.email+' 이름'}),dept=el('input',{value:u.department,maxlength:80,'aria-label':u.email+' 부서'}),pos=el('input',{value:u.position,maxlength:80,'aria-label':u.email+' 직책'});
   var level=options(el('select',{'aria-label':u.email+' 역할'}),data.levels,u.level);
   var active=options(el('select',{'aria-label':u.email+' 상태'}),{'1':'사용 중','0':'사용 중지'},u.active?'1':'0');
   var passwordRow=el('tr',{hidden:true});
   var newPassword=el('input',{type:'password',placeholder:'새 비밀번호 (8자 이상)',maxlength:72,autocomplete:'new-password','aria-label':u.email+' 새 비밀번호'});
   passwordRow.appendChild(el('td',{colspan:4},newPassword));
   passwordRow.appendChild(el('td',{colspan:3,class:'actions'},
    el('button',{class:'button',type:'button',text:'취소',onclick:function(){passwordRow.hidden=true;newPassword.value=''}}),
    el('button',{class:'button primary',type:'button',text:'비밀번호 변경',onclick:function(){
     if(newPassword.value.length<8){toast('비밀번호는 8자 이상으로 입력해 주세요.',true);return}
     run(api('/admin/users/'+encodeURIComponent(u.id)+'/password','POST',{password:newPassword.value}),function(){passwordRow.hidden=true;newPassword.value='';toast(u.name+' 님의 비밀번호를 변경했습니다.')})}})));
   var row=el('tr',{class:u.active?'':'inactive'},
    el('td',null,name),el('td',null,el('span',{text:u.email}),u.id===data.me?el('span',{class:'tag',text:'나'}):null),el('td',null,dept),el('td',null,pos),el('td',null,level),el('td',null,active),
    el('td',{class:'actions'},
     el('button',{class:'button',type:'button',text:'비밀번호',disabled:!data.can_create,title:data.can_create?'':'서비스 키 설정 후 사용할 수 있습니다.',onclick:function(){passwordRow.hidden=false;newPassword.focus()}}),
     el('button',{class:'button primary',type:'button',text:'저장',onclick:function(){
      run(api('/admin/users/'+encodeURIComponent(u.id),'PATCH',{name:name.value,department:dept.value,position:pos.value,level:level.value,active:active.value==='1'}),function(){toast(name.value+' 님의 정보를 저장했습니다.');usersView()})}})));
   body.appendChild(row);body.appendChild(passwordRow);
  });
  view.appendChild(el('div',{class:'scroll'},el('table',null,el('thead',null,el('tr',null,el('th',{text:'이름'}),el('th',{text:'이메일'}),el('th',{text:'부서'}),el('th',{text:'직책'}),el('th',{text:'역할'}),el('th',{text:'상태'}),el('th',null))),body)));
  var panel=el('section',{class:'panel'},el('h3',{text:'사용자 추가'}));
  if(!data.can_create){
   panel.appendChild(el('p',{class:'note',text:'SUPABASE_SERVICE_ROLE_KEY 가 설정되지 않아 이 화면에서 계정을 만들 수 없습니다. Supabase 대시보드의 Authentication > Users 에서 계정을 만들면 여기에 담당자로 나타나며, 역할은 위 표에서 바꿀 수 있습니다.'}));
  }else{
   var f={email:el('input',{type:'email',maxlength:254,autocomplete:'off'}),name:el('input',{maxlength:80}),department:el('input',{maxlength:80}),position:el('input',{maxlength:80,value:'담당자'}),level:options(el('select'),data.levels,'staff'),password:el('input',{type:'password',maxlength:72,autocomplete:'new-password'})};
   panel.appendChild(el('div',{class:'grid'},el('label',null,'이메일',f.email),el('label',null,'이름',f.name),el('label',null,'부서',f.department),el('label',null,'직책',f.position),el('label',null,'역할',f.level),el('label',null,'초기 비밀번호 (8자 이상)',f.password)));
   panel.appendChild(el('div',{class:'row-end'},el('button',{class:'button primary',type:'button',text:'계정 만들기',onclick:function(){
    if(!f.email.value.trim()||!f.name.value.trim()||f.password.value.length<8){toast('이메일, 이름, 8자 이상의 비밀번호를 입력해 주세요.',true);return}
    run(api('/admin/users','POST',{email:f.email.value.trim(),name:f.name.value.trim(),department:f.department.value.trim(),position:f.position.value.trim()||'담당자',level:f.level.value,password:f.password.value}),function(created){toast(created.name+' 님의 계정을 만들었습니다.');usersView()})}})));
  }
  view.appendChild(panel);
 });
}

function permissionsView(){
 view.textContent='';view.appendChild(el('p',{class:'note',text:'불러오는 중…'}));
 run(api('/admin/permissions'),function(data){
  view.textContent='';
  view.appendChild(el('h2',{text:'역할별 기능'}));
  view.appendChild(el('p',{class:'note',text:'체크를 바꾸면 바로 저장되고, 해당 역할의 사용자에게 다음 요청부터 적용됩니다. 회의록 검토·확정·삭제는 역할과 별개로 각 프로젝트의 PM이 처리합니다.'}));
  var levels=Object.keys(data.levels),head=el('tr',null,el('th',{text:'기능'}));
  levels.forEach(function(level){head.appendChild(el('th',{text:data.levels[level]}))});
  var body=el('tbody');
  Object.keys(data.permissions).forEach(function(permission){
   var row=el('tr',null,el('td',{text:data.permissions[permission]}));
   levels.forEach(function(level){
    var locked=data.locked[0]===level&&data.locked[1]===permission;
    var box=el('input',{type:'checkbox',checked:data.granted[level].indexOf(permission)>=0,disabled:locked,'aria-label':data.levels[level]+' · '+data.permissions[permission],onchange:function(){
     var wanted=box.checked;box.disabled=true;
     api('/admin/permissions','PUT',{level:level,permission:permission,allowed:wanted}).then(function(){box.disabled=false;toast('저장했습니다.')}).catch(function(error){box.checked=!wanted;box.disabled=false;toast(error.message,true)})}});
    row.appendChild(el('td',null,box));
   });
   body.appendChild(row);
  });
  view.appendChild(el('div',{class:'scroll'},el('table',{class:'matrix'},el('thead',null,head),body)));
 });
}

function projectsView(){
 view.textContent='';view.appendChild(el('p',{class:'note',text:'불러오는 중…'}));
 run(api('/admin/projects'),function(data){
  view.textContent='';
  view.appendChild(el('h2',{text:'프로젝트 참여자'}));
  view.appendChild(el('p',{class:'note',text:'참여자만 그 프로젝트의 회의록과 변경이력을 볼 수 있고, PM만 검토·확정·삭제를 할 수 있습니다.'}));
  if(!data.items.length)view.appendChild(el('p',{class:'note',text:'지정할 프로젝트가 없습니다.'}));
  var names={};data.people.forEach(function(p){names[p.id]=p.name+(p.active?'':' (사용 중지)')});
  data.items.forEach(function(p){
   var pm=el('select',{'aria-label':p.name+' PM'});
   data.people.forEach(function(person){if(person.active||person.id===p.pm)pm.appendChild(el('option',{value:person.id,selected:person.id===p.pm,text:names[person.id]}))});
   var boxes=[],members=el('div',{class:'members'});
   data.people.forEach(function(person){
    var isMember=p.members.indexOf(person.id)>=0;
    if(!person.active&&!isMember)return;
    var box=el('input',{type:'checkbox',value:person.id,checked:isMember});boxes.push(box);
    members.appendChild(el('label',null,box,names[person.id]+' · '+(person.position||'')));
   });
   function syncPm(){boxes.forEach(function(box){if(box.value===pm.value){box.checked=true;box.disabled=true}else box.disabled=false})}
   pm.addEventListener('change',syncPm);syncPm();
   view.appendChild(el('section',{class:'project'},
    el('header',null,el('h3',{text:p.name}),el('small',{text:p.id}),el('label',null,'PM',pm)),
    members,
    el('div',{class:'row-end'},el('button',{class:'button primary',type:'button',text:'저장',onclick:function(){
