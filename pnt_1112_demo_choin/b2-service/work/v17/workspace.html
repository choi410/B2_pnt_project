/* Current project stage */
.project-stage-position{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:24px;
  padding:18px 20px;
  border:1px solid #d8e6fa;
  border-radius:10px;
  background:#f1f6fd;
}
.project-stage-position>div:first-child{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.project-stage-caption{font-size:13px;font-weight:600;color:#536d8d}
.project-stage-position strong{font-size:23px;line-height:1.4;color:#225ba3}
.project-stage-context{display:flex;align-items:flex-end;flex-direction:column;gap:3px}
.project-stage-context b{font-size:14px;color:#225ba3}
.project-stage-context span{font-size:12px;color:#62758e}
.project-stage-position.unset{border-color:#e1e6ee;background:#f7f9fc}
.project-stage-position.unset strong{font-size:20px;color:#657184}
.project-stage-position.unset>span{font-size:12px;color:#657184}
@media(max-width:600px){
  .project-stage-position{padding:14px}
  .project-stage-position strong{font-size:20px}
  .project-stage-context{align-items:flex-start}
}

/* Delivery stage stepper */
.project-stepper-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.project-stepper-heading h2{margin:0}
.project-stepper-heading .project-context.trigger-only{padding:0;border:0;background:none}
.project-stepper-heading .project-context .section-title{margin:0}
.project-stepper-scroll{overflow-x:auto;padding:6px 0 10px}
.project-stepper{
  display:flex;
  list-style:none;
  margin:0;
  padding:0;
  min-width:560px;
}
.project-stepper li{
  position:relative;
  display:flex;
  flex:1 0 70px;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:0 3px;
  text-align:center;
  color:#627084;
}
.project-stepper li:not(:last-child)::after{
  content:"";
  position:absolute;
  top:16px;
  left:calc(50% + 22px);
  width:calc(100% - 44px);
  height:2px;
  background:#e1e7ef;
}
.project-step-node{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid #cfd8e4;
  color:#63758b;
  background:#fff;
  font-size:13px;
  font-weight:700;
}
.project-step-button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  width:100%;
  padding:0 0 4px;
  background:transparent;
  color:inherit;
  border-radius:8px;
}
.project-step-button:disabled{opacity:1;cursor:default}
.project-step-button:not(:disabled):hover{background:#f0f5fc}
.project-stepper li::after{pointer-events:none}
.project-stepper li.current .project-step-node{width:38px;height:38px;margin-top:-2px;margin-bottom:-2px}
.project-step-name{font-size:13px;font-weight:650;white-space:nowrap}
.project-stepper small{font-size:11px;line-height:1.5;color:#748194}
.project-stepper li.past .project-step-node{background:#e9f6ef;border-color:#b6dbc7;color:#237a55}
.project-stepper li.past::after{background:#9fceb8}
.project-stepper li.current .project-step-node{background:#225ba3;border-color:#225ba3;color:white;box-shadow:0 0 0 4px #e9f0fc}
.project-stepper li.current .project-step-name{color:#225ba3}
.project-stepper li.current small{color:#225ba3;background:#edf3fd;border-radius:4px;padding:0 5px;font-weight:600}
.project-stepper-unset{margin:5px 0 0;color:#657184;font-size:12px}
.design-v20 .sv-flow-focus{min-width:0}
@media(max-width:760px){
  .project-stepper{min-width:640px}
  .project-stepper li{flex-basis:80px}
}

/* Personal calendar memos */
.period-date{position:relative}
.period-memo-dot{
  position:absolute;
  bottom:3px;
  left:calc(50% - 2px);
  width:4px;
  height:4px;
  border-radius:50%;
  background:#9c691a;
}
.period-date.selected .period-memo-dot{background:#ffe1a4}
.calendar-memo{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.calendar-memo-heading,.calendar-memo-heading>span,.calendar-memo-actions{display:flex;align-items:center;gap:8px}
.calendar-memo-heading{justify-content:space-between;color:#334962;font-size:12px}
.calendar-memo-heading svg{flex:none;color:#9c691a}
.calendar-memo form{margin-top:8px}
.calendar-memo textarea{display:block;width:100%;min-height:70px;resize:vertical;padding:8px;font-size:13px}
.calendar-memo-actions{justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.calendar-memo-text{margin-top:8px;padding:8px 10px;background:#fff8e8;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Calendar controls and expanded month view */
.period-controls{gap:3px}
.period-zoom{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:29px;
  padding:2px 7px;
  border:1px solid #dce5f0;
  border-radius:6px;
  background:#f5f8fc;
  color:#25528a;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.period-zoom:hover{background:#eaf1fa}
.modal.modal-calendar-zoom{width:min(1080px,calc(100vw - 32px));max-width:none}
.modal-calendar-zoom .period-calendar{
  --period-date-row:54px;
  --period-event-row:26px;
  padding:0;
  border:0;
}
.design-v20 .modal-calendar-zoom .calendar .section-title h2{font-size:22px}
.modal-calendar-zoom .period-weekdays{font-size:13px}
.modal-calendar-zoom .period-week{min-height:64px}
.modal-calendar-zoom .period-date{width:36px;height:36px;font-size:14px}
.modal-calendar-zoom .period-bar,.modal-calendar-zoom .period-more{
  height:var(--period-event-row);
  line-height:calc(var(--period-event-row) - 2px);
  font-size:12px;
}
@media(max-width:600px){
  .modal-calendar-zoom .period-calendar{--period-date-row:40px;--period-event-row:22px}
  .modal-calendar-zoom .period-week{min-height:48px}
  .modal-calendar-zoom .period-date{width:30px;height:30px}
}


/* 최근 변화 요약 줄: 제목 아래 기존 → 변경 값 노출 */
.design-v20 .sv-recent-list summary{display:flex;align-items:flex-start;gap:14px}
.design-v20 .sv-recent-list summary>time{flex:none;min-width:74px;padding-top:1px}
.design-v20 .sv-change-summary{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.design-v20 .sv-change-summary .sv-change-name{color:#2b3d55;font-weight:600;font-size:14px}
.design-v20 .sv-change-value{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 7px;font-size:13px;line-height:1.5;color:#5b6778;font-weight:400}
.design-v20 .sv-change-value s{color:#98a2b1;text-decoration-color:#c4ccd6;font-size:12.5px}
.design-v20 .sv-change-value .sv-arrow{color:#98a2b1;font-size:12px}
.design-v20 .sv-change-value strong{font-weight:600;color:#1c518e;overflow-wrap:anywhere}
.design-v20 .sv-recent-list summary>svg{flex:none;margin-top:3px;color:#9aa6b4}

/* 펼침 영역 맨 위: 회의록 기반 요약 */
.design-v20 .sv-change-digest{display:flex;flex-direction:column;gap:3px;margin:0 0 14px;padding:13px 16px;background:#f4f7fb;border:1px solid #e3e9f1;border-left:3px solid #225ba3;border-radius:8px;font-size:13px;line-height:1.6;color:#3d4d63}
.design-v20 .sv-change-digest b{color:#1c518e;font-weight:700}

/* 진행 흐름: 회의록 요약 (다음 목표·등록 업무 자리) */
.design-v20 .sv-minutes-digest{margin:6px 0 4px;padding:18px 22px;background:#f7f9fc;border:1px solid #e3e9f1;border-radius:10px}
.design-v20 .sv-digest-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.design-v20 .sv-digest-head>span{font-size:13px;font-weight:700;color:#24364e}
.design-v20 .sv-digest-head .sv-link{font-size:12px;color:#225ba3;display:inline-flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.design-v20 .sv-digest-group{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid #e8edf3}
.design-v20 .sv-digest-group h3{margin:0;font-size:12px;font-weight:700;color:#5d6f87;padding-top:2px}
.design-v20 .sv-digest-group ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px}
.design-v20 .sv-digest-group li{font-size:13.5px;line-height:1.65;color:#2b3b52}
@media(max-width:700px){.design-v20 .sv-digest-group{grid-template-columns:1fr}}

.design-v20 .pnt-avatar{width:36px;height:36px;border-radius:50%;background:#225ba3;color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:none}
.design-v20 .pnt-me-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.design-v20 .pnt-me-txt small{font-size:11.5px;color:#657184;line-height:1.3}

.design-v20 .rail .pnt-item{width:100%;height:38px;display:flex;align-items:center;gap:11px;padding:0 10px;margin:1px 0;border-radius:8px;font-size:14px;font-weight:500;color:#4a586c;position:relative;white-space:nowrap}
.design-v20 .rail .pnt-item:hover{background:#f2f5fa;color:#173b60}

.design-v20 .pnt-count.hot{min-width:20px;height:20px;padding:0 6px;border-radius:999px;color:#fff;font-weight:700;font-size:11.5px;display:inline-grid;place-items:center}

.design-v20 .pnt-star.on{color:#e0a100}
.design-v20 .pnt-item .pnt-star{width:20px;height:20px}
.design-v20 .project-overview-name .pnt-star{margin-left:auto;margin-right:4px}
/* 접힌 상태 */
.compact-nav .pnt-me{margin:4px 10px 6px;padding:6px 0;justify-content:center;background:none;border-color:transparent}
.compact-nav .pnt-me-txt,.compact-nav .pnt-search,.compact-nav .pnt-sec-label,.compact-nav .pnt-lbl,.compact-nav .pnt-tag,.compact-nav .pnt-empty{display:none}
.compact-nav .pnt-scroll{padding:4px 10px}
.compact-nav .rail .pnt-item{justify-content:center;padding:0}
.compact-nav .pnt-count{position:absolute;top:1px;right:3px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.compact-nav .pnt-count:not(.hot){display:none}

/* 사이드바 v3 폭·프로필 보정 */
.workspace.design-v20:not(.compact-nav){--side-width:252px}
.design-v20 .pnt-me-txt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.design-v20 .pnt-me-txt b{display:block}
.design-v20 .pnt-me-txt b em{display:block;margin:0;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.design-v20 .pnt-scroll{scrollbar-width:thin;scrollbar-color:#d5dce6 transparent}
.design-v20 .pnt-scroll::-webkit-scrollbar{width:6px}.design-v20 .pnt-scroll::-webkit-scrollbar-thumb{background:#d5dce6;border-radius:3px}

.design-v20 .rail .pnt-item{gap:10px}
.design-v20 .pnt-tag{font-size:9.5px;padding:0 4px;line-height:1.6}

/* 접힌 상태: 기존 'nav button span 숨김' 규칙에서 아이콘·숫자 배지는 예외 */
.compact-nav .rail nav .pnt-item>.pnt-ico{display:grid!important}
.compact-nav .rail nav .pnt-item .pnt-count.hot{display:inline-grid!important}
.compact-nav .rail nav .pnt-item .pnt-ico svg{display:block}

/* 회의록 기준 단계 추정 */
.design-v20 .pnt-stage-guess .project-stage-position{border-style:dashed;border-color:#9dbbe2;background:#f7faff}
.design-v20 .pnt-stage-guess .project-stage-caption::after{content:"회의록 기준 추정";margin-left:8px;font-size:11px;font-weight:700;color:#a8780d;background:#fdf4e3;border-radius:4px;padding:1px 6px;vertical-align:1px}
.design-v20 .pnt-stage-guess .project-stepper li.current .project-step-node{background:#fff;color:#225ba3;border:2px dashed #225ba3;box-shadow:none}
.design-v20 .pnt-guess-note{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0 4px;padding:12px 16px;border-radius:9px;background:#fff8ea;border:1px solid #f1e0b8;font-size:13px;line-height:1.6;color:#5b4a26}
.design-v20 .pnt-guess-note b{color:#8a5d00;margin-right:8px}
.design-v20 .pnt-guess-note em{font-style:normal;font-weight:700;color:#2b3d55}
.design-v20 .pnt-guess-note.subtle{background:#f6f8fb;border-color:#e3e9f1;color:#4a5a70}
.design-v20 .pnt-guess-note.subtle b{color:#1c518e;margin:0}
.design-v20 .pnt-guess-note .btn{flex:none}

.design-v20 .pnt-stage-guess .project-stepper li.current .project-step-button small{font-size:0}
.design-v20 .pnt-stage-guess .project-stepper li.current .project-step-button small::after{content:"추정";font-size:11px;font-weight:700;color:#a8780d;background:#fdf4e3;border-radius:4px;padding:1px 6px}

/* 대시보드 오른쪽: 업무 완료 / 구성원별 미완료 업무 */
.design-v20 .pnt-done-card,.design-v20 .pnt-member-card{padding:20px 22px;border-radius:14px}
.design-v20 .pnt-done-card header,.design-v20 .pnt-member-card header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.design-v20 .pnt-done-card h2,.design-v20 .pnt-member-card h2{font-size:16px;font-weight:800;color:#1f2d40;margin:0;letter-spacing:-.2px}
.design-v20 .pnt-done-card .text-link{font-size:13px;font-weight:600;color:#225ba3}
.design-v20 .m-total{font-size:13px;color:#8a95a5}
.design-v20 .done-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:14px 0 10px}
.design-v20 .done-num{display:flex;align-items:baseline;gap:7px;margin:0}
.design-v20 .done-num b{font-size:34px;font-weight:800;letter-spacing:-1.3px;line-height:1;color:#1f2d40}
.design-v20 .done-num span{font-size:14px;color:#657184}
.design-v20 .done-pct{font-size:15px;font-weight:800;color:#225ba3;line-height:1.2}
.design-v20 .done-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#e6eaf1}
.design-v20 .done-bar i{display:block;height:100%}
.design-v20 .done-bar i.d,.design-v20 .done-legend i.d{background:#24456e}
.design-v20 .done-bar i.a,.design-v20 .done-legend i.a{background:#7fa4d6}
.design-v20 .done-bar i.t,.design-v20 .done-legend i.t{background:#d7dde6}
.design-v20 .done-legend{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.design-v20 .done-legend li{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#5b6a7e;min-width:0}
.design-v20 .done-legend i{width:9px;height:9px;border-radius:3px;flex:none}
.design-v20 .done-legend span{white-space:nowrap}
.design-v20 .done-legend b{font-weight:700;color:#1f2d40;margin-left:auto}
.design-v20 .done-note{margin:14px 0 0;font-size:12px;line-height:1.55;color:#8a95a5;word-break:keep-all}
.design-v20 .card-empty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:26px 8px 18px}
.design-v20 .card-empty b{font-size:14px;font-weight:700;color:#5b6a7e}
.design-v20 .card-empty span{font-size:12.5px;color:#98a2b1;word-break:keep-all}
.design-v20 .mlist{list-style:none;margin:12px 0 0;padding:0}
.design-v20 .mlist li{display:grid;grid-template-columns:30px 84px minmax(28px,1fr) 20px 50px;align-items:center;gap:9px;padding:6px 0}
.design-v20 .mlist li.un{border-top:1px solid #edf0f4;margin-top:6px;padding-top:12px}
.design-v20 .m-av{width:30px;height:30px;aspect-ratio:1;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}
.design-v20 .m-av.no-one{background:transparent!important;border:1.5px dashed #c3cad4}
.design-v20 .m-name{font-size:13.5px;color:#2b3d55;display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.design-v20 .m-name small{font-size:11px;color:#8a95a5;font-weight:600}
.design-v20 .un .m-name{color:#6b7a8d}
.design-v20 .m-bar{display:block;height:6px;border-radius:3px;background:#eef1f6;overflow:hidden}
.design-v20 .m-bar i{display:block;height:100%;border-radius:3px}
.design-v20 .mlist b{font-size:14px;font-weight:700;color:#1f2d40;text-align:right}
.design-v20 .mlist b.zero{color:#b4bcc7;font-weight:600}
.design-v20 .mlist em{font-style:normal;font-size:11px;font-weight:700;color:#b54242;background:#fdecec;border-radius:7px;padding:2px 6px;text-align:center;white-space:nowrap}
.design-v20 .m-gap{display:block}

/* 좁은 화면(760px 이하): 기존 규칙처럼 아이콘 모드로 — 사이드바 v3 요소도 함께 축소 */
@media(max-width:760px){
.workspace.design-v20:not(.compact-nav){--side-width:68px}
.design-v20 .pnt-me{margin:4px 10px 6px;padding:6px 0;justify-content:center;background:none;border-color:transparent}
.design-v20 .pnt-me-txt,.design-v20 .pnt-search,.design-v20 .pnt-sec-label,.design-v20 .pnt-lbl,.design-v20 .pnt-tag,.design-v20 .pnt-empty{display:none}
.design-v20 .pnt-scroll{padding:4px 10px}
.design-v20 .rail .pnt-item{justify-content:center;padding:0}
.design-v20 .rail nav .pnt-item>.pnt-ico{display:grid!important}
.design-v20 .pnt-count{position:absolute;top:1px;right:3px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.design-v20 .pnt-count:not(.hot){display:none}
.design-v20 .rail nav .pnt-item .pnt-count.hot{display:inline-grid!important}
}

/* 사이드바 v3.1: '업무' 하위 메뉴 (마우스를 올리거나 ▾로 펼침) */
.design-v20 .pnt-group-row{position:relative}
.design-v20 .pnt-group-row>.pnt-item{padding-right:38px}
.design-v20 .pnt-chev{position:absolute;right:6px;top:7px;width:26px;height:24px;border-radius:6px;display:grid;place-items:center;color:#7a879a;transition:transform .18s,background .15s}
.design-v20 .pnt-chev:hover{background:#e6ecf4;color:#173b60}
.design-v20 .pnt-group.open .pnt-chev{transform:rotate(180deg)}
.design-v20 .pnt-dot{width:7px;height:7px;border-radius:50%;background:#225ba3;flex:none}
.design-v20 .pnt-group-sub:not(.fly){overflow:hidden;max-height:0;opacity:0;transition:max-height .22s ease,opacity .18s ease;margin:0 0 0 19px;padding-left:9px;border-left:1px solid #e3e8ef}
.design-v20 .pnt-group.open .pnt-group-sub:not(.fly){max-height:300px;opacity:1;margin:2px 0 6px 19px}
.design-v20 .rail .pnt-item.sub{height:34px;font-size:13.5px;gap:9px;padding:0 8px}
.design-v20 .rail .pnt-item.sub .pnt-ico{width:18px}
.design-v20 .pnt-group-sub.fly{position:fixed;z-index:60;width:236px;background:#fff;border:1px solid #e2e6ed;border-radius:12px;box-shadow:0 12px 30px #1b2a4029;padding:6px}
.design-v20 .pnt-fly-title{display:block!important;font-size:11.5px;font-weight:700;color:#7a879a;padding:6px 8px 4px}
.design-v20 .rail nav .pnt-group-sub.fly .pnt-item{justify-content:flex-start!important;padding:0 8px!important}
.design-v20 .rail nav .pnt-group-sub.fly .pnt-lbl{display:block!important}
.design-v20 .rail nav .pnt-group-sub.fly .pnt-tag{display:inline!important}
.design-v20 .rail nav .pnt-group-sub.fly .pnt-count{position:static!important;display:inline-grid!important;min-width:18px;height:auto;font-size:12.5px;padding:0}
.design-v20 .rail nav .pnt-group-sub.fly .pnt-count.hot{min-width:20px;height:20px;padding:0 6px;font-size:11.5px}
.compact-nav .pnt-dot{position:absolute;top:6px;right:12px}
@media(max-width:760px){.design-v20 .pnt-dot{position:absolute;top:6px;right:12px}}

.design-v20 .pnt-group:not(.open) .pnt-group-sub:not(.fly){visibility:hidden}

/* ▾ 버튼: 기존 'nav button' 규칙(높이 46px·여백)에 덮이지 않도록 */
.design-v20 .rail nav .pnt-group-row .pnt-chev{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;min-height:0;padding:0;margin:0;justify-content:center;align-items:center;display:grid;border-radius:6px;background:transparent}
.design-v20 .rail nav .pnt-group-row .pnt-chev:hover{background:#e6ecf4}
.design-v20 .rail nav .pnt-group.open .pnt-group-row .pnt-chev{transform:translateY(-50%) rotate(180deg)}

/* ===================== 홈: 업무 보드(칸반) ===================== */
.design-v20 .kb-wrap{display:flex;flex-direction:column;gap:16px}
.design-v20 .kb-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.design-v20 .kb-seg{display:inline-flex;border:1px solid #d9e0ea;border-radius:8px;overflow:hidden;background:#fff}
.design-v20 .kb-seg button{height:34px;padding:0 14px;font-size:13px;font-weight:600;color:#5b6a7e;border:0;background:#fff}
.design-v20 .kb-seg button+button{border-left:1px solid #e4e9f0}
.design-v20 .kb-seg button.on{background:#eaf0f9;color:#1c518e}
.design-v20 .kb-sel{height:34px;border:1px solid #d9e0ea;border-radius:8px;padding:0 10px;background:#fff;font-size:13px;color:#3f5068}
.design-v20 .kb-hint{font-size:12px;color:#98a2b1;margin-left:auto}
.design-v20 .kb-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
.design-v20 .kb-col{background:#eef1f6;border-radius:14px;padding:4px 10px 10px;min-height:150px}
.design-v20 .kb-head{display:flex;align-items:center;gap:8px;padding:14px 8px 10px;border-bottom:2px solid #c9d3e0;margin-bottom:10px}
.design-v20 .kb-head i{width:8px;height:8px;border-radius:50%;background:#8a97a8;flex:none}
.design-v20 .kb-head b{font-size:14px;font-weight:700;color:#2b3d55}
.design-v20 .kb-head em{font-style:normal;font-size:12px;color:#6b7a8d;background:#fff;border-radius:999px;padding:1px 8px;margin-left:2px}
.design-v20 .c-todo .kb-head{border-bottom-color:#8aa0c4}.design-v20 .c-todo .kb-head i{background:#5b7bab}
.design-v20 .c-doing .kb-head{border-bottom-color:#e0a83a}.design-v20 .c-doing .kb-head i{background:#d2941f}
.design-v20 .c-review .kb-head{border-bottom-color:#b08ad6}.design-v20 .c-review .kb-head i{background:#8a5fb8}
.design-v20 .c-done .kb-head{border-bottom-color:#7bc0a0}.design-v20 .c-done .kb-head i{background:#34765d}
.design-v20 .kb-list{display:flex;flex-direction:column;gap:10px}
.design-v20 .kb-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px #1b2a401a;cursor:pointer;transition:box-shadow .15s,transform .12s}
.design-v20 .kb-card:hover{box-shadow:0 6px 18px #1b2a4026;transform:translateY(-1px)}
.design-v20 .kb-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:9px}
.design-v20 .kb-badge.r{background:#fdecec;color:#b54242}
.design-v20 .kb-badge.a{background:#fdf4e3;color:#a8780d}
.design-v20 .kb-badge.v{background:#f4eefa;color:#7a4fa3}
.design-v20 .kb-badge.g{background:#f1f3f6;color:#6b7686}
.design-v20 .kb-title{display:block;font-size:14.5px;font-weight:700;color:#202d40;line-height:1.5}
.design-v20 .kb-desc{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:#6b7a8d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.design-v20 .kb-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #f0f2f6}
.design-v20 .kb-who{display:flex;align-items:center;gap:7px;font-size:12px;color:#5b6778;min-width:0}
.design-v20 .kb-av{width:24px;height:24px;border-radius:50%;background:#5b7bab;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.design-v20 .kb-av.no-one{background:transparent;border:1.5px dashed #b8c0cb}
.design-v20 .kb-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#8a95a5;flex:none}
.design-v20 .kb-meta em{font-style:normal;background:#eef2f7;color:#5b6a7e;border-radius:5px;padding:1px 7px;font-weight:600}
.design-v20 .kb-empty{margin:0;padding:22px 8px;text-align:center;font-size:12.5px;color:#98a2b1}
@media(max-width:1250px){.design-v20 .kb-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.design-v20 .kb-board{grid-template-columns:1fr}.design-v20 .kb-hint{display:none}}

/* ===================== 프로젝트 목록 ===================== */
.design-v20 .pj-card{padding:0;overflow:hidden}
.design-v20 .pj-tabs{display:flex;gap:22px;border-bottom:1px solid #e1e6ed;padding:0 22px;overflow-x:auto}
.design-v20 .pj-tabs button{flex:none;padding:15px 0 13px;font-size:14px;color:#637086;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;background:none}
.design-v20 .pj-tabs button.active{color:#225ba3;border-bottom-color:#225ba3;font-weight:700}
.design-v20 .pj-tabs em{font-style:normal;font-size:12px;padding:1px 6px;background:#f0f3f7;border-radius:4px;margin-left:6px;color:#6b778a}
.design-v20 .pj-tabs button.active em{background:#eaf0f9;color:#225ba3}
.design-v20 .pj-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #edf0f4}
.design-v20 .pj-search{flex:1;min-width:190px;height:36px;border:1px solid #dce2ec;border-radius:7px;display:flex;align-items:center;gap:8px;padding:0 11px;background:#fff;color:#8a95a5;margin:0}
.design-v20 .pj-search input{border:0;outline:0;flex:1;min-width:0;font-size:13px;background:transparent;padding:0;margin:0;color:#293950}

.design-v20 .pj-hint{font-size:12px;color:#98a2b1}
.design-v20 .pj-rowhead,.design-v20 .pj-row{display:grid;grid-template-columns:120px minmax(0,1fr) 148px 96px 102px 88px 34px;gap:12px;align-items:center;padding:11px 22px}
.design-v20 .pj-rowhead{font-size:11.5px;color:#8a95a5;border-bottom:1px solid #edf0f4;padding-top:9px;padding-bottom:9px}
.design-v20 .pj-group{border-bottom:1px solid #edf0f4}
.design-v20 .pj-yhead{width:100%;display:flex;align-items:center;gap:9px;padding:11px 22px;background:#fafbfd;font-size:13px;font-weight:700;color:#41536b;border:0}
.design-v20 .pj-yhead:hover{background:#f3f6fa}
.design-v20 .pj-yhead>svg{transition:transform .15s;color:#9aa6b4}
.design-v20 .pj-group.closed .pj-yhead>svg{transform:rotate(-90deg)}
.design-v20 .pj-group.closed .pj-rows{display:none}
.design-v20 .pj-n{font-weight:500;color:#657184;font-size:12.5px}
.design-v20 .pj-sp{flex:1}

.design-v20 .pj-row{border-top:1px solid #f2f4f8;font-size:13.5px;cursor:pointer}
.design-v20 .pj-row:hover{background:#f7fafd}
.design-v20 .pj-no{font-size:12px;color:#6b7a8d}
.design-v20 .pj-title{min-width:0}
.design-v20 .pj-title b{display:block;font-size:14px;color:#2b3d55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.design-v20 .pj-title small{font-size:12px;color:#657184}

.design-v20 .pj-dots i.on{background:#7fa4d6}
.design-v20 .pj-dots i.cur{background:#225ba3;box-shadow:0 0 0 2px #cfe0f5}
.design-v20 .pj-sname{font-size:12.5px;color:#43546b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.design-v20 .pj-task{font-size:12.5px;color:#43546b}
.design-v20 .pj-bar{display:block;height:4px;background:#eaf0f7;border-radius:3px;margin-top:4px;overflow:hidden}
.design-v20 .pj-bar i{display:block;height:100%;background:#3b78c6}
.design-v20 .pj-none{color:#98a2b1;font-size:12px}
.design-v20 .pj-due{font-size:12.5px;color:#43546b}

.design-v20 .pj-tag.v{background:#f4eefa;color:#7a4fa3}
.design-v20 .pj-tag.a{background:#fdf4e3;color:#a8780d}
.design-v20 .pj-star{display:grid;place-items:center}
.design-v20 .pj-empty{margin:0;padding:40px 22px;text-align:center;color:#657184;font-size:13.5px}

@media(max-width:1180px){.design-v20 .pj-rowhead,.design-v20 .pj-row{grid-template-columns:100px minmax(0,1fr) 120px 80px 90px 74px 30px}}

/* 홈: 보드 + 오른쪽 캘린더 */
.design-v20 .kb-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.design-v20 .kb-aside{display:flex;flex-direction:column;gap:18px;min-width:0}
.design-v20 .kb-layout .kb-board{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1500px){.design-v20 .kb-layout .kb-board{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 사이드바 프로필: 버튼으로 (누르면 계정 정보) + 상단바 검색 */
.design-v20 button.pnt-me{width:calc(100% - 24px);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}

.design-v20 button.pnt-me:focus-visible{outline:2px solid #6c9cda;outline-offset:2px}

.compact-nav .pnt-me-chev{display:none}

/* 업무 탭: 문제별 칩 + 필터 줄 */

.design-v20 .wc-label{font-size:12px;font-weight:700;color:#7a879a;margin-right:2px}
.design-v20 .work-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid #dce2ec;background:#fff;font-size:13px;font-weight:600;color:#5b6a7e;transition:.15s}
.design-v20 .work-chip:hover{border-color:#b9c6d8;background:#f7f9fc}
.design-v20 .work-chip em{font-style:normal;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:#f0f3f7;color:#6b778a}
.design-v20 .work-chip.on{color:#fff;border-color:transparent}
.design-v20 .work-chip.on em{background:#ffffff38;color:#fff}
.design-v20 .work-chip.r.on{background:#b54242}
.design-v20 .work-chip.a.on{background:#a8780d}
.design-v20 .work-chip.v.on{background:#7a4fa3}
.design-v20 .wc-sp{flex:1;min-width:8px}
.design-v20 .work-sel{height:32px;border:1px solid #dce2ec;border-radius:7px;padding:0 8px;background:#fff;font-size:12.5px;color:#3f5068;max-width:160px}
.design-v20 .wc-check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#5b6a7e;white-space:nowrap;margin:0}
.design-v20 .wc-check input{width:15px;height:15px;margin:0}
.design-v20 .wc-reset{font-size:12.5px;font-weight:600;color:#225ba3;padding:0 6px;height:32px;background:none}
.design-v20 .wc-reset:hover{text-decoration:underline}
@media(max-width:860px){.design-v20 .wc-sp{display:none}.design-v20 .work-sel{max-width:none;flex:1 1 120px}}

/* 상단 검색 — 아이콘 버튼 대신 넓은 검색 필드, 알림/프로필과 떨어뜨려 배치 */
.design-v20 .topbar-search{display:flex;align-items:center;gap:9px;height:40px;flex:0 1 360px;min-width:0;margin-left:10px;margin-right:auto;padding:0 12px 0 14px;border-radius:10px;border:1px solid #e3e8f0;background:#f6f8fb;color:#8b99aa;transition:.15s}
.design-v20 .topbar-search>span{flex:1;min-width:0;text-align:left;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.design-v20 .topbar-search>kbd{font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.3px;color:#93a1b3;background:#fff;border:1px solid #e1e7ef;border-bottom-width:2px;border-radius:5px;padding:2px 6px;flex:none}
.design-v20 .topbar-search:hover{background:#fff;border-color:#c3d2e4;color:#4a5d74;box-shadow:0 1px 3px #16305612}
.design-v20 .topbar-search:hover>kbd{color:#6d7e92;border-color:#d4dde8}
.design-v20 .topbar-search:focus-visible{outline:2px solid #6c9cda;outline-offset:2px}
@media(max-width:1200px){.design-v20 .topbar-search{flex-basis:260px}.design-v20 .topbar-search>kbd{display:none}}
@media(max-width:900px){.design-v20 .topbar-search{flex:none;width:40px;padding:0;justify-content:center;margin-right:0}.design-v20 .topbar-search>span,.design-v20 .topbar-search>kbd{display:none}}

/* 홈 보드: 내 업무 고정 + 컬럼당 5장 제한 */
.design-v20 .kb-scope{display:inline-flex;align-items:center;height:34px;padding:0 13px;border-radius:8px;background:#e8eef7;border:1px solid #d5e0ee;font-size:13px;font-weight:700;color:#2c4f7c}
.design-v20 .kb-more{display:block;width:100%;margin-top:10px;padding:9px 0;border-radius:9px;border:1px dashed #c3cdda;background:#ffffff80;font-size:12.5px;font-weight:600;color:#5c6b7e;transition:.15s}
.design-v20 .kb-more:hover{background:#fff;border-color:#9bb0c9;color:#2c4f7c}
.design-v20 .kb-col.exp .kb-list{max-height:1400px;overflow:auto;padding-right:4px;scrollbar-width:thin}

/* 홈 보드 카드: 압축 밀도 (제목 + 담당자/기한 한 줄) */
.design-v20 .kb-card{padding:11px 12px}
.design-v20 .kb-title{font-size:13.5px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.design-v20 .kb-desc{display:none}
.design-v20 .kb-foot{margin-top:8px;padding-top:0;border-top:0;gap:6px}
.design-v20 .kb-who{gap:6px;font-size:11.5px}
.design-v20 .kb-nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.design-v20 .kb-av{width:21px;height:21px;font-size:9px}
.design-v20 .kb-meta{gap:6px;font-size:11px}
.design-v20 .kb-meta em{font-style:normal}
.design-v20 .kb-card .kb-badge{margin:0;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.design-v20 .kb-list{gap:8px}

/* 협조 요청 카드 / 메뉴 */
.design-v20 .kb-card.kb-coop{border-left:3px solid #8f6bb8;background:#fcfaff}
.design-v20 .kb-card.kb-coop:hover{background:#faf6ff}
.design-v20 .kb-badge.c{background:#f1eaf9;color:#6f4a9b}

/* 협조 요청 첨부 */
.design-v20 .coop-files,body:has(.design-v20) .coop-files{margin:14px 0;padding:13px 15px;border:1px solid #e3e8f0;border-radius:10px;background:#fafbfd}
.design-v20 .coop-files.sm,body:has(.design-v20) .coop-files.sm{margin:10px 0;padding:10px 12px}
.design-v20 .coop-files-top,body:has(.design-v20) .coop-files-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.design-v20 .coop-files-label,body:has(.design-v20) .coop-files-label{font-size:12px;font-weight:700;color:#53647a}
.design-v20 .coop-files-label em,body:has(.design-v20) .coop-files-label em{font-style:normal;margin-left:6px;font-size:11px;font-weight:700;background:#e8edf5;color:#5b6d85;border-radius:999px;padding:1px 7px}
.design-v20 .coop-files .upload-button,body:has(.design-v20) .coop-files .upload-button{margin:0;font-size:11px;padding:6px 10px}
.design-v20 .coop-files-none,body:has(.design-v20) .coop-files-none{margin:9px 0 0;font-size:11.5px;color:#93a0b1}
.design-v20 .coop-file-list,body:has(.design-v20) .coop-file-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.design-v20 .coop-file-list li,body:has(.design-v20) .coop-file-list li{display:flex;align-items:center;gap:8px}
.design-v20 .coop-file,body:has(.design-v20) .coop-file{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:7px 9px;border:1px solid #e1e7f0;border-radius:8px;background:#fff;text-decoration:none;color:inherit;transition:.15s}
.design-v20 .coop-file:hover,body:has(.design-v20) .coop-file:hover{border-color:#9db4d2;background:#f7faff;text-decoration:none}
.design-v20 .coop-thumb,body:has(.design-v20) .coop-thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;background:#eef2f8;flex:none;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#6b7e96;letter-spacing:.3px}
.design-v20 .coop-file-txt,body:has(.design-v20) .coop-file-txt{min-width:0;display:block}
.design-v20 .coop-file-txt b,body:has(.design-v20) .coop-file-txt b{display:block;font-size:12.5px;color:#2b3c52;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.design-v20 .coop-file-txt small,body:has(.design-v20) .coop-file-txt small{display:block;font-size:10.5px;color:#94a1b2;margin-top:2px}
.design-v20 .coop-file-x,body:has(.design-v20) .coop-file-x{width:26px;height:26px;border-radius:6px;color:#9aa7b8;font-size:13px;flex:none;line-height:1}
.design-v20 .coop-file-x:hover,body:has(.design-v20) .coop-file-x:hover{background:#fdecec;color:#b54242}
.design-v20 .kb-card.kb-prop{border-left:3px solid #c79a34;background:#fffdf7}
.design-v20 .kb-card.kb-prop:hover{background:#fffbf0}

/* AI 분석 중 미리보기 */
.ai-progress.ai-live{align-items:flex-start}
.ai-live-body{flex:1;min-width:0}
.ai-live-body>span{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ai-live-time{font-style:normal;font-size:11px;color:#7f93ab;font-variant-numeric:tabular-nums}
.ai-live-list{margin:12px 0 2px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:ail}
.ai-live-list li{counter-increment:ail;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #dbe5f0;border-radius:7px;padding:8px 11px;font-size:12.5px;color:#2b3f58;animation:ailIn .25s ease-out}
.ai-live-list li:before{content:counter(ail);width:18px;height:18px;border-radius:50%;background:#e4edf8;color:#44689a;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.ai-live-list b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-live-list i{font-style:normal;font-size:10px;font-weight:700;color:#8a6a1c;background:#fbf2da;border-radius:4px;padding:1px 6px;flex:none}
@keyframes ailIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ai-live-list li{animation:none}}
.ai-done{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:8px 12px;border-radius:7px;background:#f1f6ee;border:1px solid #dfead6;font-size:11.5px;color:#6b7f5e}
.ai-done b{font-size:12.5px;color:#3f6a2c;font-variant-numeric:tabular-nums}
.ai-done span+span:before{content:"|";margin-right:10px;color:#c5d3b9}
/* 회의록: 프로젝트 선택 */
.design-v20 .lib-sel{height:38px;margin:0;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;color:#3f5068;max-width:240px}
.design-v20 .lib-sel:focus{border-color:#6c94c0;box-shadow:0 0 0 2px #d9e6f2}
@media(max-width:760px){.design-v20 .library-toolbar .lib-sel{margin:10px 0 0;max-width:none;width:100%}}
.design-v20 .lib-tools{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:18px 0;min-width:0}
.design-v20 .lib-tools .search{width:240px;margin:0;flex:none}
@media(max-width:760px){.design-v20 .lib-tools{flex-wrap:wrap;margin:12px 0}.design-v20 .lib-tools .search{flex:1 1 160px;width:auto}.design-v20 .lib-tools .lib-sel{flex:1 1 140px}}
/* 회의록 등록 4단계: 흐름 확인 */
.flow-after{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0 4px;max-width:1000px}
.flow-after>section{background:#fafbfd;border:1px solid #e4e9f0;border-radius:10px;padding:15px 17px;min-width:0}
.flow-after h3{font-size:12.5px;font-weight:700;color:#44586f;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.flow-after h3 em{font-style:normal;font-size:11px;font-weight:700;background:#e8edf5;color:#5b6d85;border-radius:999px;padding:1px 7px}
.flow-after .muted{font-size:11.5px;line-height:1.7}
.fa-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fa-list li{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:11.5px;color:#7a8799}
.fa-list b{font-size:12.5px;font-weight:600;color:#2b3c52;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa-list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa-tag{font-style:normal;align-self:flex-start;font-size:10.5px;font-weight:700;color:#5b6d85;background:#eef2f7;border-radius:5px;padding:1px 6px}
.fa-link{display:block;text-align:left;padding:0;font-size:12.5px;font-weight:600;color:#225ba3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fa-link:hover{text-decoration:underline}
.fa-line{font-size:11.5px;color:#7a8799;line-height:1.9;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.fa-line b{color:#2b3c52;font-size:12.5px}
.fa-late{font-style:normal;font-size:10.5px;font-weight:700;color:#b54242;background:#fdecec;border-radius:5px;padding:1px 6px}
.flow-after>section.fa-wide{grid-column:1/-1}
.fa-wide .flow-strip{padding:4px 2px 2px;margin-bottom:6px}
.fa-wide .flow-strip li{min-width:150px}
.fa-wide .flow-strip li>button time{font-size:11.5px}
.fa-wide .flow-strip li>button b{font-size:12.5px}
.fa-wide .flow-strip li>button span{font-size:11.5px}
.fa-wide .fa-line{margin-top:4px}
@media(max-width:860px){.flow-after{grid-template-columns:1fr}}
.fa-pick{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:8px;background:#eef3fa;border:1px solid #dde5f0}
.fa-pick-txt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.fa-pick-txt em{font-style:normal;font-size:10.5px;font-weight:700;color:#44689a;background:#fff;border-radius:5px;padding:2px 7px;flex:none}
.fa-pick-txt b{font-size:12.5px;font-weight:700;color:#2b3c52;min-width:0}
.fa-pick-txt small{font-size:11px;color:#7a8799;font-variant-numeric:tabular-nums}
.fa-pick .fa-link{flex:none;font-size:11.5px}
/* 회의록: 목록 / 회의 흐름 보기 전환 */
.design-v20 .lib-view{display:inline-flex;border:1px solid #d9e0ea;border-radius:8px;overflow:hidden;background:#fff;flex:none}
.design-v20 .lib-view button{padding:0 13px;height:38px;font-size:12.5px;font-weight:600;color:#6b7a8d;background:#fff;white-space:nowrap}

.design-v20 .lib-view button.on{background:#1f4e8c;color:#fff}
.flow-pickbar{padding:26px 20px;text-align:center;color:#7a8799}

.flow-pickbar>div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.library-surface .flow-after{margin:4px 0 10px;max-width:none}
/* 회의 흐름: 프로젝트 단계 */
.fa-stage{margin-top:12px;padding:12px 13px;border-radius:8px;background:#fbfcfe;border:1px solid #e4e9f0}

.fa-stage-note{margin:0;font-size:11.5px;line-height:1.75;color:#7a8799}

.fa-stage-note b.fa-g{color:#a8780d}

.project-options .po-row{border-bottom:1px solid #e2e9f1}

.po-line{display:flex;align-items:center;gap:8px;padding-right:12px}

.po-acts{display:flex;gap:6px;flex:none}

.po-act:hover{border-color:#9db4d2;color:#225ba3;background:#f7faff}

.po-edit{padding:4px 14px 16px;background:#fafbfd;border-top:1px dashed #dce4ee;display:grid;gap:12px}

/* 회의 흐름: 머리줄 · 단계 확정 · 누적 요약 */
.fa-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}

.fa-stage-now{font-style:normal;font-size:11px;font-weight:700;color:#2c4f7c;background:#e8eef7;border:1px solid #d5e0ee;border-radius:999px;padding:2px 9px}
