function pageContent(){
switch(ui.page){case'home':return homePage();case'projects':return projectsPage();case'project':return projectPage();case'tasks':case'mine':return tasksPage();case'calendar':return calendarPage();case'meetings':return meetingsPage();case'meeting':return meetingPage();case'newMeeting':return newMeetingPage();case'meetingReview':return meetingReviewPage();case'requirements':return requirementsPage();case'formats':return formatsPage();case'help':return helpPage();default:ui.page='home';return homePage()}}
function scopePicker(){return `<select aria-label="프로젝트 필터" data-change="project-filter">${pOptions(ui.project)}</select>`}
function homePage(){
const ts=scoped(db.tasks),open=ts.filter(t=>t.status!=='완료'),late=open.filter(isLate),review=open.filter(t=>t.status==='검토요청'),today=open.filter(t=>t.due===TODAY);
const first=[...review,...late,...today].filter((t,i,a)=>a.findIndex(x=>x.id===t.id)===i).slice(0,6);
const daily=allCalEvents().filter(e=>e.date===TODAY).sort((a,b)=>a.time.localeCompare(b.time));
return `<div class="home-title"><div><small>오늘도 함께 만드는 더 나은 프로젝트</small><h1>${ui.actor}님, <span>오늘 할 일</span>을 확인하세요.</h1><p>확인이 필요한 업무와 오늘 일정을 한곳에 모았습니다.</p></div><div class="home-date">2026년 11월 5일 목요일</div></div><div class="focus-cards">${[['오늘 마감',today.length,'calendar','today',''],['완료 검토 대기',review.length,'shield','검토요청','purple'],['기한 지난 업무',late.length,'clock','overdue','red']].map(([label,n,ic,filter,tone])=>`<button class="focus-card" data-action="metric" data-filter="${filter}"><span class="focus-icon ${tone}">${icon(ic)}</span><span><label>${label}</label><strong>${n}<small>건</small></strong></span>${icon('chevron')}</button>`).join('')}</div><div class="home-grid"><div class="home-stack"><section><div class="focus-banner">${icon('shield')}<div class="grow"><strong>완료 검토 ${review.length}건, 지연 업무 ${late.length}건을 먼저 확인해 주세요.</strong><p>업무를 누르면 담당자, 조치 내용과 원문 근거를 함께 볼 수 있습니다.</p></div></div><div class="card"><div class="section-head"><h2>지금 확인할 업무</h2><button class="section-link" data-action="nav" data-page="tasks">전체 업무 보기 →</button></div>${first.map((t,i)=>`<button class="home-list-row" data-action="task" data-id="${t.id}"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="grow"><h3>${esc(t.title)}</h3><p>${esc(project(t.project)?.code)} <span style="padding:0 5px">·</span> ${esc(t.owner||'담당 미정')} <span style="padding:0 5px">·</span><span class="${isLate(t)?'late':''}">${shortDate(t.due)}${isLate(t)?' 기한 지남':''}</span></p></span>${badge(t.status)}${icon('chevron')}</button>`).join('')||empty('확인할 업무를 모두 처리했습니다.','캘린더에서 다음 일정을 확인하세요.')}</div></section><div class="home-shortcuts"><button data-action="new-meeting">${icon('file')}회의록 등록</button><button data-action="new-task">${icon('plus')}업무 등록</button><button data-action="requirements-nav">${icon('history')}요구사항 이력</button><button data-action="nav" data-page="formats">${icon('file')}문서 양식</button></div></div><aside class="home-stack"><section class="card"><div class="section-head"><h2>오늘 일정 <span style="font-size:12px;font-weight:500;color:#a0a9b6;margin-left:6px">11.05</span></h2><button class="section-link" data-action="nav" data-page="calendar">캘린더 →</button></div>${daily.map(e=>`<button class="today-item" data-action="cal-event" data-kind="${e.kind}" data-id="${e.id}"><span class="time">${e.time}</span><span class="line ${e.kind}"></span><span><h3>${esc(e.title)}</h3><p>${esc(project(e.project)?.code)} · ${esc(e.owner||'담당 미정')}</p></span></button>`).join('')||empty('오늘 등록된 일정이 없습니다.')}</section><section class="card"><div class="section-head"><h2>진행 중인 프로젝트</h2><button class="section-link" data-action="nav" data-page="projects">전체 보기 →</button></div>${db.projects.map(p=>`<button class="home-project" data-action="project" data-id="${p.id}"><span class="project-symbol ${p.tone}">${icon('folder')}</span><span class="grow"><h3>${esc(p.name)}</h3><p>${esc(p.phase)} · 목표 ${shortDate(p.target)}</p></span>${icon('chevron')}</button>`).join('')}</section></aside></div>`;
}
function miniTask(t){return `<button class="mini-task" data-action="task" data-id="${t.id}"><span class="check-circle ${t.status==='완료'?'done':''}"></span><span class="grow"><strong style="font-size:12px;font-weight:500">${esc(t.title)}</strong><small class="task-sub">${esc(project(t.project)?.code)} · ${esc(t.owner||'담당 미정')} · <span class="${isLate(t)?'late':''}">${shortDate(t.due)}${isLate(t)?' 기한 지남':''}</span></small></span>${badge(t.status)}${icon('chevron',true)}</button>`}
function projectCard(p){const ts=db.tasks.filter(t=>t.project===p.id),done=ts.filter(t=>t.status==='완료').length;return `<button class="card project-card" data-action="project" data-id="${p.id}"><div class="spread"><span class="project-symbol ${p.tone}">${icon('folder')}</span>${badge(p.phase)}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="spread" style="margin-top:17px"><span>업무 완료</span><span>${done} / ${ts.length}</span></div><div class="progress"><span style="width:${ts.length?done/ts.length*100:0}%"></span></div><footer class="spread"><span>PM ${esc(p.pm)}</span><span>목표 ${shortDate(p.target)}</span></footer></button>`}
function projectsPage(){return heading('프로젝트','업무·일정·회의록·변경 이력을 프로젝트별로 모아 봅니다.',btn(icon('plus')+'프로젝트 만들기','new-project','','primary'),'PROJECTS')+`<div class="row" style="margin-bottom:18px"><label class="row grow" style="max-width:350px;background:white;border:1px solid var(--border);border-radius:8px;padding:0 12px">${icon('search',true)}<input id="project-search" aria-label="프로젝트 검색" placeholder="프로젝트명·고객사로 검색" style="border:0;width:100%"></label><span class="small muted">전체 ${db.projects.length}개</span></div><div class="project-grid" id="project-grid">${db.projects.map(projectCard).join('')}</div>`}

t:4px">${unscheduled.length}</span></h2>${icon('calendar',true)}</div>${unscheduled.map(t=>`<button class="unscheduled" data-action="task" data-id="${t.id}" draggable="true" data-drag-task="${t.id}">${icon('tasks',true)}<span><strong>${esc(t.title)}</strong><small>${esc(t.owner||'담당 미정')} · ${esc(project(t.project)?.code)}</small>${t.condition?`<span class="badge amber" style="font-size:9px;margin-top:6px;white-space:normal">${esc(t.condition)}</span>`:''}</span></button>`).join('')||'<p class="muted small" style="padding:17px">미정 업무가 없습니다.</p>'}<div class="panel-note">기한이 없는 업무도 여기서 확인하세요.</div></section><p class="calendar-hint">업무를 다른 날짜로 끌어 기한을 변경할 수 있습니다.<br>업무 상세에서도 기한을 직접 수정할 수 있습니다.</p></aside></div>`;

function calendarList(events,y,m){const rows=events.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>날짜</th><th>일정</th><th>담당자</th><th>유형</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${shortDate(e.date)}<small class="task-sub">${e.time}</small></td><td><button class="task-name" data-action="cal-event" data-kind="${e.kind}" data-id="${e.id}">${esc(e.title)}</button><small class="task-sub">${esc(project(e.project)?.code)}</small></td><td>${person(e.owner)}</td><td><span class="badge ${e.kind==='meeting'?'blue':e.kind==='milestone'?'purple':'teal'}">${({task:'업무',meeting:'회의',milestone:'목표일'})[e.kind]}</span></td></tr>`).join('')}</tbody></table></div>`:empty('이번 달에 등록된 일정이 없습니다.')}

n><span class="row">${badge(r.state)}${icon('chevron',true)}</span></button>`).join('')||'<p class="small muted">연결된 요구사항이 없습니다.</p>'}</section>${m.state!=='검토 완료'?`<div class="notice amber">${icon('spark')}<div><strong>분석·검토 흐름 체험</strong><p>원문을 확인하고 샘플 분석 결과를 검토할 수 있습니다.</p><button class="link small" style="margin-top:8px" data-action="meeting-demo" data-id="${m.id}">분석 미리보기 ${icon('arrow',true)}</button></div></div>`:''}</div></div>`}

function requirementsPage(){return heading('요구사항 이력','회의별 요청과 승인, 변경 근거를 이어서 확인하세요.',btn(icon('file')+'회의록 보기','nav','data-page="meetings"'),'REQUIREMENTS HISTORY')+`<div class="row" style="margin-bottom:17px">${scopePicker()}</div>`+requirementsArea()}
function requirementsArea(){const rs=scoped(db.requirements);let r=rs.find(r=>r.id===ui.req)||rs[0];if(!r)return `<section class="card">${empty('아직 요구사항 이력이 없습니다.','회의록 검토 후 요구사항을 연결해 보세요.')}</section>`;ui.req=r.id;
return `<div class="req-tabbar"><button class="${ui.reqTab==='history'?'active':''}" data-action="req-tab" data-tab="history">변경 이력</button><button class="${ui.reqTab==='compare'?'active':''}" data-action="req-tab" data-tab="compare">${icon('spark',true)} 이전 회의와 비교</button></div>${ui.reqTab==='compare'?reqCompare(r):`<div class="req-layout"><section class="card"><div class="section-head"><h2>요구사항 ${rs.length}개</h2>${icon('history',true)}</div>${rs.map(x=>`<button class="req-item ${r.id===x.id?'active':''}" data-action="req-select" data-id="${x.id}"><div class="spread"><small>${x.code}</small>${badge(x.state)}</div><h3>${esc(x.title)}</h3><small>현재 ${esc(x.value)} ${esc(x.unit)} · 이력 ${x.events.length}건</small></button>`).join('')}</section><section class="card card-pad"><div class="spread"><div><small class="muted">${r.code} · ${esc(project(r.project)?.code)}</small><h2 style="margin-top:4px">${esc(r.title)}</h2></div>${badge(r.state)}</div><div class="req-values"><div class="value-box"><label>현재 요청 / 검토값</label><strong>${esc(r.value)} <span style="font-size:12px;font-weight:400">${esc(r.unit)}</span></strong><small>${esc(r.state)}</small></div><div class="value-box approved"><label>마지막 승인값</label><strong>${esc(r.approved)} <span style="font-size:12px;font-weight:400">${esc(r.approvedUnit??r.unit)}</span></strong><small>고객 승인 기준 · 실제 적용은 별도 확인</small></div></div><div class="spread small muted" style="margin-bottom:20px"><span>담당 ${esc(r.owner||'미정')} · 기한 ${r.due?shortDate(r.due):'미정'}</span><button class="link small" data-action="req-work" data-id="${r.id}">연결 업무 ${db.tasks.filter(t=>t.req===r.id).length}건 ${icon('arrow',true)}</button></div><div class="spread" style="margin-bottom:18px"><h3 style="font-size:13px">회의별 변경 흐름</h3><select data-change="req-history-filter" aria-label="변경 이력 필터" style="font-size:11px;padding:4px 7px"><option value="all">전체 이력</option><option value="change" ${ui.reqFilter==='change'?'selected':''}>변경 요청</option><option value="approved" ${ui.reqFilter==='approved'?'selected':''}>승인·확정</option></select></div><ol class="timeline">${r.events.filter(e=>ui.reqFilter==='all'||ui.reqFilter==='change'&&e.kind.includes('변경')||ui.reqFilter==='approved'&&e.state==='확정').map(e=>{const m=meeting(e.meeting);return `<li><small>${esc(m?.date||TODAY)} · ${m?.seq||1}차 회의${e.reviewed?' · 사용자 체험 검토':''}</small><div class="timeline-card"><div class="spread"><h3>${esc(e.kind)}</h3>${badge(e.state)}</div><p><strong style="color:var(--ink)">${esc(e.value)} ${esc(r.unit)}</strong></p><p>당시 승인값 <strong>${esc(e.approved)} ${esc(r.unit)}</strong></p><p>${esc(e.note)}</p>${e.source>=0?`<button class="link" data-action="source" data-id="${e.meeting}" data-line="${e.source}">${icon('file',true)}${esc(m?.title||'연결 회의')} · 원문 근거 ${icon('chevron',true)}</button>`:'<small>목업 요약 데이터 · 연결 원문 없음</small>'}</div></li>`}).join('')}</ol></section></div>`}`}
function reqCompare(r){const ms=db.meetings.filter(m=>m.project===r.project&&m.date<=TODAY&&m.state!=='예정').sort((a,b)=>b.date.localeCompare(a.date));return `<section class="card card-pad"><div class="notice"><span>${icon('spark')}</span><div><strong>회의 간 비교·검토 체험</strong><p>요청값과 승인값을 구분하고, 반영할 후보를 선택하는 화면입니다. 분석 결과는 예시로 표시합니다.</p></div></div><div class="row wrap" style="margin:18px 0"><select id="compare-meeting" aria-label="비교할 회의">${ms.map(m=>`<option value="${m.id}" ${ui.reqDraft?.meeting===m.id?'selected':''}>${m.seq}차 · ${esc(m.title)}</option>`).join('')}</select>${btn(icon('spark')+'비교 흐름 체험','compare-run','','primary')}</div>${ui.reqDraft?`<form id="req-review-form"><div class="review-item"><div class="spread"><label class="check-inline"><input type="checkbox" name="accept" checked>변경 후보 반영</label><span class="badge purple">샘플 후보</span></div><h3>${esc(r.title)}</h3><div class="fields three">${field('요청값',`<input name="value" value="${esc(ui.reqDraft.value)}" required>`)}${field('단위',`<input name="unit" value="${esc(r.unit)}">`)}${field('합의 상태',`<select name="state">${['검토중','확정','철회'].map(s=>`<option ${ui.reqDraft.state===s?'selected':''}>${s}</option>`).join('')}</select>`)}</div><div class="quote">선택한 회의 이전의 승인값: ${esc(ui.reqDraft.previousApproved)} ${esc(r.unit)} · 검토중인 값은 승인값을 덮어쓰지 않습니다.</div>${field('검토 의견',`<textarea name="note" required placeholder="반영하거나 제외한 이유를 적어 주세요."></textarea>`)}<button class="btn primary" type="submit">${icon('check')}검토 이력에 반영</button></div></form>`:`${empty('비교할 회의를 선택하고 시작하세요.','후보 검토 → 반영 선택 → 이력 저장 순서로 체험합니다.')}`}</section>`}

function formatsPage(){return heading('문서 양식','프로젝트 문서의 작성 항목과 연결 기준을 확인하세요.','','DOCUMENT FORMATS')+formatsArea()}
function formatsArea(){return `<div class="notice" style="margin-bottom:20px">${icon('file')}<div><strong>핵심 문서 5종 · 작성 기준</strong><p>현재 기능은 양식과 항목 안내입니다. 아래에서 Markdown 초안을 내려받아 작성할 수 있습니다.</p></div></div><div class="format-grid">${FORMATS.map(([title,desc,sections,rule],i)=>`<section class="card format-card"><div class="spread"><span class="badge teal">DOC-0${i+1}</span>${btn(icon('download',true)+'초안 받기','format-export','data-index="'+i+'"','small')}</div><h2>${title}</h2><p>${desc}</p>${sections.map(s=>{const [name,fields]=s.split('|');return `<div class="format-section"><h3>${name}</h3><div class="chips">${fields.split(',').map(f=>`<span class="chip">${f}</span>`).join('')}</div></div>`}).join('')}<footer>${icon('warning',true)} ${rule}</footer>${i===0?`<button class="link small" style="margin-top:15px" data-action="new-meeting">회의록 등록하기 ${icon('arrow',true)}</button>`:''}</section>`).join('')}</div>`}
function helpPage(){return heading('사용 가이드','회의에서 정한 일이 완료될 때까지, 연결 흐름을 따라가 보세요.','','QUICK GUIDE')+`<section class="card card-pad"><div class="help-flow">${[['01','회의록 등록','원문을 입력하고 분석 흐름을 체험합니다.'],['02','근거 검토','내용과 담당자, 기한을 확인합니다.'],['03','업무 실행','조치 결과를 남기고 검토를 요청합니다.'],['04','PM 완료 확인','결과를 확인하고 완료 또는 보완을 결정합니다.']].map(([n,t,d])=>`<div><small class="muted">${n}</small><b>${t}</b><p>${d}</p></div>`).join('')}</div><div class="divider"></div><h2 style="font-size:16px">목업에서 눌러볼 수 있는 기능</h2><div class="info-grid">${[['캘린더','월·주·목록 전환, 일정 추가, 업무 날짜 이동'],['업무 관리','등록·수정, 담당자·기한, 조치 기록과 완료 검토'],['안건과 결정','안건별 업무 묶음, 보류·해결 기록'],['요구사항 이력','회의별 요청값·승인값과 원문 근거'],['회의록','원문 입력, 샘플 분석 결과 검토, 업무 등록'],['문서 양식','핵심 문서 5종 안내와 Markdown 초안 받기']].map(([t,d])=>`<div><strong>${t}</strong><p class="muted small" style="margin-top:5px">${d}</p></div>`).join('')}</div><div class="divider"></div><div class="notice amber">${icon('help')}<span>가상 데이터로 작동하는 디자인 목업입니다. 실제 서비스 저장·실제 AI 분석·DOCX 본문 추출·로그인은 연결되어 있지 않습니다. 변경은 이 HTML의 브라우저 저장 공간에만 기록됩니다.</span></div><div class="form-footer">${btn(icon('reset')+'체험 데이터 초기화','reset','','danger')}${btn('캘린더 살펴보기 '+icon('arrow'),'nav','data-page="calendar"','primary')}</div></section>`}
let activeLayer=null,returnFocus=null;
function closeLayers(){if(activeLayer?.cleanup)activeLayer.cleanup();$('#layers').innerHTML='';activeLayer=null;document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus();returnFocus=null}
function showLayer(html,type,meta={}){returnFocus=document.activeElement;$('#layers').innerHTML=html;activeLayer={type,...meta};document.body.style.overflow='hidden';const target=$('#layers [autofocus]')||$('#layers input:not([type=checkbox])')||$('#layers button');target?.focus()}
function modal(title,body,formId,footer='저장',meta={}){showLayer(`<div class="modal-wrap" data-close-outside="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form id="${formId}"><header class="modal-header spread"><h2>${title}</h2><button class="ib" data-action="close" type="button" aria-label="닫기">${icon('close')}</button></header><div class="modal-body"><div class="form-error" id="form-error" role="alert"></div>${body}</div><footer class="modal-footer"><button class="btn" type="button" data-action="close">취소</button><button class="btn primary" type="submit">${footer}</button></footer></form></section></div>`,'modal',meta)}
function formError(msg){const el=$('#form-error');if(el){el.textContent=msg;el.style.display='block';el.scrollIntoView?.({block:'nearest'})}else toast(msg)}
function openTask(id){const t=task(id);if(!t)return;const m=meeting(t.meeting),r=req(t.req),canEdit=isPm()||t.owner===ui.actor;
let actions='';if(t.category==='할일'){if(t.owner===ui.actor&&['미착수','보완요청'].includes(t.status))actions+=btn('업무 시작','task-action','data-kind="start"','small soft');if(t.owner===ui.actor&&['진행중','보완요청'].includes(t.status))actions+=btn('완료 검토 요청','task-action','data-kind="submit"','small primary');if(isPm()&&t.status==='검토요청')actions+=btn('보완 요청','task-action','data-kind="changes"','small')+btn(icon('check',true)+'완료 확인','task-action','data-kind="approve"','small primary');if(isPm()&&t.status==='완료')actions+=btn('업무 재개','task-action','data-kind="reopen"','small');}
showLayer(`<div class="overlay" data-close-outside="true"><section class="drawer" role="dialog" aria-modal="true" aria-label="업무 상세"><header class="drawer-head"><div class="spread"><span class="small muted">${esc(project(t.project)?.code)} <span style="margin:0 6px">/</span>${esc(t.id.toUpperCase())}</span><button class="ib" data-action="close" aria-label="업무 상세 닫기">${icon('close')}</button></div><h2>${esc(t.title)}</h2><div class="row wrap" style="margin-top:12px">${badge(t.status)}<span class="badge">${esc(t.category)}</span><span class="small muted">${t.events.length}개 기록</span></div></header><div class="drawer-body">${field('업무명',`<input id="detail-title" value="${esc(t.title)}" ${canEdit?'':'disabled'}>`)}<div class="fields">${field('담당자',`<select id="detail-owner" ${isPm()?'':'disabled'}>${personOptions(t.owner)}</select>`)}${field('기한',`<input id="detail-due" type="date" value="${esc(t.due)}" ${canEdit?'':'disabled'}>`)}</div>${t.condition?`<div class="notice amber" style="margin-top:13px">${icon('clock',true)}<span>선행 조건 · ${esc(t.condition)}<br><small>조건은 날짜를 설정해도 별도로 보관됩니다.</small></span></div>`:''}${t.category!=='할일'?`<div style="margin-top:15px">${field('합의 상태',`<select id="detail-agreement" ${isPm()?'':'disabled'}>${['검토중','확정','취소','불명확'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>`)}</div>`:''}<div class="drawer-section"><h3>업무 내용</h3><textarea id="detail-description" ${canEdit?'':'disabled'}>${esc(t.description)}</textarea></div><div class="drawer-section"><h3 class="row">${icon('link',true)}등록 근거와 연결</h3>${m?`<div class="source-card"><button class="link small" data-action="source" data-id="${m.id}" data-line="${t.evidence??0}">${icon('file',true)}${esc(m.title)} ${icon('chevron',true)}</button><p>${esc(m.source[t.evidence??0]||'회의록 원문을 확인해 주세요.')}</p></div>`:'<p class="muted small">직접 등록한 업무입니다.</p>'}${r?`<button class="source-card spread" style="width:100%;margin-top:10px;text-align:left" data-action="req-open" data-id="${r.id}"><span><small class="muted">${r.code}</small><strong style="display:block;font-size:12px">${esc(r.title)}</strong></span>${badge(r.state)}${icon('chevron',true)}</button>`:''}</div><div class="drawer-section"><h3 class="row">${icon('message',true)}조치 및 검토 기록</h3><textarea id="detail-note" placeholder="조치 결과, 검토 의견 또는 수정 사유를 적어 주세요."></textarea><p class="muted" style="font-size:11px;margin:8px 0 12px">${isPm()?'완료 검토와 담당자·기한 변경 사유를 기록할 수 있습니다.':'조치 결과를 기록한 뒤 완료 검토를 요청하세요.'}</p><div class="row wrap">${btn('메모 저장','task-action','data-kind="note"','small')}${actions}</div>${!isPm()&&t.owner!==ui.actor?'<p class="muted small" style="margin-top:10px">담당자 또는 PM 역할로 전환하면 진행 상태를 변경할 수 있습니다.</p>':''}</div><div class="drawer-section"><h3 class="row">${icon('history',true)}변경 및 조치 이력</h3>${t.events.map(e=>`<div class="history-entry"><strong>${esc(e.title)}</strong><small>${esc(e.who)} · ${esc(e.time)}</small><p>${esc(e.note)}</p></div>`).join('')}</div></div><footer class="drawer-foot">${btn('닫기','close')}${canEdit?btn('수정 사항 저장','save-task','','primary'):''}</footer></section></div>`,'task',{id})}
function saveTask(){const t=task(activeLayer.id),title=$('#detail-title').value.trim(),note=$('#detail-note').value.trim(),owner=$('#detail-owner').value,due=$('#detail-due').value,description=$('#detail-description').value,status=$('#detail-agreement')?.value||t.status;const changes=[];if(!title){toast('업무명을 입력하세요.');return}if(title!==t.title)changes.push('업무명: '+t.title+' → '+title);if(owner!==t.owner)changes.push(`담당자: ${t.owner||'미정'} → ${owner||'미정'}`);if(due!==t.due)changes.push(`기한: ${t.due||'미정'} → ${due||'미정'}`);if(description!==t.description)changes.push('업무 내용 수정');if(status!==t.status)changes.push(`합의 상태: ${t.status} → ${status}`);if(!changes.length){toast('변경된 내용이 없습니다.');return}if(!note){toast('변경 사유를 조치 및 검토 기록에 적어 주세요.');$('#detail-note').focus();return}t.title=title;t.owner=owner;t.due=due;t.description=description;t.status=status;log(t,'업무 수정',changes.join('\n')+'\n'+note);persist();render();openTask(t.id);toast('수정 사항과 변경 사유를 저장했습니다.')}
function taskAction(kind){const t=task(activeLayer.id),note=$('#detail-note').value.trim();if(!note){toast('조치 내용 또는 검토 사유를 적어 주세요.');$('#detail-note').focus();return}const map={note:['메모 추가',null],start:['업무 시작','진행중'],submit:['완료 검토 요청','검토요청'],approve:['PM 완료 확인','완료'],changes:['보완 요청','보완요청'],reopen:['업무 재개','진행중']};const [title,status]=map[kind]||[];if(!title)return;if(['approve','changes','reopen'].includes(kind)&&!isPm()){toast('PM 역할에서 처리할 수 있습니다.');return}if(['start','submit'].includes(kind)&&ui.actor!==t.owner){toast('배정된 담당자 역할에서 처리하세요.');return}if(status)t.status=status;log(t,title,note);persist();render();openTask(t.id);toast(title+' 기록을 저장했습니다.')}
function newTask(date=''){const p=ui.project||db.projects[0]?.id;modal('업무 등록',`<div class="fields">${field('프로젝트',`<select name="project" required>${pOptions(p,false)}</select>`)}${field('항목 종류',`<select name="category"><option>할일</option><option>고객요구</option><option>설계변경</option></select>`)}</div><div style="margin-top:15px">${field('업무 / 관리 항목',`<input name="title" required maxlength="180" placeholder="무엇을 해야 하는지 적어 주세요." autofocus>`)}</div>${field('상세 내용',`<textarea name="description" placeholder="배경, 완료 기준, 참고 사항"></textarea>`)}<div class="fields">${field('담당자',`<select name="owner">${personOptions()}</select>`)}${field('기한',`<input name="due" type="date" value="${date}">`)}</div><div style="margin-top:15px">${field('선행 조건 / 일정 조건 <small>선택</small>',`<input name="condition" placeholder="예: GA Rev.B 승인 후">`)}</div><div class="fields">${field('연결 안건',`<select name="agenda"><option value="">연결 안 함</option>${db.agendas.filter(a=>a.project===p).map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select>`)}${field('연결 요구사항',`<select name="req"><option value="">연결 안 함</option>${db.requirements.filter(r=>r.project===p).map(r=>`<option value="${r.id}">${r.code} · ${esc(r.title)}</option>`).join('')}</select>`)}</div>`,'task-form','업무 등록')}

function newSchedule(date=ui.selectedDate){modal('일정 등록',`<div class="fields">${field('일정 종류',`<select name="kind" data-change="schedule-kind"><option value="task">업무 기한</option><option value="meeting">회의 일정</option></select>`)}${field('프로젝트',`<select name="project" required>${pOptions(ui.project||db.projects[0].id,false)}</select>`)}</div><div style="margin-top:15px">${field('제목',`<input name="title" required placeholder="업무 또는 회의 제목" autofocus>`)}</div><div class="fields">${field('날짜',`<input name="date" type="date" value="${date}" required>`)}${field('시간 <small>회의 일정에 사용</small>',`<input name="time" type="time" value="14:00" disabled>`)}</div><div style="margin-top:15px">${field('담당자 <small>업무 기한에 사용</small>',`<select name="owner">${personOptions(ui.actor)}</select>`)}</div>${field('내용',`<textarea name="description" placeholder="확인할 내용이나 회의 안건"></textarea>`)}`,'schedule-form','일정 등록')}
function openDecision(id){const d=db.decisions.find(d=>d.id===id);if(!d)return;modal('추가 확인 사항 검토',`<div class="spread" style="margin-bottom:15px"><h3>${esc(d.title)}</h3>${badge(d.state)}</div><div class="source-card" style="margin-bottom:18px"><button type="button" class="link small" data-action="source" data-id="${d.meeting}" data-line="0">${icon('file',true)}${esc(meeting(d.meeting)?.title)}</button></div><div class="fields">${field('결정 담당자',`<select name="owner">${personOptions(d.owner)}</select>`)}${field('회신 기한',`<input name="due" type="date" value="${d.due}">`)}</div><div style="margin-top:15px">${field('상태',`<select name="state">${['대기','보류','해결'].map(s=>`<option ${s===d.state?'selected':''}>${s}</option>`).join('')}</select>`)}</div>${field('결정 결과 / 보류 사유',`<textarea name="result">${esc(d.result)}</textarea>`)}${field('변경 사유',`<textarea name="note" required placeholder="무엇을 확인했고 왜 변경하는지 적어 주세요."></textarea>`)}${d.events.length?`<div class="divider"></div><h3 style="margin-bottom:12px">결정 이력</h3>${d.events.map(e=>`<div class="history-entry"><strong>${esc(e.state)}</strong><small>${esc(e.who)} · ${esc(e.time)}</small><p>${esc(e.note)}</p></div>`).join('')}`:''}`,'decision-form','결정 기록 저장',{id})}

function sourceDrawer(id,line=0){const m=meeting(id);if(!m)return;ui.sourceHighlight=Number(line);showLayer(`<div class="overlay" data-close-outside="true"><section class="drawer" role="dialog" aria-modal="true" aria-label="회의록 원문 근거"><header class="drawer-head"><div class="spread"><span class="badge teal">${m.seq||1}차 회의 · ${m.date}</span><button class="ib" data-action="close" aria-label="닫기">${icon('close')}</button></div><h2>${esc(m.title)}</h2><p class="muted small" style="margin-top:7px">${esc(project(m.project)?.name)}</p></header><div class="drawer-body"><p class="small muted" style="margin-bottom:15px">강조된 원문과 앞뒤 문맥을 함께 확인하세요.</p><div class="meeting-source">${sourceHtml(m)}</div></div><footer class="drawer-foot">${btn('회의록 전체 보기 '+icon('arrow',true),'meeting','data-id="'+m.id+'"','primary')}</footer></section></div>`,'source',{id})}

function download(name,text,mime='text/plain'){const blob=new Blob([text],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCSV(){const rows=[['프로젝트','항목 종류','내용','담당자','기한','일정 조건','상태'],...visibleTasks().map(t=>[project(t.project)?.code,t.category,t.title,t.owner,t.due,t.condition,t.status])];const cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('PNT_업무목록_시안.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv');toast('현재 필터의 업무 목록을 내보냈습니다.')}

function stashReview(){const form=$('#review-form');if(!form||!ui.pending)return;const fd=new FormData(form);ui.pending.candidates.forEach((c,i)=>{c.checked=fd.has('accept-'+i);c.title=fd.get('title-'+i);c.owner=fd.get('owner-'+i);c.due=fd.get('due-'+i);c.category=fd.get('category-'+i)||c.category;c.agreement=fd.get('agreement-'+i)||'검토중'})}
function globalSearch(value){const el=$('#search-results'),q=value.trim().toLowerCase();if(!q){el.classList.remove('visible');return}const results=[...db.tasks.filter(t=>(t.title+t.owner).toLowerCase().includes(q)).slice(0,5).map(t=>({kind:'task',id:t.id,label:t.title,sub:'업무 · '+project(t.project)?.code})),...db.meetings.filter(m=>m.title.toLowerCase().includes(q)).slice(0,3).map(m=>({kind:'meeting',id:m.id,label:m.title,sub:'회의록 · '+m.date})),...db.requirements.filter(r=>(r.title+r.code).toLowerCase().includes(q)).slice(0,3).map(r=>({kind:'req-open',id:r.id,label:r.title,sub:'요구사항 · '+r.code}))];el.innerHTML=results.map(r=>`<button data-action="${r.kind}" data-id="${r.id}"><small>${esc(r.sub)}</small>${esc(r.label)}</button>`).join('')||'<p class="muted small" style="padding:12px">검색 결과가 없습니다.</p>';el.classList.add('visible')}

case'compare-run':{const r=req(ui.req),mid=$('#compare-meeting').value,m=meeting(mid),existing=r.events.find(e=>e.meeting===mid),previous=r.events.find(e=>{const prior=meeting(e.meeting);return prior&&(prior.date<m.date||prior.date===m.date&&prior.seq<m.seq)});ui.reqDraft={meeting:mid,value:existing?.value||'미기재',state:existing?.state||'검토중',previousApproved:previous?.approved||'미확정'};render();break}

}if(d.action!=='toggle-nav')document.body.classList.remove('mobile-open');});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;if(!d.change){if(el.id==='meeting-file'){const f=el.files[0];if(!f)return;$('#file-label').textContent=f.name;if(/\.(txt|md)$/i.test(f.name)){f.text().then(text=>{$('#meeting-source-input').value=text;toast('파일 원문을 불러왔습니다.')})}else toast('DOCX 본문 추출은 실제 서비스에서 지원합니다. 예시 불러오기로 검토 흐름을 체험하세요.')}if(activeLayer?.type==='modal'&&$('#task-form')&&el.name==='project'){const f=$('#task-form');f.elements.agenda.innerHTML='<option value="">연결 안 함</option>'+db.agendas.filter(a=>a.project===el.value).map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('');f.elements.req.innerHTML='<option value="">연결 안 함</option>'+db.requirements.filter(r=>r.project===el.value).map(r=>`<option value="${r.id}">${r.code} · ${esc(r.title)}</option>`).join('')}if($('#agenda-form')&&el.name==='project'){$('#agenda-tasks').innerHTML=agendaChecks(el.value,null)}return}switch(d.change){
case'actor':ui.actor=el.value;ui.owner='';render();toast((isPm()?'PM':'담당자')+' 역할로 전환했습니다.');break;

document.addEventListener('input',e=>{if(e.target.id==='global-search')globalSearch(e.target.value);if(e.target.id==='project-search'){const q=e.target.value;$('#project-grid').innerHTML=db.projects.filter(p=>(p.name+p.code+p.client).includes(q)).map(projectCard).join('')||empty('검색한 프로젝트가 없습니다.')}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form),v=name=>String(fd.get(name)||'').trim();switch(form.id){
case'task-form':{const p=v('project');if(!v('title'))return formError('업무 내용을 입력해 주세요.');const t={id:uid('t'),project:p,title:v('title'),category:v('category'),description:v('description'),owner:v('owner'),due:v('due'),condition:v('condition'),status:v('category')==='할일'?'미착수':'검토중',agenda:db.agendas.some(a=>a.id===v('agenda')&&a.project===p)?v('agenda'):'',req:db.requirements.some(r=>r.id===v('req')&&r.project===p)?v('req'):'',meeting:'',events:[]};log(t,'직접 등록','프로젝트 관리 항목으로 등록했습니다.');db.tasks.push(t);persist();closeLayers();render();openTask(t.id);toast('업무를 등록했습니다.');break}
case'project-form':{if(!v('name')||!v('code'))return formError('프로젝트명과 코드를 입력하세요.');const p={id:uid('p'),name:v('name'),code:v('code'),client:v('client'),description:v('description'),pm:v('pm'),target:v('target'),phase:'요구사항 검토',tone:''};db.projects.push(p);persist();openProject(p.id);toast('프로젝트를 만들었습니다.');break}
case'schedule-form':{if(!v('title')||!v('date'))return formError('제목과 날짜를 입력하세요.');const p=v('project');if(v('kind')==='meeting'){db.meetings.push({id:uid('m'),project:p,title:v('title'),date:v('date'),time:v('time')||'14:00',state:'예정',seq:db.meetings.filter(m=>m.project===p).length+1,source:[v('description')||'회의 안건을 준비해 주세요.']})}else{const t={id:uid('t'),project:p,title:v('title'),due:v('date'),owner:v('owner'),description:v('description'),status:'미착수',category:'할일',meeting:'',agenda:'',req:'',condition:'',events:[]};log(t,'일정에서 업무 등록',v('description')||'캘린더에서 등록했습니다.');db.tasks.push(t)}ui.selectedDate=v('date');ui.calDate=v('date');persist();closeLayers();render();toast('일정을 등록했습니다.');break}
case'decision-form':{if(!isPm())return formError('PM 역할에서 결정 기록을 저장할 수 있습니다.');if(!v('note'))return formError('변경 사유를 입력하세요.');if(['해결','보류'].includes(v('state'))&&!v('result'))return formError('결정 결과 또는 보류 사유를 입력하세요.');const d=db.decisions.find(d=>d.id===activeLayer.id);Object.assign(d,{owner:v('owner'),due:v('due'),state:v('state'),result:v('result')});d.events.unshift({state:d.state,who:ui.actor,time:nowLabel(),note:v('note')+'\n'+v('result')});persist();closeLayers();render();toast('결정 기록을 저장했습니다.');break}
case'agenda-form':{const a=db.agendas.find(a=>a.id===activeLayer.id),p=a?.project||v('project');if(!v('title')||!v('note'))return formError('안건명과 변경 사유를 입력하세요.');const id=a?.id||uid('a');if(a)a.title=v('title');else db.agendas.push({id,project:p,title:v('title'),req:''});const ids=fd.getAll('task');db.tasks.filter(t=>t.project===p).forEach(t=>{const next=ids.includes(t.id)?id:t.agenda===id?'':t.agenda;if(next!==t.agenda){t.agenda=next;log(t,'안건 연결 변경',v('note'))}});persist();closeLayers();render();toast('안건 묶음을 저장했습니다.');break}
case'search-form':{const type=activeLayer.searchType;if(type==='meeting')ui.meetingQuery=v('query');else ui.query=v('query');closeLayers();render();break}
case'meeting-form':{if(!v('title')||v('source').length<10){toast('회의명과 10자 이상의 회의 내용을 입력하세요.');return}ui.pending=buildPending({id:uid('m'),project:v('project'),title:v('title'),date:v('date'),time:'14:00',seq:db.meetings.filter(m=>m.project===v('project')).length+1,source:v('source').split(/\n+/).filter(Boolean),state:'검토 대기'});navigate('meetingReview');break}
case'review-form':{if(!fd.has('confirmed')){toast('원문 확인 체크가 필요합니다.');return}stashReview();const pending=ui.pending,accepted=pending.candidates.filter(c=>c.checked);if(!accepted.length){toast('등록할 항목을 하나 이상 선택하세요.');return}if(accepted.some(c=>!c.title.trim())){toast('선택한 항목의 내용을 입력하세요.');return}const {candidates,...m}=pending;m.state='검토 완료';m.reviewed=true;const i=db.meetings.findIndex(x=>x.id===m.id);if(i>=0)db.meetings[i]=m;else db.meetings.push(m);accepted.forEach(c=>{const t={id:uid('t'),project:m.project,title:c.title,owner:c.owner,due:c.due,category:c.category,status:c.category==='할일'?'미착수':c.agreement||'검토중',description:c.evidence,condition:c.condition||'',meeting:m.id,agenda:'',req:'',events:[]};log(t,'회의록 검토 후 등록','목업의 샘플 결과를 사용자가 확인했습니다.');db.tasks.push(t)});ui.meeting=m.id;ui.project=m.project;ui.pending=null;persist();navigate('meeting');toast(accepted.length+'개 항목을 업무에 등록했습니다.');break}
case'req-review-form':{if(!isPm()){toast('PM 역할에서 이력에 반영할 수 있습니다.');return}if(!v('note')){toast('검토 의견을 작성하세요.');return}if(!fd.has('accept')){ui.reqDraft=null;render();toast('후보를 제외했습니다.');return}const r=req(ui.req),draft=ui.reqDraft;r.approvedUnit=r.approvedUnit??r.unit;r.value=v('value');r.unit=v('unit');r.state=v('state');if(r.state==='확정'){r.approved=r.value;r.approvedUnit=r.unit}r.events.unshift({meeting:draft.meeting,kind:'사용자 검토',value:r.value,approved:r.approved,state:r.state,note:v('note'),source:0,reviewed:true});ui.reqDraft=null;ui.reqTab='history';persist();render();toast('선택한 후보를 검토 이력에 반영했습니다.');break}
case'reset-form':db=seed();persist();ui.project='';ui.projectId='p1';ui.req='r1';ui.pending=null;ui.reqDraft=null;ui.filter='all';ui.owner='';ui.query='';ui.taskTab='all';ui.calDate=TODAY;ui.selectedDate=TODAY;ui.calDone=false;ui.calMine=false;ui.calOwner='';ui.calStatus='all';ui.calType='all';ui.calView='month';ui.reqWork='';ui.actor='박서연';navigate('calendar');toast('체험 데이터를 초기화했습니다.');break;
}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLayers();$('#search-results')?.classList.remove('visible');document.body.classList.remove('mobile-open')}if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();$('#global-search')?.focus()}if(e.key==='Tab'&&activeLayer){const nodes=[...$('#layers').querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(n=>n.offsetParent!==null);if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1)||'home';if(p!==ui.page){ui.page=p;closeLayers();render()}});
render();
