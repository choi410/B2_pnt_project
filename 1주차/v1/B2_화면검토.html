lse&quot;&gt;&lt;b&gt;D사 정기 협의 #2 사양 변경 요청 접수&lt;/b&gt;&lt;small&gt;2026.07.09 · 3차 회의&lt;/small&gt;&lt;/button&gt;&lt;button class=&quot;b2v-mitem&quot; aria-current=&quot;false&quot;&gt;&lt;b&gt;롤프레스 1호기 내부 설계 착수 회의&lt;/b&gt;&lt;small&gt;2026.06.24 · 2차 회의&lt;/small&gt;&lt;/button&gt;&lt;button class=&quot;b2v-mitem&quot; aria-current=&quot;false&quot;&gt;&lt;b&gt;D사 롤프레스 1호기 킥오프 및 계약 사양 확인&lt;/b&gt;&lt;small&gt;2026.06.11 · 1차 회의&lt;/small&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;b2v-pagination&quot;&gt;&lt;button type=&quot;button&quot;&gt;이전&lt;/button&gt;&lt;span&gt;1–10 / 10건&lt;/span&gt;&lt;button type=&quot;button&quot;&gt;다음&lt;/button&gt;&lt;/div&gt;&lt;/nav&gt;&lt;section class=&quot;b2v-card&quot;&gt;&lt;div class=&quot;b2v-mhead&quot;&gt;&lt;span class=&quot;b2v-file&quot;&gt;가상회의록_롤프레스1호기_10_FAT사전협의.docx&lt;/span&gt;&lt;span class=&quot;b2v-document-tools&quot;&gt;줄번호·근거 보기&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;b2v-paper&quot;&gt;&lt;article class=&quot;b2v-doc&quot;&gt;&lt;header class=&quot;b2v-doc-heading&quot;&gt;&lt;span class=&quot;b2v-kicker&quot;&gt;P-2606 · 10차 회의&lt;/span&gt;&lt;h2&gt;D사 롤프레스 1호기 FAT 사전 협의&lt;/h2&gt;&lt;dl class=&quot;b2v-doc-facts&quot;&gt;&lt;dt&gt;일시&lt;/dt&gt;&lt;dd&gt;2026.11.04 10:00~12:00&lt;/dd&gt;&lt;dt&gt;장소&lt;/dt&gt;&lt;dd&gt;구미 본사 2층 대회의실 (D사 일부 화상)&lt;/dd&gt;&lt;dt&gt;작성자&lt;/dt&gt;&lt;dd&gt;설계 김지수&lt;/dd&gt;&lt;dt&gt;참석자&lt;/dt&gt;&lt;dd&gt;&lt;details&gt;&lt;summary&gt;12명 · 펼쳐보기&lt;/summary&gt;&lt;p&gt;설계 김지수(PM) · 제조 권재희 · 영업 이형준 · ETS 강경민 · 제어 김효준 · 설계 우지현 · 영업 전민지 · 제조 이재민 · D사 박정우 책임 · D사 정소라 선임 · D사 엄태호 책임 · D사 최현수 책임&lt;/p&gt;&lt;/details&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/header&gt;&lt;section class=&quot;b2v-doc-section&quot;&gt;&lt;h3&gt;회의 안건&lt;/h3&gt;&lt;p&gt;1. FAT 일정 확정&lt;/p&gt;&lt;p&gt;2. FAT 절차서 Rev.0 검토&lt;/p&gt;&lt;p&gt;3. 시험 전극 사급&lt;/p&gt;&lt;p&gt;4. 미결 사항 정리&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;b2v-doc-section&quot;&gt;&lt;h3&gt;논의 내용&lt;/h3&gt;&lt;p&gt;FAT: 12/15~12/17 3일, 구미 공장. D사 입회 4명 예정.&lt;/p&gt;&lt;p&gt;D사 엄태호 책임: 100m/min에서도 ±2μm로 판정 요청. 설계 김지수 차장: 7/23 합의(사양서 Rev.2)대로 90m/min ±2μm, 100m/min ±3μm임을 재확인하고 시뮬레이션 결과(±2.4μm) 설명. D사 박정우 책임: 계약 기준은 인정, 100m/min ±2μm는 참고 측정으로 요청.&lt;/p&gt;&lt;p&gt;D사 최현수 책임: 가열 롤 시험 때 공정 온도 90℃ 조건 두께 측정 추가 요청. 엄태호 책임: 측정 원본 데이터를 엑셀로 요청. 박정우 책임: 예비품 리스트와 2년치 소모품 목록 요청.&lt;/p&gt;&lt;p&gt;시험 전극: D사 정소라 선임이 3롤 동시 입고는 어렵고 2롤 11/27, 1롤 12/4 입고 가능하다고 함.&lt;/p&gt;&lt;p&gt;미결: 두께측정기 사급품 입고 일정 미정(D사 구매 확인 중). 표면 검사 카메라 공간은 10/15 이후 담당이 없어 검토되지 않은 것을 확인하고 설계 우지현 대리로 지정.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;b2v-doc-section&quot;&gt;&lt;h3&gt;결정 사항&lt;/h3&gt;&lt;p&gt;1. FAT를 2026-12-15~12-17로 확정함.&lt;/p&gt;&lt;p&gt;2. 판정 기준은 사양서 Rev.2대로 유지함. 100m/min ±2μm는 참고 측정만 하고 판정에서 제외함.&lt;/p&gt;&lt;p&gt;3. 가열 롤 90℃ 조건 두께 측정과 측정 원본 데이터 제공을 FAT 항목에 추가함.&lt;/p&gt;&lt;p&gt;4. 두께측정기가 11/30까지 들어오지 않으면 FAT는 오프라인 측정으로 대체함. 설계 동결일은 11/13으로 함.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;b2v-doc-section&quot;&gt;&lt;h3&gt;추가 확인 사항&lt;/h3&gt;&lt;p&gt;두께측정기 입고 일정과 FAT 입회자 명단은 D사가 회신하기로 했으나 일자는 정하지 않았다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;b2v-doc-section&quot;&gt;&lt;h3&gt;후속 조치&lt;/h3&gt;&lt;p class=&quot;b2v-action-line&quot;&gt;1. ETS 성슬기: FAT 절차서 Rev.1 송부 / 2026-11-11&lt;/p&gt;&lt;p class=&quot;b2v-action-line&quot;&gt;2. 설계 우지현: 검사 카메라 설치 공간 검토 회신 / 2026-11-11&lt;/p&gt;&lt;p class=&quot;b2v-action-line&quot;&gt;3. 설계 김지수: 사양서 Rev.5(최종 동결본) 발행 / 2026-11-13&lt;/p&gt;&lt;p class=&quot;b2v-action-line&quot;&gt;4. 영업 전민지: 예비품·2년치 소모품 목록 송부 / 2026-12-01&lt;/p&gt;&lt;/section&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;/template&gt;

    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
