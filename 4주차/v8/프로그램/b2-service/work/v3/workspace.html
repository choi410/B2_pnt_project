/* 변경이력: 사양별 한 줄 + 펼치면 값의 이력 */
.hx{margin-top:34px}
.hx-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hx-tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--chrome)}
.hx-tabs button{padding:6px 13px;border-radius:6px;font-size:0.866667rem;color:var(--muted)}
.hx-tabs button.on{background:var(--soft);color:var(--ink);font-weight:600}
.hx-tabs small{margin-left:6px;font-size:0.733333rem;color:var(--muted)}
.hx-row{border:1px solid var(--line);border-radius:10px;background:var(--chrome);margin-bottom:10px;overflow:hidden}
.hx-row.open{border-color:var(--blue)}
.hx-head{display:grid;grid-template-columns:18px minmax(180px,1.1fr) minmax(0,1.4fr) auto;gap:16px;align-items:center;width:100%;padding:16px 20px}
.hx-head:hover{background:var(--soft)}
.hx-chev{color:var(--muted);font-size:0.8rem}
.hx-name b{display:block;font-size:1rem;overflow-wrap:anywhere}
.hx-name small{display:block;color:var(--muted);font-size:0.733333rem;margin-top:3px}
.hx-now{min-width:0;font-size:0.933333rem}
.hx-now .change-value{margin:0}
.hx-now .card-condition{display:none}
.hx-state{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}
.hx-state small{color:var(--muted);font-size:0.733333rem}
.hx-body{border-top:1px solid var(--line);padding:20px 24px 6px 44px;background:var(--base)}
.hx-ev{position:relative;padding:0 0 22px 24px;border-left:1px solid var(--line)}
.hx-ev:last-child{border-left-color:transparent}
.hx-ev:before{content:'';position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--blue);outline:4px solid var(--base)}
.hx-ev.un:before{background:var(--base);border:2px solid var(--muted);width:7px;height:7px}
.hx-ev.un>*:not(.hx-meta):not(.hx-link){opacity:.6}
.hx-meta{display:flex;align-items:center;gap:10px;font-size:0.8rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.hx-label{color:var(--ink);font-weight:600}
.hx-ev.un .hx-label{color:var(--amber);font-weight:400}
.hx-rev{padding:1px 7px;border:1px solid var(--line);border-radius:4px;font-size:0.733333rem}
.hx-quotes{border-left:2px solid var(--amber);padding:2px 0 2px 12px;margin:10px 0 8px;font-size:0.866667rem;color:var(--muted);line-height:1.75}
.hx-quotes p{margin:0 0 5px}
.hx-link{padding:0;color:var(--blue);font-size:0.8rem}
.hx-note{margin-top:18px}
@media(max-width:800px){.hx-head{grid-template-columns:18px minmax(0,1fr) auto}.hx-now{grid-column:2/-1;grid-row:2}.hx-body{padding-left:24px}}

.hx-now .change-value,.hx-now .change-value strong,.hx-now .change-value .before{font-size:0.933333rem!important;font-weight:500;line-height:1.5}
.hx-now .change-value strong{font-weight:600}
.hx-now .change-value{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hx-body .change-value,.hx-body .change-value strong{font-size:1.06667rem!important}

.hx-tools{align-items:center}
.hx-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.hx-filters select{padding:7px 9px;max-width:230px}
.hx-search{padding:7px 11px;width:200px;font-size:0.866667rem}
.hx-row{margin-bottom:6px;border-radius:8px}
.hx-head{padding:10px 16px;gap:14px}
.hx-name b{display:inline;font-size:0.966667rem}
.hx-name small{display:inline;margin:0 0 0 10px}
.hx-state{flex-direction:row;align-items:center;gap:10px}

.hx-filters select.on{border-color:var(--blue)}
.hx-filters select:disabled{opacity:.55}
.hx-pager{justify-content:center;gap:6px;margin:18px 0 4px}
.hx-pager button{min-width:30px;height:30px;border-radius:6px;font-size:0.866667rem;display:grid;place-items:center}
.hx-pager button.on{background:var(--soft);color:var(--blue);font-weight:600}
.hx-pager span{margin-right:10px}

.hx-label.rev{color:var(--blue)}
.hx-label.same,.hx-label.req{color:var(--muted);font-weight:400}
.hx-cur{font-size:0.733333rem;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:1px 7px;font-weight:600}
.hx-sub{display:block;font-size:0.733333rem;color:var(--muted);margin-top:2px}
.hx-sub.warn{color:var(--amber)}

/* 변경이력: 넓은 화면은 표 + 오른쪽 상세 */
main:has(.hx){max-width:min(2000px,96vw)}
body:has(.hx) .topbar,body:has(.ai-layout) .topbar{padding:0 max(30px,calc((100vw - min(2000px,96vw))/2 + 32px))}
main:has(.ai-layout){max-width:min(2000px,96vw)}

.hx-list{min-width:0}

.hx-thead{padding:0 18px 8px;font-size:0.733333rem;color:var(--muted);letter-spacing:.3px}
.hx-row{margin-bottom:6px;border-radius:8px}
.hx-row .hx-tr:hover{background:var(--soft)}

.hx-c-name b{display:block;font-size:1rem;overflow-wrap:anywhere;line-height:1.45}
.hx-c-name small{display:block;font-size:0.733333rem;color:var(--muted);margin-top:2px}
.hx-c-cat,.hx-c-date{font-size:0.8rem;color:var(--muted)}
.hx-c-now{min-width:0;font-size:0.933333rem}
.hx-c-now .change-value,.hx-c-now .change-value strong,.hx-c-now .change-value .before{font-size:0.933333rem!important;line-height:1.5}
.hx-c-now .change-value{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.hx-c-now .card-condition{display:none}
.hx-c-cnt{font-size:0.8rem}
.hx-c-cnt small{display:block;font-size:0.733333rem;color:var(--amber)}
.hx-inline{display:none}
.hx-expand{display:none}
.hx-detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--chrome)}
.hx-dhead{padding:20px 24px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--chrome);z-index:1}
.hx-dhead small{color:var(--muted);font-size:0.766667rem}
.hx-dhead h2{font-size:1.4rem;margin:6px 0 12px}
.hx-dnow{display:flex;flex-direction:column;gap:4px}
.hx-dlabel{display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--muted)}
.hx-dnow .change-value{margin:0}
.hx-detail .hx-body{border-top:0;background:transparent;padding:20px 24px 4px 34px}
.hx-pager{margin-top:14px}
@media(max-width:1350px){
 .hx-split{grid-template-columns:1fr}
 .hx-detail{display:none}
 .hx-inline{display:block}
 .hx-expand{display:inline-flex}
 .hx-row.on{box-shadow:none}
 .hx-row.open{border-color:var(--blue)}
}
@media(max-width:900px){
 .hx-thead{display:none}
 .hx-tr{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
 .hx-c-name{grid-column:1}.hx-c-st{grid-column:2;grid-row:1}
 .hx-c-now{grid-column:1/-1}
 .hx-c-cat,.hx-c-date,.hx-c-cnt,.hx-c-rev{display:none}
}

/* 프로젝트 흐름 */
.st0{--c:#7c63d6}.st1{--c:#3d7fe0}.st2{--c:#1aa3b8}.st3{--c:#d9902a}.st4{--c:#2f9e6e}.st5{--c:#e0703d}.st6{--c:#c95a9b}.st7{--c:#6b7a90}
.pf-stagebox{margin:-6px 0 22px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--chrome)}
.pf-chev{display:flex}
.pf-chev .pf-st{flex:1;min-width:0;height:54px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:0.9rem;color:var(--muted);background:var(--base);
 clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);margin-left:-10px;padding:0 14px 0 24px;white-space:nowrap}
.pf-chev .pf-st:first-child{margin-left:0;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);padding-left:14px;border-radius:8px 0 0 8px}
.pf-chev .pf-st small{font-size:0.7rem;opacity:.7}
.pf-chev .pf-st.done{background:color-mix(in srgb,var(--c) 30%,var(--base));color:var(--ink)}
.pf-chev .pf-st.cur{background:var(--c);color:#fff;font-weight:700;font-size:1rem}
.pf-stagenote{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:0.9rem}
.pf-now{display:inline-flex;align-items:center;gap:10px;color:var(--muted)}
.pf-now b{font-size:1.15rem;color:var(--ink)}
.pf-tag{font-style:normal;padding:2px 8px;border-radius:4px;font-size:0.733333rem;background:var(--soft);color:var(--blue)}
.pf-tag.warn{background:var(--ambersoft);color:var(--amber)}
.pf-why{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--base);font-size:0.866667rem}
.pf-why span{color:var(--muted)}.pf-why small{color:var(--muted)}.pf-why i{font-style:normal;color:var(--blue)}
.pf-why:hover{border-color:var(--blue)}
.pf-stagesel{margin-left:auto;padding:7px 10px;font-size:0.866667rem}
.pf-stages.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.pf-stages.mini .pf-st{height:6px;border-radius:3px;background:var(--line)}
.pf-stages.mini .pf-st.done{background:color-mix(in srgb,var(--c) 45%,var(--line))}
.pf-stages.mini .pf-st.cur{background:var(--c)}
.pf-cardstage{margin:-6px 0 16px}
.pf-mini small{display:block;font-size:0.733333rem;color:var(--muted);margin-top:6px}
.pf-cardcnt{display:flex;gap:6px;margin-top:6px}
.pf-cardcnt em,.pf-badge{font-style:normal;font-size:0.733333rem;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--blue);white-space:nowrap}
.pf-cardcnt em.warn,.pf-badge.warn{background:var(--ambersoft);color:var(--amber)}
.pf-tabs{margin-bottom:0}
.pf-wrap{margin-top:24px;display:flex;flex-direction:column;gap:22px}
.pf-box{border:1px solid var(--line);border-radius:12px;background:var(--chrome);padding:20px 22px;min-width:0}
.pf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.pf-head h2{font-size:1.15rem}
.pf-head small{font-size:0.8rem}
.pf-grid{display:grid;gap:4px}
.pf-span{height:28px;border-radius:6px;background:var(--c);color:#fff;font-size:0.8rem;font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.pf-span.none{background:var(--base);color:var(--muted);font-weight:400;border:1px dashed var(--line)}
.pf-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:78px;border-radius:8px;background:var(--base);border:1px solid var(--line);padding:6px 2px}
.pf-cell small{font-size:0.733333rem;color:var(--muted);white-space:nowrap}
.pf-cell b{font-size:1.3rem;line-height:1.1}
.pf-cell:hover:not(:disabled){border-color:var(--muted)}
.pf-cell.empty{opacity:.45}
.pf-cell.on{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 1px var(--blue)}
.pf-marks{display:flex;gap:4px;height:8px}
.pf-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.pf-dot.chg{background:var(--blue)}.pf-dot.un{background:var(--amber)}
.pf-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:0.8rem;color:var(--muted)}
.pf-legend span{display:inline-flex;align-items:center;gap:6px}
.pf{display:grid;grid-template-columns:minmax(300px,0.8fr) minmax(0,1.3fr) minmax(380px,1fr);gap:22px;align-items:start}
.pf-listtools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}

.pf-check{display:inline-flex;align-items:center;gap:7px;font-size:0.866667rem;color:var(--muted);cursor:pointer}
.pf-mlist,.pf-spec,.pf-open{list-style:none;margin:0;padding:0}
.pf-mlist li+li,.pf-spec li+li,.pf-open li+li{border-top:1px solid var(--line)}
.pf-mlist button{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 8px;border-radius:7px;text-align:left}
.pf-mlist button:hover{background:var(--soft)}
.pf-mlist button.on{background:var(--soft);box-shadow:inset 3px 0 var(--blue)}
.pf-mdate{font-size:0.866667rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pf-mtitle b{display:block;font-size:0.933333rem;line-height:1.45;overflow-wrap:anywhere}
.pf-mtitle small{display:block;font-size:0.766667rem;color:var(--muted);margin-top:2px}
.pf-detail .pf-head h2{font-size:1.3rem;margin-top:4px}
.pf-sum{margin:0 0 18px;line-height:1.85;font-size:0.933333rem;padding:14px 16px;background:var(--base);border-radius:8px}
.pf-part{border-top:1px solid var(--line);padding:12px 0 4px}
.pf-parthead{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 0 8px}
.pf-parthead b{font-size:0.966667rem}
.pf-parthead small{color:var(--muted);font-size:0.8rem}
.pf-part ul{margin:0 0 6px;padding-left:20px;font-size:0.9rem;line-height:1.7}
.pf-part li{margin-bottom:6px;overflow-wrap:anywhere}
.pf-part li.pf-chg{list-style:none;margin-left:-20px;display:grid;grid-template-columns:minmax(120px,0.8fr) minmax(0,1.4fr) auto;gap:10px;align-items:start;padding:7px 0}
.pf-part li.pf-chg.un>b,.pf-part li.pf-chg.un>span{opacity:.7}
.pf-side{display:flex;flex-direction:column;gap:22px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.pf-spec button,.pf-open button{display:grid;align-items:center;gap:12px;width:100%;padding:11px 6px;border-radius:7px;text-align:left}
.pf-spec button{grid-template-columns:minmax(110px,0.9fr) minmax(0,1.2fr) auto}
.pf-spec button:hover,.pf-open button:hover{background:var(--soft)}
.pf-spec li.un button{opacity:.6}
.pf-spec-t b{display:block;font-size:0.9rem;overflow-wrap:anywhere}
.pf-spec-t small{display:block;font-size:0.733333rem;color:var(--muted);margin-top:2px}
.pf-spec-v{min-width:0}
.pf-spec .change-value,.pf-spec .change-value strong,.pf-spec .change-value .before{font-size:0.9rem!important;line-height:1.5;margin:0}
.pf-spec .card-condition{display:none}
.pf-note{margin:12px 0 0;font-size:0.8rem}
.pf-open button{grid-template-columns:auto minmax(0,1fr)}
.pf-open button b{font-size:0.9rem}
.pf-open button small{grid-column:2;color:var(--muted);font-size:0.8rem}

/* step76: 변경이력 상세 - 접기·정렬·흐름 화살표·작은 수정 버튼 */
.hx-evtools{display:flex;align-items:center;gap:14px;margin:0 0 14px -10px;font-size:0.8rem}
.hx-flowcap{color:var(--muted);margin-right:auto}
.hx-ev{border-left:2px solid var(--blue);padding:0 0 26px 22px}
.hx-ev:last-child{border-left-color:transparent}
.hx-ev:before{left:-7px;top:5px;width:12px;height:12px}
.hx-arrow{position:absolute;left:-8px;bottom:3px;font-style:normal;font-size:13px;line-height:1;color:var(--blue);background:var(--chrome);padding:1px 0}
.hx-desc .hx-arrow{bottom:auto;top:26px}
.hx-meta{display:flex;align-items:center;gap:8px;min-height:1.8rem}

.hx-evtog>i{font-style:normal;width:1em;color:var(--muted)}
.hx-evtog:hover time{color:var(--blue)}
.hx-edit{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border:0;background:transparent;color:var(--muted);font-size:0.766667rem;white-space:nowrap}

.hx-evval{margin:6px 0 0}
.hx-ev.shut .hx-evval{cursor:pointer}
.hx-ev.shut{padding-bottom:20px}
/* step77: 변경이력 상세 다듬기 - 위계 3단(값 > 차수 > 날짜), 가는 연결선, 문장 단위 줄바꿈 */
.hx-detail .hx-body{padding:18px 26px 8px 40px}
.hx-evtools{margin:0 0 18px -14px;font-size:0.866667rem}
.hx-ev{border-left:1px solid var(--line);padding:0 0 30px 26px}
.hx-ev:last-child{border-left-color:transparent;padding-bottom:10px}
.hx-ev:before{left:-5px;top:7px;width:9px;height:9px;background:var(--chrome);border:2px solid var(--muted);outline:4px solid var(--chrome);box-sizing:border-box}
.hx-asc .hx-ev:last-child:before,.hx-desc .hx-ev:first-of-type:before{background:var(--blue);border-color:var(--blue)}
.hx-arrow{left:-6px;bottom:6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--chrome);padding:2px 0;line-height:1}
.hx-desc .hx-arrow{top:30px;bottom:auto}
.hx-meta{gap:10px;margin-bottom:6px;min-height:1.6rem}
.hx-evtog{gap:10px;font-size:0.933333rem}
.hx-evtog time{color:var(--muted);font-variant-numeric:tabular-nums}
.hx-evtog>i{font-size:0.8rem;margin-left:-2px}
.hx-evtog .hx-label{font-size:0.866667rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--base);color:var(--ink)}
.hx-evtog .hx-label.rev{background:var(--soft);color:var(--blue)}
.hx-evtog .hx-label:empty{display:none}
.hx-evtog .status{font-size:0.8rem}
.hx-edit{font-size:0.8rem}
.hx-evval{margin:2px 0 0}
.hx-body .change-value,.hx-body .change-value strong{font-size:1.25rem!important;line-height:1.55}
.hx-body .change-value>span,.hx-body .change-value del{font-size:1.05rem}
.hx-quotes{border-left:3px solid var(--line);padding:4px 0 4px 16px;margin:14px 0 10px;font-size:1.02rem;color:var(--ink);line-height:1.8}
.hx-quotes p{margin:0 0 10px}
.hx-quotes p:last-child{margin-bottom:0}
.hx-quotes p span{display:block}
.hx-quotes p span+span{margin-top:4px}
.hx-ev .hx-link{font-size:0.9rem}
.hx-dhead small{font-size:0.866667rem}
.hx-dhead h2{font-size:1.6rem;margin:8px 0 14px}
/* step78: 변경이력 상세 재설계 (번호 단계 + 카드) */
.hx-dhead{padding:22px 26px 18px}
.hx-dhead h2{font-size:1.45rem;margin:4px 0 14px;line-height:1.35}
.rv-now{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--soft)}
.rv-now.none{background:var(--base)}
.rv-now .k{font-size:0.766667rem;color:var(--blue);font-weight:700;white-space:nowrap}
.rv-now.none .k{color:var(--muted)}
.rv-now .v{font-size:1.2rem;font-weight:700;color:var(--ink);overflow-wrap:anywhere;min-width:0}
.rv-now.none .v{font-size:0.933333rem;font-weight:400;color:var(--muted)}
.rv-now .v del{font-weight:400;color:var(--muted);text-decoration:none;font-size:1rem}
.rv-now .t{margin-left:auto;font-size:0.766667rem;color:var(--blue);white-space:nowrap}
.rv-after{margin:10px 2px 0;font-size:0.8rem;color:var(--amber)}
.tl{padding:18px 26px 22px}
.hx-inline .tl{padding:14px 18px 16px;background:var(--base)}
.tl-tools{display:flex;align-items:center;gap:16px;font-size:0.8rem;margin-bottom:16px;color:var(--muted)}
.tl-tools b{font-weight:600;color:var(--ink);margin-right:auto}
.tl-tools button{color:var(--blue);padding:0}
.tl-item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 14px}
.tl-rail{display:flex;flex-direction:column;align-items:center}
.tl-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:0.8rem;font-weight:700;background:var(--chrome);border:2px solid #b8c4d4;color:var(--muted);flex:none}
.tl-item.cur .tl-num{background:var(--blue);border-color:var(--blue);color:var(--blueink)}
.tl-item.req .tl-num{border-style:dashed;border-color:#d9a441;color:var(--amber)}
.tl-conn{flex:1;width:2px;background:#cfd8e3;min-height:26px;position:relative;margin:4px 0}
.tl-conn:after{content:'';position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:6px solid transparent;border-top:8px solid #9fb0c5;border-bottom:0}
.tl-desc .tl-conn:after{bottom:auto;top:-1px;border-top:0;border-bottom:8px solid #9fb0c5}
.tl-card{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;background:var(--chrome);min-width:0}
.tl-item.cur .tl-card{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.tl-item.req .tl-card{border-style:dashed;border-color:#e5c88a;background:color-mix(in srgb,var(--ambersoft) 35%,var(--chrome))}
.tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.8rem;color:var(--muted)}
.tl-head time{font-variant-numeric:tabular-nums}
.tl-tag{font-weight:700;color:var(--ink)}
.tl-item.cur .tl-tag{color:var(--blue)}
.tl-item.req .tl-tag{color:var(--amber)}
.tl-curflag{font-size:0.7rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--blue);color:var(--blueink)}
.tl-rev{font-size:0.7rem;padding:0 7px;border:1px solid var(--line);border-radius:4px}
.tl-edit{margin-left:auto;padding:0;font-size:0.766667rem;color:var(--muted)}
.tl-edit:hover:not(:disabled){color:var(--blue);text-decoration:underline}
.tl-val{margin-top:4px;font-size:1.05rem;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.tl-val del{font-weight:400;color:var(--muted);text-decoration:none}
.tl-val.long{font-weight:500;font-size:0.966667rem;line-height:1.65}
.tl-more{margin-top:8px;padding:0;font-size:0.8rem;color:var(--blue)}
.tl-quotes{margin:10px 0 4px;padding:10px 14px;border-radius:8px;background:var(--base);font-size:0.933333rem;line-height:1.75;color:var(--ink)}
.tl-quotes p{margin:0 0 8px}.tl-quotes p:last-child{margin:0}
.tl-quotes span{display:block}.tl-quotes span+span{margin-top:4px}
.tl-link{display:block;margin-top:6px;padding:0;font-size:0.8rem;color:var(--blue)}
.tl-fix{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:0.8rem;color:var(--muted)}.tl-fix .rv-btn{padding:4px 12px;font-size:0.8rem}
.rv-screened{margin:8px 0 12px;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;font-size:0.8rem;color:var(--muted)}
.rv-screened summary{cursor:pointer}
.rv-screened p{margin:8px 0 0;color:var(--ink);line-height:1.6}
.rv-screened p small{color:var(--muted)}
.rv-screened>small{display:block;margin-top:8px}
/* step94: 월별 회의 카드 페이지 */
.pf-chips{max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pf-chip{min-width:0;max-width:none}
@media(max-width:1300px){.pf-chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pf-pager{justify-content:center;margin:12px 0 0;gap:6px}
.pf-pager span{margin-right:8px}
.pf-pager button{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);font-size:0.866667rem;color:var(--ink);display:grid;place-items:center}
.pf-pager button.on{background:var(--blue);border-color:var(--blue);color:var(--blueink);font-weight:700}

/* step96: 월 6칸 페이지 + 등록 팝업 */
.pf-mwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 10px;align-items:stretch}
.pf-mwrap.nav{grid-template-columns:40px minmax(0,1fr) 40px}
.pf-mwrap .pf-months{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pf-mwrap .pf-mon{padding:12px 6px 10px;gap:3px;border-radius:9px;min-height:4.6rem;justify-content:center}
.pf-mwrap .pf-mon small{font-size:0.9rem}
.pf-mwrap .pf-mon b{font-size:1.0667rem}
.pf-mon.blank{visibility:hidden}
.pf-mnav{display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--chrome);font-size:1.5rem;line-height:1;color:var(--ink)}
.pf-mnav:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.pf-mnav:disabled{opacity:.3}
.pf-mpg{grid-column:1/-1;display:flex;justify-content:center;gap:6px}
.pf-mpg button{width:22px;height:6px;border-radius:3px;background:var(--line);padding:0}
.pf-mpg button.on{background:var(--blue)}
.rv-pop{width:440px;border-radius:16px;border:0;overflow:hidden}
.rv-pop .modal-body{padding:34px 32px 24px;text-align:center}
.rv-pop-ic{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 16px;border-radius:50%;font-style:normal;font-size:1.7rem;font-weight:700;line-height:1;background:var(--ambersoft);color:var(--amber)}
.rv-pop.done .rv-pop-ic{background:var(--soft);color:var(--blue)}
.rv-pop h2{font-size:1.2667rem;margin-bottom:10px}
.rv-pop p{margin:0;font-size:0.9667rem;line-height:1.75;color:var(--muted)}
.rv-pop p b{color:var(--amber);font-weight:700}
.rv-pop p.muted{margin-top:12px;font-size:0.8667rem}
.rv-pop-prog{margin:20px 0 0;padding:14px 16px;border-radius:10px;background:var(--base);display:flex;align-items:center;gap:12px}
.rv-pop-bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.rv-pop-bar span{display:block;height:100%;border-radius:4px;background:var(--blue)}
.rv-pop-prog small{font-size:0.8667rem;color:var(--ink);font-weight:600;white-space:nowrap}
.rv-pop>footer{border-top:0;padding:4px 32px 28px;justify-content:center;gap:8px}
.rv-pop>footer .rv-btn{flex:1 1 auto;text-align:center;padding:11px 16px;font-size:0.9333rem;border-radius:9px;background:var(--chrome)}
.rv-pop>footer .rv-pri{background:var(--blue);border-color:var(--blue);color:var(--blueink);font-weight:600;flex-grow:2}

.project-code{align-items:center}.project-made{margin-left:auto;margin-right:12px;font-style:normal;letter-spacing:0;font-size:0.8rem;color:var(--muted);white-space:nowrap}

/* step100: 유사 프로젝트명 확인 */
.up-near{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--chrome);font-size:0.8333rem;line-height:1.5;overflow:hidden;box-shadow:0 1px 3px #0000000d}
.up-near>b{display:flex;align-items:center;gap:7px;padding:10px 13px;font-size:0.8667rem;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line)}
.up-near>b:before{content:'!';display:grid;place-items:center;flex:none;width:18px;height:18px;border-radius:50%;background:var(--ambersoft);color:var(--amber);font-size:0.75rem;font-weight:800}
.up-near-doc,.up-near-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 9px;align-items:start;padding:10px 13px 0}
.up-near em{font-style:normal;font-size:0.7rem;font-weight:600;color:var(--muted);background:var(--base);border-radius:4px;padding:1px 0;text-align:center;margin-top:1px}
.up-near-row em{background:var(--soft);color:var(--blue)}
.up-near-doc span{color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.up-near-row span{font-weight:600;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.up-near-yes{grid-column:1/-1;margin-top:5px;padding:7px 10px;border-radius:7px;background:var(--blue);color:var(--blueink);font-size:0.8rem;font-weight:600;text-align:center}
.up-near-yes:hover{filter:brightness(1.1)}
.up-near-new{display:block;width:calc(100% - 26px);margin:8px 13px 12px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:0.8rem;color:var(--muted);text-align:center}
.up-near-new:hover{color:var(--ink);border-color:var(--muted)}

.rv-regbar>span{margin-right:auto}.rv-regbar{justify-content:flex-end}.rv-allok{padding:9px 16px;font-size:0.9rem;font-weight:600;border-color:var(--blue);color:var(--blue);background:var(--chrome);white-space:nowrap}

.up-clear{color:var(--muted)}.up-clear:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}

/* step103: 등록·분석 중 취소 */
.pm-headtools{display:flex;align-items:center;gap:14px}
.pm-cancelall{padding:5px 12px;border:1px solid var(--line);border-radius:7px;background:var(--chrome);font-size:0.8rem;color:var(--ink);white-space:nowrap}
.pm-cancelall:hover{border-color:var(--amber);color:var(--amber)}
.processing-row{position:relative;border-top:1px solid var(--line)}
.processing-row:first-child{border-top:0}
.processing-row>.processing-meeting{border-top:0}
.processing-row:first-child>.processing-meeting{padding-top:4px}
.pm-cancel{position:absolute;right:34px;top:14px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);font-size:0.7667rem;color:var(--muted);white-space:nowrap}
.processing-row:first-child .pm-cancel{top:2px}
.pm-cancel:hover{border-color:var(--amber);color:var(--amber)}
.processing-meeting-heading{padding-right:84px}
.processing-meeting-heading>svg{margin-right:-84px}

.rv-bulk{display:flex;justify-content:flex-end;gap:8px;margin:0 0 12px}.rv-bulk .rv-btn{padding:7px 14px;font-size:0.8667rem}.rv-allundo{background:var(--chrome);color:var(--muted)}

.rv-grouptools{display:flex;align-items:center;gap:8px;flex:none}.rv-group .rv-allundo{padding:5px 12px;font-size:0.8rem}

/* step107: 고객 승인 메일 (팀원 배근우 v4_mail_demo_bae 에서 가져옴) */
/* Customer approval mail */
:root{--ok:#9fe0bd;--oksoft:#1f3d33;--bad:#ffb4ab;--badsoft:#45282a}:root[data-theme="light"]{--ok:#0e6b45;--oksoft:#dff3e8;--bad:#b3261e;--badsoft:#fbe3e3}
.status.approval-approved{background:var(--oksoft);color:var(--ok)}.status.approval-rejected{background:var(--badsoft);color:var(--bad)}.status.approval-expired,.status.approval-canceled{color:var(--muted)}
.meeting-name .status+.status{margin-left:6px}
.approval-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:-10px 0 20px;font-size:0.866667rem;color:var(--muted)}.approval-comment{flex-basis:100%;color:var(--ink)}
.approval-link{overflow-wrap:anywhere}.approval-link a{color:var(--blue)}
.modal textarea,.approval-form textarea{display:block;width:100%;margin-top:6px;resize:vertical}.approval-form label{margin-bottom:12px}
.approval-history{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.approval-history h4{margin:0 0 6px;font-size:0.866667rem;color:var(--muted)}.approval-history p{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:6px 0;font-size:0.866667rem}.approval-history small{flex-basis:100%;color:var(--muted)}
.approval-page{max-width:850px;margin:0 auto;padding:32px 16px 64px}.approval-card{background:var(--chrome);border:1px solid var(--line);border-radius:14px;padding:26px 30px;margin-bottom:18px}.approval-card h1{font-size:1.333333rem;margin:14px 0 12px}
.approval-card dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 16px;margin:0 0 14px}.approval-card dt{color:var(--muted)}.approval-card dd{margin:0;overflow-wrap:anywhere}
.approval-message{white-space:pre-wrap;background:var(--base);border-radius:7px;padding:10px 12px;margin:0 0 14px}
.approval-form{border-top:1px solid var(--line);padding-top:14px}.approval-form .actions{display:flex;gap:10px;margin-top:12px}.approval-form .button{min-width:110px;justify-content:center}.button.reject{color:var(--bad);border-color:var(--bad)}
.approval-result{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:12px 14px;background:var(--soft)}.approval-result.approved{background:var(--oksoft);color:var(--ok)}.approval-result.rejected{background:var(--badsoft);color:var(--bad)}.approval-result p{margin:4px 0 0}.approval-result svg{flex-shrink:0;margin-top:3px}
@media(max-width:640px){.approval-card{padding:20px 16px}}

/* Approval page: meeting minutes in the company form layout (always a white sheet, like the printed form) */
.approval-pages{border-radius:10px}
.minutes-doc{max-width:850px;margin:0 auto;background:#fff;color:#1c2733;padding:44px 52px 52px;border:1px solid var(--line);font-family:'Malgun Gothic','Segoe UI',sans-serif;font-size:14.5px;line-height:1.7}
.minutes-doc header{border-left:6px solid #2f6fd0;padding:2px 0 0 16px;margin-bottom:18px}

.minutes-doc table{width:100%;border-collapse:collapse;margin:0 0 18px}
.minutes-info{border-top:2px solid #17365d;border-bottom:2px solid #17365d}

.minutes-table thead th{width:auto}.minutes-table{font-size:14px}
.minutes-doc section{margin-top:14px}
.minutes-doc h2{margin:0 0 8px;padding:3px 0 5px 12px;border-left:5px solid #2f6fd0;border-bottom:1px solid #c9d6e6;color:#17365d;font-size:1.1rem}

/* step108: 고객 승인 메일 화면 다듬기 */
.status[class*="approval-"]{font-weight:600;padding:2px 9px;border-radius:999px}
.status.approval-sent{background:var(--ambersoft);color:var(--amber)}
.status.approval-expired,.status.approval-canceled{background:var(--base);border:1px solid var(--line)}
.meeting-name .status[class*="approval-"]{margin-left:6px}
.approval-line{margin:-12px 0 22px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--chrome);gap:6px 12px;width:fit-content;max-width:100%}
.approval-line>span:nth-child(2){font-size:0.8333rem}
.approval-comment{margin-top:2px;padding:8px 12px;border-left:3px solid var(--line);background:var(--base);border-radius:0 6px 6px 0;font-size:0.9rem}
.modal-body>h3:first-child{font-size:1.0667rem;margin:0 0 16px;padding:10px 13px;border-radius:8px;background:var(--base);font-weight:600}
.approval-history p{padding:7px 0;margin:0;border-top:1px solid var(--line)}.approval-history p:first-of-type{border-top:0}
.approval-history h4{margin-bottom:2px}
.approval-link{padding:10px 12px;border-radius:8px;background:var(--base);font-size:0.8667rem}
.approval-page{padding-top:40px}
.approval-card{padding:30px 34px;border-radius:16px;box-shadow:0 6px 24px #0000000f}
.approval-card .brand img{height:34px;width:auto}
.approval-card h1{font-size:1.5rem;margin:16px 0 16px}
.approval-card dl{gap:8px 20px;padding:14px 16px;border-radius:10px;background:var(--base);margin-bottom:16px;font-size:0.9333rem}
.approval-card dt{font-size:0.8333rem;padding-top:1px}.approval-card dd{font-weight:600}
.approval-message{border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:11px 14px}
.approval-form{padding-top:18px}.approval-form>.muted{margin:0 0 14px}
.approval-form label{display:block;font-size:0.8667rem;color:var(--muted)}
.approval-form textarea{min-height:84px;color:var(--ink)}
.approval-form .actions{margin-top:16px;gap:10px}
.approval-form .button{flex:1;padding:12px 16px;font-size:1rem;font-weight:700;border-radius:9px}
.approval-form .button.reject{flex:0 0 130px;background:var(--chrome)}
.approval-result{align-items:center;gap:14px;padding:16px 18px;border-radius:10px}
.approval-result>b:first-child{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--chrome);font-size:1.2rem}
.approval-result small{font-weight:400;opacity:.8;margin-left:4px}
.approval-result .muted{color:inherit;opacity:.75}


/* step110: 합의 항목 표시 */
.approval-line{display:block}
.approval-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.approval-row>span:nth-child(2){font-size:0.8333rem}
.approval-toggle{padding:0;font-size:0.8333rem;color:var(--blue);font-weight:600}
.approval-apply{margin-left:auto;padding:6px 12px;font-size:0.8333rem}
.approval-line .approval-comment{display:block;margin-top:8px}
.approval-items{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.approval-items li{display:grid;grid-template-columns:minmax(120px,32%) minmax(0,1fr);gap:4px 14px;padding:7px 10px;border-radius:7px;background:var(--base);font-size:0.8667rem;line-height:1.55}
.approval-items li b{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.approval-items li span{color:var(--ink);overflow-wrap:anywhere}
.approval-preview{margin:0 0 14px}
.approval-preview>b{display:block;font-size:0.8667rem;color:var(--muted);font-weight:600}
.modal .approval-preview{margin:4px 0 12px}
.approval-card .approval-preview{margin:0 0 16px}
.approval-card .approval-items li{font-size:0.9333rem;padding:9px 12px}
.tl-agree{font-size:0.7333rem;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.tl-agree.approved{background:var(--oksoft);color:var(--ok)}
.tl-agree.rejected{background:var(--badsoft);color:var(--bad)}
.tl-agree.sent{background:var(--ambersoft);color:var(--amber)}
@media(max-width:640px){.approval-items li{grid-template-columns:1fr}}


/* step111: 회의록 목록 고객 합의 열 */
.meeting-header,.meeting-row{grid-template-columns:minmax(0,1fr) 220px 105px 104px 65px 16px}
.approval-cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:0.8rem;min-width:0}
.approval-cell small{font-size:0.7333rem;color:var(--muted);white-space:nowrap}
.ap-st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:0.7667rem;font-weight:600;white-space:nowrap}
.ap-st.approved{background:var(--oksoft);color:var(--ok)}
.ap-st.rejected{background:var(--badsoft);color:var(--bad)}
.ap-st.sent{background:var(--ambersoft);color:var(--amber)}
.ap-st.expired{background:var(--base);border:1px solid var(--line);color:var(--muted)}
.ap-none{color:var(--line);font-size:0.9rem;padding-left:4px}
.mt-sep{width:1px;align-self:stretch;margin:4px 4px;background:var(--line)}
@media(max-width:1050px){.meeting-header,.meeting-row{grid-template-columns:minmax(0,1fr) 165px 95px 92px 16px}}
@media(max-width:560px){.meeting-row{grid-template-columns:minmax(0,1fr) 80px}.approval-cell{grid-column:2;grid-row:2;align-items:flex-end}.approval-cell small{display:none}}

/* step112: 합의 진행 이력 */
.ap-flow{list-style:none;margin:12px 0 2px;padding:0 0 0 4px;position:relative}
.ap-flow li{position:relative;display:grid;grid-template-columns:92px 104px minmax(0,1fr);align-items:baseline;gap:4px 10px;padding:6px 0 6px 22px;font-size:0.8667rem}
.ap-flow li:before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.ap-flow li:first-child:before{top:13px}.ap-flow li:last-child:before{bottom:calc(100% - 13px)}
.ap-flow li:only-child:before{display:none}
.ap-flow i{position:absolute;left:0;top:8px;width:12px;height:12px;border-radius:50%;background:var(--chrome);border:2px solid var(--muted);box-sizing:border-box}
.ap-flow time{color:var(--muted);font-size:0.8rem;white-space:nowrap}
.ap-flow b{font-weight:700;white-space:nowrap}
.ap-flow span{color:var(--muted);overflow-wrap:anywhere}
.ap-flow-send i{border-color:var(--blue);background:var(--blue)}.ap-flow-send b{color:var(--blue)}
.ap-flow-approved i{border-color:var(--ok);background:var(--ok)}.ap-flow-approved b{color:var(--ok)}
.ap-flow-rejected i{border-color:var(--bad);background:var(--bad)}.ap-flow-rejected b{color:var(--bad)}
.ap-flow-rejected span,.ap-flow-approved span{color:var(--ink)}
.ap-flow-wait i{border-color:var(--amber)}.ap-flow-wait b{color:var(--amber)}
.ap-flow-applied i{border-color:var(--ok);background:var(--chrome)}.ap-flow-applied b{color:var(--ok)}
.ap-flow-muted b{color:var(--muted);font-weight:600}
.ap-flow-empty{margin:10px 0 0}
@media(max-width:640px){.ap-flow li{grid-template-columns:1fr}}
/* 회의록 목록: 프로젝트 열 제거 */
.meeting-header,.meeting-row{grid-template-columns:minmax(0,1fr) 105px 104px 65px 16px}
@media(max-width:1050px){.meeting-header,.meeting-row{grid-template-columns:minmax(0,1fr) 95px 92px 16px}}
@media(max-width:560px){.meeting-row{grid-template-columns:minmax(0,1fr) 80px}}


.ai-question-trigger{border:0;background:transparent;box-shadow:none;color:var(--blue);gap:7px}.ai-question-trigger:hover:not(:disabled){color:var(--ink);filter:none}

/* 프로젝트 화면: 보기 전환과 변경이력 검색 조건 */
.tabs.pf-tabs{display:flex;width:100%;gap:20px;padding:0;margin:0 0 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.tabs.pf-tabs>button{display:inline-flex;align-items:center;gap:7px;padding:8px 4px;border:0;border-bottom:2px solid transparent;border-radius:0;font-size:1rem;font-weight:500;color:var(--muted);background:transparent;box-shadow:none}
.tabs.pf-tabs>button.active{background:transparent;color:var(--blue);border-bottom:2px solid var(--blue);box-shadow:none}
.tabs.pf-tabs>button:hover:not(.active){background:transparent;color:var(--ink)}
.tabs.pf-tabs>button:before{content:none!important}
.history-toolbar{margin-bottom:8px}
.history-toolbar-main{display:grid;grid-template-columns:minmax(190px,320px) minmax(150px,280px) max-content;justify-content:start;align-items:stretch;gap:8px}
.history-toolbar-main select,.history-search-field,.history-filter-toggle{min-height:38px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);font-size:.933333rem;line-height:1.4}
.history-project-select{width:100%;min-width:0;max-width:100%;padding:5px 10px;text-overflow:ellipsis}
.history-search-field{display:flex;gap:7px;align-items:center;padding:0 10px;min-width:0;color:var(--muted)}
.history-search-field>svg{flex-shrink:0}
.history-search-field input{width:100%;min-width:0;border:0;background:transparent;padding:5px 0;font-size:inherit;line-height:inherit;color:var(--ink)}
.history-search-field:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 14%,transparent)}
.history-search-field input:focus{outline:none;box-shadow:none}
.history-filter-toggle{display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:5px 10px;white-space:nowrap;color:var(--ink)}
.history-filter-toggle[aria-expanded=true]{color:var(--blue);border-color:var(--blue);background:var(--soft)}
.history-filter-toggle .is-open{transform:rotate(180deg)}
.history-filter-count{min-width:19px;padding:0 5px;border-radius:5px;background:var(--soft);color:var(--blue);font-size:.8rem;text-align:center}
.history-filter-panel{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(120px,.65fr) minmax(220px,1.55fr);max-width:820px;gap:12px;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:6px;background:var(--chrome)}
.history-filter-panel[hidden]{display:none}
.history-filter-panel label{display:grid;gap:5px;min-width:0;color:var(--muted);font-size:.866667rem}
.history-filter-panel select{width:100%;min-width:0;min-height:36px;padding:5px 9px;font-size:.933333rem;line-height:1.4;color:var(--ink);text-overflow:ellipsis}
.history-filter-panel select:disabled{opacity:.6}
.history-active-filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.history-filter-chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:5px 9px;border-radius:6px;background:var(--soft);color:var(--blue);font-size:.866667rem}
.history-filter-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30rem}
.history-filter-chip svg{flex-shrink:0}
.history-clear-filters{font-size:.866667rem;color:var(--muted);padding:5px 7px}
.history-clear-filters:hover{color:var(--blue)}
.history-list-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;min-height:26px;color:var(--muted);font-size:.866667rem}
.history-list-tools button{padding:3px 0;color:var(--muted);font-size:inherit}
.history-list-tools button:hover:not(:disabled){color:var(--blue)}
@media(max-width:850px){.history-filter-panel{grid-template-columns:1fr 1fr}.history-filter-panel label:last-child{grid-column:1/-1}}
@media(max-width:560px){.history-toolbar-main{grid-template-columns:minmax(0,1fr) auto}.history-project-select{grid-column:1/-1}}
@media(max-width:480px){.history-filter-panel{grid-template-columns:minmax(0,1fr);padding:10px}.history-filter-chip span{max-width:100%}}
@media(pointer:coarse){.history-toolbar-main select,.history-search-field,.history-filter-toggle,.history-filter-panel select{min-height:44px}}

/* 변경이력 왼쪽 선택 목록: 상세 내용과 동작은 기존 구성 유지 */
.history-items-layout .hx-split{grid-template-columns:minmax(220px,30fr) minmax(0,70fr);gap:24px}
.history-items-layout .hx-tr{grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;padding:14px 12px}
.history-items-layout .hx-c-name{grid-column:1;grid-row:1;min-width:0}
.history-items-layout .hx-c-name b{font-size:1rem;font-weight:600;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.history-items-layout .hx-c-st{grid-column:2;grid-row:1;align-self:start}
.history-items-layout .hx-c-st .status{font-size:.8rem;line-height:1.5;padding:2px 7px;font-weight:500}
.history-items-layout .hx-c-now{grid-column:1/-1;grid-row:2}
.history-items-layout .hx-c-now .change-value{display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-height:0;margin:0}
.history-items-layout .hx-c-now .change-value,.history-items-layout .hx-c-now .change-value strong,.history-items-layout .hx-c-now .change-value .before{font-size:.933333rem!important;line-height:1.45;font-weight:500}
.history-items-layout .hx-c-now .change-value.statement{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.history-items-layout .hx-c-now .change-value svg{width:15px;height:15px;flex:none}
.history-items-layout .hx-c-cat{display:block;grid-column:1/-1;grid-row:3;font-size:.8rem;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.history-items-layout .hx-row{border-radius:7px;margin-bottom:5px}
.history-items-layout .hx-row.on{background:var(--soft);border-color:var(--blue);box-shadow:none}
.history-items-layout .hx-pager{flex-wrap:wrap}
@media(min-width:901px) and (max-width:1350px){
 .history-items-layout .hx-detail{display:block}
 .history-items-layout .hx-inline,.history-items-layout .hx-expand{display:none}
}
@media(max-width:1050px){.history-items-layout .hx-split{gap:16px;grid-template-columns:minmax(205px,30fr) minmax(0,70fr)}}
@media(max-width:900px){
 .history-items-layout .hx-split{grid-template-columns:1fr}
 .history-items-layout .hx-detail{display:none}
 .history-items-layout .hx-inline{display:block}
 .history-items-layout .hx-expand{display:inline-flex}
}

/* Compact conditions and editable subject categories. */
.history-detail-conditions{position:relative;align-self:stretch}
.history-detail-conditions .history-filter-toggle{height:100%}
.history-detail-conditions .history-filter-panel{position:absolute;right:0;top:calc(100% + 7px);z-index:30;grid-template-columns:minmax(0,1fr);width:310px;max-width:calc(100vw - 52px);margin:0;gap:12px;padding:14px;border-radius:9px;box-shadow:0 12px 32px color-mix(in srgb,var(--ink) 14%,transparent)}
.history-detail-conditions .history-filter-panel label:last-child{grid-column:auto}
.history-filter-heading,.history-filter-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.history-filter-heading b{font-size:.933333rem;font-weight:600}
.history-filter-heading button{padding:3px;line-height:1}
.history-filter-actions button{padding:5px 7px;font-size:.866667rem;color:var(--blue)}
.history-state-row{display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.history-state-filters{display:flex;flex-wrap:wrap;gap:4px}
.history-state-filters button{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:6px;padding:4px 10px;font-size:.866667rem;color:var(--muted);background:transparent}
.history-state-filters button[aria-pressed=true]{background:var(--soft);border-color:color-mix(in srgb,var(--blue) 30%,var(--line));color:var(--blue);font-weight:600}
.history-state-filters button span{font-size:.8rem;font-weight:400}
.history-result-count{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:.866667rem}
.history-state-row>.hx-expand{font-size:.866667rem;white-space:nowrap;padding:4px 0;color:var(--muted)}
.history-meta-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px 12px}
.history-meta-row>small{grid-column:1;grid-row:1}
.history-meta-row>h2{grid-column:1/-1;grid-row:2;margin-top:0}
.history-meta-row .history-category-editor{display:contents}
.history-category-toggle{display:inline-flex;align-items:center;gap:5px;justify-self:end;padding:2px 0!important;font-size:.866667rem!important;white-space:nowrap;color:var(--blue)!important}
.history-meta-row .history-category-toggle{grid-column:2;grid-row:1}
.history-category-form{grid-column:1/-1;display:grid;gap:10px;width:100%;margin:8px 0;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--base)}
.history-category-form label{display:grid;gap:5px;min-width:0;font-size:.866667rem;color:var(--muted)}
.history-category-form select,.history-category-form input{width:100%;min-width:0;padding:7px 9px;font-size:.933333rem;color:var(--ink);border:1px solid var(--line);border-radius:6px;background:var(--chrome)}
.history-category-form small{font-size:.8rem;color:var(--muted)}
.history-category-form .error{margin:0;font-size:.866667rem}
.history-category-add{display:inline-flex;align-items:center;gap:5px;justify-self:start;padding:4px 0;color:var(--blue);font-size:.866667rem}
.history-category-actions{display:flex;justify-content:flex-end;gap:7px}
.history-category-actions button{padding:6px 10px;font-size:.866667rem}
.history-category-actions button.primary{background:var(--blue);color:var(--chrome);border-radius:6px}
.history-inline-category{margin-bottom:10px}
.history-inline-category .history-category-editor{display:flex;flex-direction:column;align-items:flex-end}
@media(max-width:560px){
 .history-toolbar-main{grid-template-columns:minmax(0,1fr) auto}
 .history-project-select{grid-column:1/-1}
 .history-state-row{flex-wrap:wrap;gap:6px}
 .history-state-filters{gap:2px}
 .history-state-filters button{padding:5px 7px}
 .history-state-row>.hx-expand{margin-left:auto}
 .history-meta-row{grid-template-columns:1fr}
 .history-meta-row .history-category-toggle{grid-column:1;grid-row:auto}
}
@media(pointer:coarse){
 .history-state-filters button,.history-category-toggle,.history-category-actions button,.history-category-add{min-height:44px}
}

/* One project context beside the main navigation. */
.topbar{position:sticky;top:0;z-index:50;gap:20px}
.topbar>nav{flex:0 0 auto}

.global-project-trigger:hover:not(:disabled),.global-project-trigger[aria-expanded=true]{color:var(--blue)}
.global-project-code{font-size:.866667rem;font-weight:400;white-space:nowrap}
.global-project-panel{position:absolute;top:calc(100% + 9px);left:0;z-index:60;width:360px;max-width:calc(100vw - 48px);max-height:min(34rem,calc(100dvh - 8rem));display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px color-mix(in srgb,var(--ink) 15%,transparent)}
.global-project-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.933333rem}
.global-project-heading b{font-weight:600}
.global-project-search{display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--base);color:var(--muted)}
.global-project-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 14%,transparent)}
.global-project-search input{width:100%;min-width:0;border:0;background:transparent;padding:7px 0;font-size:.933333rem;line-height:1.5;color:var(--ink)}
.global-project-search input:focus{outline:none;box-shadow:none}
.global-project-options{display:grid;gap:3px;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.global-project-option{display:grid;grid-template-columns:minmax(0,1fr) 18px;gap:4px 9px;align-items:center;width:100%;padding:10px;border-radius:6px;text-align:left}
.global-project-option>span{font-size:.933333rem;overflow-wrap:anywhere}
.global-project-option>small{grid-column:1;grid-row:2;color:var(--muted);font-size:.8rem}
.global-project-option>svg{grid-column:2;grid-row:1/3;color:var(--blue)}
.global-project-option:hover,.global-project-option[aria-pressed=true]{background:var(--soft)}
.global-project-option[aria-pressed=true]>span{color:var(--blue)}
.global-project-all{border-bottom:1px solid var(--line);border-radius:0;margin-bottom:4px;padding-bottom:13px}
.global-project-empty{padding:10px;font-size:.866667rem;color:var(--muted);margin:0}
.meeting-project-context{font-size:.866667rem;color:var(--muted);max-width:20rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calendar-project-context{font-size:.8rem;color:var(--muted);max-width:13rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.history-toolbar-main{grid-template-columns:minmax(150px,280px) max-content}
@media(max-width:1100px){
 .topbar{height:auto;min-height:5.2rem;flex-wrap:wrap;gap:10px 18px;padding-top:10px;padding-bottom:10px}
 body:has(.hx) .topbar,body:has(.pf-tabs) .topbar{padding:10px 24px}
 .topbar>.brand{order:0}
 .topbar>nav{order:1;flex:1;min-height:2.6rem;align-self:stretch;gap:20px}
 .topbar>.ai-question-trigger{order:2;margin-left:0}
 .topbar>.account{order:3}
 .topbar>.global-trash{order:4}
 .topbar>.display-settings{order:5}
 .topbar>.global-project{order:6;flex-basis:100%;margin:0}
 .global-project-panel{max-height:min(30rem,calc(100dvh - 12rem))}
}
@media(min-width:561px) and (max-width:800px){
 .topbar>.brand{margin-right:auto}
 .topbar>nav{order:6;flex:1 0 calc(100% - 280px)}
 .topbar>.global-project{order:7;flex:0 0 auto}
}
